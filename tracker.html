<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный трекер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- THEME SYSTEM ----
     --amber / --amber2 are the ACCENT slots (kept under the old names so every
     existing rule keeps working); they're swapped by [data-look].
     Surfaces + text are swapped by [data-theme], spacing by [data-density]. */
  :root{
    /* surfaces & text — dark (default) */
    --bg:#17140F; --panel:#211B14; --card:#2A2318; --card2:#342B1D;
    --white:#F4EEE2; --grey:#A89A82; --grey-dim:#6E6350;
    --border:#3D3221;
    --shadow:0 10px 30px -12px rgba(0,0,0,.55);
    --shadow-hover:0 14px 34px -14px rgba(0,0,0,.6);
    --texture:rgba(255,255,255,.012);
    /* status palette — dark */
    --pink:#C15C48; --purple:#D9A441; --cyan:#4C8C88; --green:#83A972;
    --ok-bg:#16351f; --ok-fg:#34D399;
    --bad-bg:#3a1c1c; --bad-fg:#FF6B81;
    --info-bg:#0e3a42; --info-fg:#22D3EE;
    --frozen-fg:#7FB3D5; --frozen-border:#3a5a72;
    --warn-bg1:#4a1a10; --warn-bg2:#5a2010; --warn-fg:#FF8A65;
    --on-green:#0d1f08; --on-pink:#2b0e08;
    --streak-bg1:#3a2410; --streak-bg2:#4a2a0c;
    /* accent — amber (default) */
    --amber:#E8703A; --amber2:#F2A65A; --on-accent:#26130a;
    --glow1:rgba(232,112,58,.10); --glow2:rgba(76,140,136,.08);
    /* density — comfortable (default) */
    --card-pad:16px; --card-radius:18px; --card-gap:14px;
    --row-pad:10px 12px; --row-radius:12px; --app-pad:18px 14px 96px;
    --font-display:'Instrument Serif',serif; --font-body:'Inter',system-ui,sans-serif;
    font-family:var(--font-body);
  }

  html[data-theme="light"]{
    --bg:#F6F1E6; --panel:#FDFAF3; --card:#F1EBDD; --card2:#E7E0CE;
    --white:#2B241A; --grey:#6E6350; --grey-dim:#9A8F7C;
    --border:#DFD6C2;
    --shadow:0 8px 22px -14px rgba(80,60,30,.35);
    --shadow-hover:0 12px 28px -14px rgba(80,60,30,.45);
    --texture:rgba(90,70,40,.020);
    --pink:#B3462F; --purple:#B07F1E; --cyan:#2F6E6A; --green:#4F7F3F;
    --ok-bg:#DCEEDB; --ok-fg:#2E7D46;
    --bad-bg:#FAE0DB; --bad-fg:#B23A28;
    --info-bg:#D8EEED; --info-fg:#256B67;
    --frozen-fg:#35708F; --frozen-border:#B7D3E4;
    --warn-bg1:#FBE2D3; --warn-bg2:#F7D3BC; --warn-fg:#A8421A;
    --on-green:#FFFFFF; --on-pink:#FFFFFF;
    --streak-bg1:#FBEAD7; --streak-bg2:#F6DCC0;
  }

  html[data-density="compact"]{
    --card-pad:11px; --card-radius:14px; --card-gap:9px;
    --row-pad:7px 9px; --row-radius:10px; --app-pad:12px 10px 84px;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, var(--glow2), transparent 55%),
      repeating-linear-gradient(0deg, var(--texture) 0px, var(--texture) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased;
    transition:background-color .25s ease,color .25s ease;}
  .app{max-width:1100px;margin:0 auto;padding:var(--app-pad);}
  header{padding:6px 4px 20px;}
  .today-label{font-family:var(--font-display);font-style:italic;color:var(--amber2);font-size:13px;margin:0 0 6px;letter-spacing:.2px;}
  header h1{margin:0 0 4px;font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:.2px;
    background:linear-gradient(100deg,var(--amber2),var(--amber) 45%,var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header p.sub{margin:0;color:var(--grey);font-size:12.5px;letter-spacing:.2px;}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);color:var(--grey);
    padding:9px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:.18s ease;}
  nav.tabs button.active{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);
    border-color:transparent;box-shadow:0 4px 16px -4px rgba(232,112,58,.55);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;
    background:var(--panel);border-radius:14px;padding:8px 10px;border:1px solid var(--border);}
  .month-nav button{background:var(--card);border:1px solid var(--border);color:var(--white);
    width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;transition:.15s;}
  .month-nav button:hover{border-color:var(--amber);color:var(--amber2);}
  .month-nav .label{font-family:var(--font-display);font-weight:600;font-size:16px;flex:1;text-align:center;}

  .card{background:var(--panel);border-radius:var(--card-radius);padding:var(--card-pad);margin-bottom:var(--card-gap);border:1px solid var(--border);
    box-shadow:var(--shadow);transition:.2s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
  .card h2{margin:0 0 12px;font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

  /* KPI dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{border-radius:16px;padding:16px;background:var(--card);border-top:3px solid var(--cyan);position:relative;
    box-shadow:var(--shadow);}
  .kpi .t{font-size:10.5px;color:var(--grey);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
  .kpi .v{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1;}
  .kpi .s{font-size:11px;color:var(--grey-dim);margin-top:6px;}

  table.month-table{width:100%;border-collapse:separate;border-spacing:0;}
  .row-wrap{display:flex;flex-direction:column;gap:8px;}
  .item-row{background:var(--card);border-radius:var(--row-radius);padding:var(--row-pad);border:1px solid transparent;transition:.15s;}
  .habit-note{width:100%;background:transparent;border:none;color:var(--grey);font-size:11.5px;font-family:var(--font-body);
    padding:0 0 6px;margin-top:-2px;}
  .habit-note::placeholder{color:var(--grey-dim);}
  .habit-note:focus{outline:none;color:var(--white);}
  .item-row:hover{border-color:var(--border);}
  /* the name owns its own line — pills used to squeeze it down to a few letters */
  .item-row .top{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
  .item-row input.name{flex:1;min-width:0;background:transparent;border:none;color:var(--white);
    font-size:14.5px;font-weight:600;padding:2px 0;font-family:var(--font-body);
    text-overflow:ellipsis;}
  .item-row input.name:focus{outline:none;border-bottom:1px solid var(--amber);text-overflow:clip;}
  .item-row .top .type-toggle,.item-row .top .arch-btn,.item-row .top .del{flex:0 0 auto;}
  .item-row .meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:7px;}
  .item-row .meta:empty{display:none;}
  .item-row .meta .pct-pill{margin-left:auto;}
  .pct-pill{font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .days-scroll{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none;}
  .days-scroll::-webkit-scrollbar{display:none;height:0;}
  .day-cell{flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--grey-dim);
    font-family:'JetBrains Mono',monospace;cursor:pointer;border:1px solid transparent;user-select:none;transition:.12s;}
  .day-cell:hover{border-color:var(--amber);}
  .day-cell.done{background:linear-gradient(150deg,var(--amber2),var(--amber));color:var(--on-accent);font-weight:800;border-color:transparent;}
  .day-cell.frozen{background:var(--card);color:var(--frozen-fg);border-color:var(--frozen-border);}
  .progress-bar{height:6px;border-radius:5px;background:var(--card2);margin-top:7px;overflow:hidden;}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:5px;}

  .type-toggle{background:var(--card2);border:1px solid var(--border);color:var(--grey);border-radius:8px;
    padding:3px 8px;font-size:13px;cursor:pointer;line-height:1;}
  .type-toggle:hover{border-color:var(--amber);}
  .counter-target{width:42px;background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:3px 5px;font-size:11px;font-family:'JetBrains Mono',monospace;text-align:center;}

  .todo-row{display:grid;grid-template-columns:24px 1fr 130px 112px 24px;gap:8px;align-items:center;
    background:var(--card);border-radius:10px;padding:8px 9px;margin-bottom:6px;}
  .todo-row .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--grey-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .todo-row .chk.done{background:var(--green);border-color:var(--green);}
  .todo-row .chk.done::after{content:'✔';color:var(--on-green);font-size:11px;}
  .todo-row.done .todo-text{color:var(--grey-dim);text-decoration:line-through;}
  .todo-text{background:transparent;border:none;color:var(--white);font-size:13px;width:100%;}
  .todo-text:focus{outline:none;}
  .todo-date,.todo-priority{background:var(--card2);border:1px solid var(--border);color:var(--white);
    border-radius:7px;padding:4px 6px;font-size:11px;width:100%;}
  .todo-date.overdue{border-color:var(--pink);color:var(--pink);}
  .todo-date.due-today{border-color:var(--amber2);color:var(--amber2);}
  @media(max-width:600px){.todo-row{grid-template-columns:24px 1fr 60px;grid-template-areas:"chk text del" "chk date pri";}
    .todo-row .chk{grid-area:chk;} .todo-text{grid-area:text;} .todo-date{grid-area:date;}
    .todo-priority{grid-area:pri;} .todo-row button{grid-area:del;justify-self:end;}}

  .appearance-grid{display:flex;flex-wrap:wrap;gap:16px;}
  .ap-label{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.6px;
    font-weight:700;margin-bottom:6px;}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
  .seg button{background:transparent;border:none;color:var(--grey);font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font-body);transition:.15s;}
  .seg button:hover{color:var(--white);}
  .seg button.active{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);}


  /* ═══════════════ ОБЛИК «СТЕКЛО» ═══════════════
     Матовые панели, сквозь которые просвечивает фон. Тема здесь — это только
     набор переменных: разметка и компоненты одни на все восемь.

     data-glass  — какая тема
     data-theme  — светлая она или тёмная (выводится из темы, чтобы все старые
                   правила, завязанные на [data-theme], продолжали работать)
     data-glass-dense — «плотное стекло»: панели без размытия, для слабых
                   телефонов и режима экономии батареи */

  html[data-look="glass"]{
    --font-display:'Onest',system-ui,sans-serif;
    --font-body:'Onest',system-ui,sans-serif;
    --card-radius:20px; --row-radius:14px;
    --texture:transparent;
    /* полупрозрачные значения по умолчанию перекрываются темой */
    --pane:rgba(255,255,255,.60);
    --pane-solid:#F5F9F3;
    --blur:14px;
  }
  html[data-look="glass"][data-glass-dense="1"]{ --blur:0px; }

  /* Фон — три размытых пятна вместо двух: у стекла должно быть что просвечивать */
  html[data-look="glass"] body{
    background:
      radial-gradient(ellipse 700px 460px at 12% 4%, var(--glow1), transparent 66%),
      radial-gradient(ellipse 620px 440px at 92% 22%, var(--glow2), transparent 64%),
      radial-gradient(ellipse 820px 520px at 48% 104%, var(--glow3), transparent 66%),
      var(--bg);
    background-attachment:fixed;
  }

  html[data-look="glass"] .card{
    background:var(--pane);
    border:1px solid var(--border);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  html[data-look="glass"][data-glass-dense="1"] .card{ background:var(--pane-solid); }
  html[data-look="glass"] .card:hover{ transform:none; box-shadow:var(--shadow); }
  html[data-look="glass"] .card h2{ letter-spacing:.9px; }

  /* Нижняя панель не прибита к краю, а парит */
  html[data-look="glass"] nav.tabbar{
    left:10px; right:10px; bottom:calc(9px + env(safe-area-inset-bottom));
    border-radius:20px; border:1px solid var(--border);
    background:var(--pane); backdrop-filter:blur(calc(var(--blur) + 4px));
    -webkit-backdrop-filter:blur(calc(var(--blur) + 4px));
    padding:8px 6px; box-shadow:var(--shadow);
  }
  html[data-look="glass"][data-glass-dense="1"] nav.tabbar{ background:var(--pane-solid); }
  html[data-look="glass"] nav.tabbar button.active{ color:var(--amber); }

  /* Мелочи, которые иначе выдают «не стекло» */
  /* «Сейчас» и сводка — тоже верхнеуровневые блоки, стекло должно быть и на них */
  html[data-look="glass"] .focus-card,
  html[data-look="glass"] .quiet-summary{
    background:var(--pane);
    border:1px solid var(--border);
    border-radius:var(--card-radius);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  html[data-look="glass"][data-glass-dense="1"] .focus-card,
  html[data-look="glass"][data-glass-dense="1"] .quiet-summary{ background:var(--pane-solid); }

  html[data-look="glass"] .kpi,
  html[data-look="glass"] .fc-daily .b,
  html[data-look="glass"] .fchip,
  html[data-look="glass"] .seg{ border-radius:14px; }
  html[data-look="glass"] .pcal-cell{ border-radius:12px; }
  html[data-look="glass"] .cat-row .progress-bar,
  html[data-look="glass"] .progress-bar{ border-radius:5px; }
  html[data-look="glass"] input,
  html[data-look="glass"] select,
  html[data-look="glass"] textarea{ border-radius:12px; }

  /* ── светлые темы ── */
  html[data-glass="hvoya"]{
    --bg:#E9F1E8; --glow1:rgba(169,214,172,.55); --glow2:rgba(159,211,192,.50); --glow3:rgba(215,227,164,.50);
    --pane:rgba(255,255,255,.60); --pane-solid:#F4F8F2; --panel:var(--pane);
    --card:#EDF3EB; --card2:#E1EADE;
    --white:#1C271F; --grey:#44543F; --grey-dim:#75856F; --border:rgba(255,255,255,.85);
    --amber:#4E8C6A; --amber2:#6FA88A; --on-accent:#FFFFFF;
    --green:#3A7355; --pink:#B05745; --cyan:#4A8C86; --purple:#7A8C4A;
  }
  html[data-glass="rassvet"]{
    --bg:#F3EAF1; --glow1:rgba(255,185,150,.50); --glow2:rgba(185,166,255,.50); --glow3:rgba(143,230,208,.45);
    --pane:rgba(255,255,255,.58); --pane-solid:#FAF6F9; --panel:var(--pane);
    --card:#F0E9F0; --card2:#E6DFEA;
    --white:#20222A; --grey:#4A4E5C; --grey-dim:#7A7E8C; --border:rgba(255,255,255,.85);
    --amber:#8A78CE; --amber2:#A797E0; --on-accent:#FFFFFF;
    --green:#5B8F7E; --pink:#C4705E; --cyan:#6BA8C4; --purple:#8A78CE;
  }
  html[data-glass="inei"]{
    --bg:#E9F0FA; --glow1:rgba(168,203,255,.50); --glow2:rgba(180,190,255,.45); --glow3:rgba(158,221,224,.45);
    --pane:rgba(255,255,255,.62); --pane-solid:#F7FAFE; --panel:var(--pane);
    --card:#EDF2F9; --card2:#E1E9F4;
    --white:#1B2230; --grey:#465266; --grey-dim:#78849B; --border:rgba(255,255,255,.90);
    --amber:#3D6BB5; --amber2:#6B8FD9; --on-accent:#FFFFFF;
    --green:#3E8A86; --pink:#B4504A; --cyan:#4C8FA8; --purple:#6B8FD9;
  }
  html[data-glass="tsitrus"]{
    --bg:#FBF3E4; --glow1:rgba(255,212,138,.50); --glow2:rgba(255,184,168,.45); --glow3:rgba(220,231,152,.45);
    --pane:rgba(255,255,255,.60); --pane-solid:#FDF8EE; --panel:var(--pane);
    --card:#F6EEE0; --card2:#EDE3D2;
    --white:#2A2118; --grey:#584737; --grey-dim:#8B7862; --border:rgba(255,255,255,.90);
    --amber:#B06A18; --amber2:#D98A34; --on-accent:#FFFFFF;
    --green:#7A8E3E; --pink:#BE5A34; --cyan:#4E8880; --purple:#B06A18;
  }
  html[data-glass="pyl"]{
    --bg:#F0EEEA; --glow1:rgba(218,213,204,.55); --glow2:rgba(210,210,216,.50); --glow3:rgba(222,218,207,.50);
    --pane:rgba(255,255,255,.66); --pane-solid:#F8F7F4; --panel:var(--pane);
    --card:#EDEBE7; --card2:#E3E1DC;
    --white:#1F2124; --grey:#4C4F55; --grey-dim:#7C8087; --border:rgba(255,255,255,.92);
    --amber:#4A4E58; --amber2:#6E727C; --on-accent:#FFFFFF;
    --green:#5F7A66; --pink:#A0574A; --cyan:#4E7276; --purple:#6A6470;
  }

  /* ── тёмные темы ──
     Панель здесь не темнее фона, а светлее его на несколько процентов: иначе
     стекло перестаёт читаться как стекло и превращается в прямоугольник. */
  html[data-glass="polnoch"]{
    --bg:#0D0F22; --glow1:rgba(91,76,179,.20); --glow2:rgba(122,90,168,.15); --glow3:rgba(46,58,122,.15);
    --pane:rgba(255,255,255,.055); --pane-solid:#171834; --panel:var(--pane);
    --card:#1B1C38; --card2:#24254A;
    --white:#EDEAF6; --grey:#B4AECD; --grey-dim:#8B85A8; --border:rgba(255,255,255,.13);
    --amber:#C4B5FD; --amber2:#DDD3FF; --on-accent:#141530;
    --green:#6FA88F; --pink:#E08878; --cyan:#7FB5D8; --purple:#C4B5FD;
  }
  html[data-glass="omut"]{
    --bg:#061214; --glow1:rgba(30,107,107,.20); --glow2:rgba(42,122,106,.15); --glow3:rgba(18,74,90,.15);
    --pane:rgba(255,255,255,.055); --pane-solid:#0D1F22; --panel:var(--pane);
    --card:#0F2124; --card2:#162E31;
    --white:#E4F0F0; --grey:#9FBCBC; --grey-dim:#78999B; --border:rgba(255,255,255,.12);
    --amber:#7FE3D6; --amber2:#A8EFE6; --on-accent:#08191C;
    --green:#5FB68E; --pink:#E08878; --cyan:#6FC2D4; --purple:#9FD8C8;
  }
  html[data-glass="ugol"]{
    --bg:#121316; --glow1:rgba(58,58,64,.28); --glow2:rgba(69,64,58,.22); --glow3:rgba(42,43,48,.22);
    --pane:rgba(255,255,255,.05); --pane-solid:#1B1C20; --panel:var(--pane);
    --card:#1D1E22; --card2:#26272C;
    --white:#EAE7E1; --grey:#ADA9A2; --grey-dim:#87837D; --border:rgba(255,255,255,.115);
    --amber:#D8D2C6; --amber2:#EFEAE0; --on-accent:#17181B;
    --green:#88A08C; --pink:#C98A7A; --cyan:#8AA2A6; --purple:#B0A99C;
  }

  /* Смысловые пары выводятся из основных цветов — иначе каждую тему пришлось бы
     описывать втрое длиннее, а расходиться они начали бы на второй же правке. */
  html[data-look="glass"]{
    --ok-bg:color-mix(in srgb, var(--green) 16%, transparent);
    --ok-fg:var(--green);
    --bad-bg:color-mix(in srgb, var(--pink) 16%, transparent);
    --bad-fg:var(--pink);
    --info-bg:color-mix(in srgb, var(--cyan) 16%, transparent);
    --info-fg:var(--cyan);
    --warn-bg1:color-mix(in srgb, var(--pink) 15%, transparent);
    --warn-bg2:color-mix(in srgb, var(--pink) 22%, transparent);
    --warn-fg:var(--pink);
    --frozen-fg:var(--cyan);
    --frozen-border:color-mix(in srgb, var(--cyan) 45%, transparent);
    --streak-bg1:color-mix(in srgb, var(--amber) 16%, transparent);
    --streak-bg2:color-mix(in srgb, var(--amber) 26%, transparent);
    --on-green:var(--on-accent); --on-pink:var(--on-accent);
    --glow-shadow:rgba(20,30,25,.10);
    --shadow:0 6px 22px var(--glow-shadow);
    --shadow-hover:0 10px 28px var(--glow-shadow);
  }
  html[data-look="glass"][data-theme="dark"]{ --glow-shadow:rgba(0,0,0,.42); }
  /* выбор темы «Стекла» */
  .gt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;}
  .gt{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px;
    cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;
    font-family:var(--font-body);transition:.15s;}
  .gt:hover{border-color:var(--amber);}
  .gt.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);}
  .gt-sw{display:flex;border-radius:7px;overflow:hidden;height:22px;}
  .gt-sw i{flex:1;display:block;}
  .gt-nm{font-size:12.5px;font-weight:600;color:var(--white);}
  .gt-hint{font-size:10px;color:var(--grey-dim);line-height:1.3;}
  .gt-opts{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .gt-opt{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:12.5px;
    color:var(--white);}
  .gt-opt input{margin-top:2px;flex:0 0 auto;}
  .gt-opt small{display:block;font-size:10.5px;color:var(--grey-dim);margin-top:2px;line-height:1.35;}


  /* ═══════ СТЕКЛО: вёрстка ═══════
     Прошлая версия меняла только переменные — то есть одни цвета поверх прежней
     вёрстки. Здесь переписаны сами компоненты: масштаб шрифта, отступы, форма
     строк, устройство главного экрана. */

  html[data-look="glass"]{
    --card-pad:18px; --card-gap:12px;
    --hair:color-mix(in srgb, var(--grey-dim) 28%, transparent);
    --hair-strong:color-mix(in srgb, var(--grey-dim) 55%, transparent);
  }

  /* — шапка экрана — */
  html[data-look="glass"] .today-label{font-size:10px;letter-spacing:.18em;font-style:normal;
    opacity:.65;}
  html[data-look="glass"] .icon-btn{border-radius:50%;background:var(--pane);
    border:1px solid var(--border);backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));}

  /* — заголовок дня: плотнее и тяжелее, без литературных курсивов — */
  html[data-look="glass"] .today-head{margin-bottom:14px;}
  html[data-look="glass"] .today-head h2{font-size:26px;font-weight:700;letter-spacing:-.032em;
    line-height:1.1;margin:8px 0 0;}
  html[data-look="glass"] .today-head h2 em{font-style:normal;color:var(--amber);}
  html[data-look="glass"] .today-head .th-sub{display:none;}   /* уехало в плитки ниже */

  /* — три числа на главном: раньше их не было вовсе — */
  html[data-look="glass"] .g-stats{display:flex;gap:8px;margin-bottom:14px;}
  html[data-look="glass"] .g-stats > div{flex:1;min-width:0;background:var(--pane);
    border:1px solid var(--border);border-radius:16px;padding:11px 12px;
    backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
    display:flex;flex-direction:column;gap:3px;}
  html[data-look="glass"][data-glass-dense="1"] .g-stats > div{background:var(--pane-solid);}
  html[data-look="glass"] .g-stats .v{font-size:19px;font-weight:700;letter-spacing:-.025em;
    line-height:1;color:var(--white);white-space:nowrap;}
  html[data-look="glass"] .g-stats .v.sm{font-size:15px;}
  html[data-look="glass"] .g-stats .k{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--grey-dim);line-height:1.3;overflow:hidden;text-overflow:ellipsis;}

  /* — «Сейчас» — */
  html[data-look="glass"] .focus-card{padding:18px;}
  html[data-look="glass"] .focus-card .lbl{font-size:9.5px;letter-spacing:.16em;margin-bottom:10px;}
  html[data-look="glass"] .focus-card .task{font-size:21px;font-weight:700;letter-spacing:-.025em;
    line-height:1.22;}
  html[data-look="glass"] .focus-card .meta{font-size:12px;}
  html[data-look="glass"] .focus-card .go{border-radius:14px;padding:13px 18px;font-size:14px;
    letter-spacing:-.01em;margin-top:15px;}

  /* — лента дня: вместо вложенного блока с серыми линиями — волосяные строки — */
  html[data-look="glass"] .day-feed{background:transparent;gap:0;border-radius:0;overflow:visible;}
  html[data-look="glass"] .fd-entry{background:transparent;padding:11px 0;align-items:center;
    border-bottom:1px solid var(--hair);gap:10px;}
  html[data-look="glass"] .fd-entry:last-child{border-bottom:none;}
  /* пилюля «ПРИВЫЧКА» на каждой строке шумела — остаётся цветная точка */
  html[data-look="glass"] .fd-mark{min-width:0;width:7px;height:7px;padding:0;border-radius:50%;
    font-size:0;line-height:0;margin:0;background:var(--grey-dim);flex:0 0 auto;}
  html[data-look="glass"] .fd-mark.hab{background:var(--green);}
  html[data-look="glass"] .fd-mark.mon{background:var(--cyan);}
  html[data-look="glass"] .fd-mark.todo{background:var(--grey-dim);}
  html[data-look="glass"] .fd-mark.note{background:var(--purple);}
  html[data-look="glass"] .fd-mark.wrk{background:var(--amber);}
  html[data-look="glass"] .fd-body{font-size:14px;}
  html[data-look="glass"] .fd-text{font-weight:500;letter-spacing:-.01em;}
  html[data-look="glass"] .fd-note{font-family:var(--font-body);font-size:11px;margin-top:2px;}
  /* время шло первым столбцом и держало пустую колонку — уходит вправо */
  html[data-look="glass"] .fd-time{order:3;width:auto;margin:0;font-family:var(--font-body);
    font-size:10.5px;color:var(--grey-dim);}
  html[data-look="glass"] .fd-tick{width:23px;height:23px;border-radius:50%;
    border:1.5px solid var(--hair-strong);background:transparent;color:transparent;
    flex:0 0 auto;order:4;}
  html[data-look="glass"] .fd-tick:hover{border-color:var(--amber);background:transparent;}
  /* выполненное иначе ничем не отличалось от невыполненного */
  html[data-look="glass"] .fd-entry.done::after{content:"✓";order:5;flex:0 0 auto;margin-left:2px;
    font-size:13px;color:var(--green);line-height:1;}
  html[data-look="glass"] .fd-entry.done .fd-text{color:var(--grey);}
  html[data-look="glass"] .fd-entry.done .fd-mark{opacity:.45;}

  /* — карточки и их заголовки — */
  html[data-look="glass"] .card h2{font-size:10px;letter-spacing:.17em;color:var(--grey-dim);
    margin-bottom:14px;font-weight:600;}
  html[data-look="glass"] .card h2 span{letter-spacing:.02em;text-transform:none;}
  html[data-look="glass"] .quiet-summary{padding:14px 16px;font-size:12.5px;}

  /* — плитки показателей: цветная полоска сверху заменяется точкой акцента — */
  html[data-look="glass"] .kpi{background:var(--pane);border:1px solid var(--border);
    border-top:1px solid var(--border);border-radius:18px;padding:15px 16px;
    backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));}
  html[data-look="glass"][data-glass-dense="1"] .kpi{background:var(--pane-solid);}
  html[data-look="glass"] .kpi .t{font-size:9.5px;letter-spacing:.13em;}
  html[data-look="glass"] .kpi .v{letter-spacing:-.03em;}

  /* — подразделы: таблетки, а не рамки — */
  html[data-look="glass"] .subnav button{background:var(--pane);border:1px solid var(--border);
    border-radius:20px;padding:8px 15px;font-size:12.5px;letter-spacing:-.01em;
    backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));}
  html[data-look="glass"] .subnav button.on{background:var(--amber);color:var(--on-accent);
    border-color:transparent;}

  /* — переключатели и поля — */
  html[data-look="glass"] .seg{background:var(--pane);border:1px solid var(--border);
    border-radius:14px;padding:3px;}
  html[data-look="glass"] .seg button{border-radius:11px;letter-spacing:-.01em;}
  html[data-look="glass"] .seg button.active{background:var(--amber);color:var(--on-accent);}
  html[data-look="glass"] input,
  html[data-look="glass"] select,
  html[data-look="glass"] textarea{background:var(--pane);border:1px solid var(--border);
    border-radius:13px;}
  html[data-look="glass"] .btn{border-radius:13px;letter-spacing:-.01em;}
  html[data-look="glass"] .fchip{border-radius:18px;background:var(--pane);
    border:1px solid var(--border);}
  html[data-look="glass"] .fchip.on{background:var(--amber);color:var(--on-accent);
    border-color:transparent;}

  /* — денежные плитки и строки — */
  html[data-look="glass"] .fin-summary .box{background:var(--pane);border:1px solid var(--border);
    border-radius:16px;padding:13px 14px;backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));}
  html[data-look="glass"][data-glass-dense="1"] .fin-summary .box{background:var(--pane-solid);}
  html[data-look="glass"] .fin-summary .box .v{letter-spacing:-.03em;}
  html[data-look="glass"] .fc-daily .b{background:var(--pane);border:1px solid var(--border);
    border-radius:16px;}
  html[data-look="glass"] .fin-row{border-radius:12px;}
  html[data-look="glass"] .cat-row{border-bottom-color:var(--hair);}
  html[data-look="glass"] .ins-row{border-bottom-color:var(--hair);}
  html[data-look="glass"] .fc-line{border-bottom-color:var(--hair);}

  /* — клетки календаря и сетка привычек — */
  html[data-look="glass"] .day-cell{border-radius:9px;}
  html[data-look="glass"] .wk-cell{border-radius:11px;}

  /* шапка раздела финансов */
  .fin-hero{display:flex;flex-direction:column;gap:14px;}
  .fh-k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-dim);}
  .fh-v{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;
    letter-spacing:-.035em;line-height:1;margin-top:5px;color:var(--white);}
  .fh-v.warn{color:var(--pink);}
  .fh-s{font-size:11.5px;color:var(--grey);margin-top:6px;}
  .fh-side{display:flex;gap:8px;}
  .fh-side > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;
    padding:10px 11px;background:var(--card);border-radius:13px;}
  .fh-side .k{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fh-side .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
    color:var(--white);white-space:nowrap;}
  .fh-side .v.pos{color:var(--green);} .fh-side .v.neg{color:var(--pink);}
  .fh-other{display:flex;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;
    font-size:11.5px;color:var(--grey);padding-top:2px;border-top:1px solid var(--border);}

  /* переключатель панелей */
  .fp-nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .fp-nav::-webkit-scrollbar{display:none;}
  .fp-nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);
    color:var(--grey);padding:8px 15px;border-radius:19px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:var(--font-body);}
  .fp-nav button.on{background:var(--amber);color:var(--on-accent);border-color:transparent;}

  /* записи: доходы отдельно от расходов */
  .fin-group{margin-bottom:6px;}
  .fin-group + .fin-group{margin-top:20px;}
  .fg-head{display:flex;align-items:baseline;gap:9px;padding:0 2px 8px;
    border-bottom:1px solid var(--border);margin-bottom:4px;}
  .fg-head .t{flex:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
  .fg-head .t.inc{color:var(--green);} .fg-head .t.exp{color:var(--pink);}
  .fg-head .n{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;}
  .fg-head .c{font-size:10.5px;color:var(--grey-dim);font-family:'JetBrains Mono',monospace;}
  .fr-date{font-size:10px;color:var(--grey-dim);font-family:'JetBrains Mono',monospace;
    flex:0 0 auto;}
  .fr-cur{font-size:9.5px;color:var(--grey-dim);margin-left:3px;}

  /* валюта при вводе */
  .qa-cur{display:flex;gap:5px;flex-wrap:wrap;}
  .qa-cur button{background:var(--card);border:1px solid var(--border);color:var(--grey);
    border-radius:11px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'JetBrains Mono',monospace;}
  .qa-cur button.on{background:var(--amber);color:var(--on-accent);border-color:transparent;}


  /* ═══════ ФИНАНСЫ v3: доходы как торговый журнал ═══════ */
  /* Прибыль и убыток — свои цвета, а не цвета темы: у тем зелёный и красный
     нарочно приглушены, и в календаре плюсовой день читался как серый. */
  :root{ --fx-num:'JetBrains Mono',monospace;
    --pnl-up:#3DD68C; --pnl-down:#FF6B6B; --pnl-up-ink:#52E39D; --pnl-down-ink:#FF7F7F; }
  html[data-theme="light"]{ --pnl-up:#17985B; --pnl-down:#DB4545; --pnl-up-ink:#0E7443; --pnl-down-ink:#B92F2F; }
  html[data-look="glass"]{ --fx-num:var(--font-display); }
  .fx-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;
    border-radius:16px;background:var(--card);border:1px solid var(--border);}
  html[data-look="glass"] .fx-mode{background:var(--pane);backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));}
  .fx-mode button{border:none;background:transparent;color:var(--grey);font:600 14px var(--font-body);
    padding:11px 8px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:7px;letter-spacing:-.01em;transition:background .18s,color .18s;min-width:0;}
  .fx-mode button .n{font:600 11px 'JetBrains Mono',monospace;opacity:.72;white-space:nowrap;}
  .fx-mode button.on{background:var(--amber);color:var(--on-accent);
    box-shadow:0 6px 16px -8px color-mix(in srgb, var(--amber) 80%, transparent);}

  /* — шапка — */
  .fx-hero{position:relative;overflow:hidden;}
  .fx-hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--pnl-up) 14%, transparent), transparent 62%);}
  .fx-hero.neg::before{background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--pnl-down) 14%, transparent), transparent 62%);}
  .fx-hero.exp::before{background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--amber) 12%, transparent), transparent 62%);}
  .fx-hero.exp.neg::before{background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--pnl-down) 16%, transparent), transparent 62%);}
  .fx-hero > *{position:relative;}
  .fx-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;}
  .fx-k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .fx-cur{display:inline-flex;gap:2px;padding:2px;border-radius:11px;background:var(--card);border:1px solid var(--border);}
  html[data-look="glass"] .fx-cur{background:var(--pane);}
  .fx-cur button{border:none;background:transparent;color:var(--grey);min-width:30px;height:26px;border-radius:9px;
    font:600 13px 'JetBrains Mono',monospace;cursor:pointer;padding:0 6px;}
  .fx-cur button.on{background:var(--amber);color:var(--on-accent);}
  .fx-big{font-family:var(--fx-num);font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.02;
    margin:10px 0 6px;color:var(--white);font-variant-numeric:tabular-nums;word-break:break-word;}
  .fx-big.pos{color:var(--pnl-up);} .fx-big.neg{color:var(--pnl-down);}
  .fx-sub{font-size:12.5px;color:var(--grey);line-height:1.45;}
  .fx-sub .pos, .fx-hero .pos{color:var(--pnl-up);} .fx-sub .neg, .fx-hero .neg{color:var(--pnl-down);}
  .fx-bar{display:flex;gap:2px;height:8px;border-radius:5px;overflow:hidden;margin:16px 0 4px;
    background:color-mix(in srgb, var(--grey-dim) 16%, transparent);}
  .fx-bar i{display:block;height:100%;border-radius:2px;}
  .fx-srows{margin-top:6px;}
  .fx-srow{display:grid;grid-template-columns:9px minmax(0,1fr) auto 38px;gap:9px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--hair, var(--border));font-size:13px;}
  .fx-srow:last-child{border-bottom:none;}
  .fx-srow i{width:9px;height:9px;border-radius:50%;}
  .fx-srow .n{color:var(--white);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-srow .v{font:600 13px 'JetBrains Mono',monospace;white-space:nowrap;}
  .fx-srow .p{font:500 11px 'JetBrains Mono',monospace;color:var(--grey-dim);text-align:right;}
  .fx-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;}
  .fx-tiles > div{display:flex;flex-direction:column;gap:3px;padding:10px 11px;border-radius:14px;min-width:0;
    background:color-mix(in srgb, var(--card) 72%, transparent);border:1px solid var(--border);}
  html[data-look="glass"] .fx-tiles > div{background:color-mix(in srgb, var(--pane-solid) 55%, transparent);}
  .fx-tiles .k{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--grey-dim);
    line-height:1.2;font-weight:600;}
  .fx-tiles .v{font-family:var(--fx-num);font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--white);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-tiles .v.pos{color:var(--pnl-up);} .fx-tiles .v.neg{color:var(--pnl-down);}
  .fx-tiles .s{font-size:10.5px;color:var(--grey-dim);line-height:1.25;}
  .fx-meter{height:8px;border-radius:5px;margin:14px 0 7px;overflow:hidden;
    background:color-mix(in srgb, var(--grey-dim) 18%, transparent);}
  .fx-meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pnl-up),var(--amber));}
  .fx-meter.over i{background:var(--pnl-down);}
  .fx-other{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair, var(--border));
    font:500 12px 'JetBrains Mono',monospace;color:var(--grey);}
  .fx-warn{margin-top:12px;padding:9px 11px;border-radius:12px;font-size:12px;line-height:1.45;
    background:var(--bad-bg);color:var(--bad-fg);}
  .fx-warn button{margin-left:6px;border:none;background:transparent;color:inherit;font:700 12px var(--font-body);
    text-decoration:underline;cursor:pointer;padding:0;}

  /* — календарь — */
  .fx-cal{padding-left:12px;padding-right:12px;}
  .fx-cal-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px;}
  .fx-cal-title h2{margin-bottom:10px;}
  .fx-total{font:700 14px 'JetBrains Mono',monospace;color:var(--grey);}
  .fx-total.pos{color:var(--pnl-up);} .fx-total.neg{color:var(--pnl-down);}
  .fx-cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;padding:0 2px;}
  .fx-seg button{padding:7px 11px;font-size:12px;}
  .fx-nav{display:flex;align-items:center;gap:4px;}
  .fx-nav span{font-weight:700;font-size:14px;min-width:112px;text-align:center;letter-spacing:-.01em;color:var(--white);}
  .fx-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);
    color:var(--white);font-size:17px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
  html[data-look="glass"] .fx-nav button{background:var(--pane);}
  .fx-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px 10px;}
  .fx-chips::-webkit-scrollbar{display:none;}
  .fx-chips button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;
    border:1px solid var(--border);background:var(--card);color:var(--grey);font:600 12px var(--font-body);cursor:pointer;}
  html[data-look="glass"] .fx-chips button{background:var(--pane);}
  .fx-chips button i{width:8px;height:8px;border-radius:50%;background:var(--src);}
  .fx-chips button.on{color:var(--white);border-color:var(--src, var(--amber));
    background:color-mix(in srgb, var(--src, var(--amber)) 16%, var(--card));}
  .fx-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .fx-grid .wd{font-size:10px;color:var(--grey-dim);text-align:center;padding:2px 0 4px;font-weight:600;letter-spacing:.04em;}
  .fx-cell{aspect-ratio:1/1.08;min-height:44px;border-radius:12px;border:1px solid transparent;background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;cursor:pointer;
    font-family:var(--font-body);color:var(--white);transition:transform .12s ease;min-width:0;}
  .fx-cell:active{transform:scale(.94);}
  .fx-cell.blank{cursor:default;}
  .fx-cell .d{font-size:13.5px;font-weight:700;line-height:1;letter-spacing:-.01em;}
  .fx-cell .v{font:600 10.5px 'JetBrains Mono',monospace;line-height:1;letter-spacing:-.03em;white-space:nowrap;}
  .fx-cell.none .d{color:var(--grey);font-weight:600;} .fx-cell.none .v{color:var(--grey-dim);}
  .fx-cell.future{opacity:.36;} .fx-cell.future .d{color:var(--grey);font-weight:600;}
  .fx-cell.up{background:color-mix(in srgb, var(--pnl-up) 14%, transparent);border-color:color-mix(in srgb, var(--pnl-up) 24%, transparent);}
  .fx-cell.up.l2{background:color-mix(in srgb, var(--pnl-up) 22%, transparent);}
  .fx-cell.up.l3{background:color-mix(in srgb, var(--pnl-up) 31%, transparent);border-color:color-mix(in srgb, var(--pnl-up) 42%, transparent);}
  .fx-cell.down{background:color-mix(in srgb, var(--pnl-down) 14%, transparent);border-color:color-mix(in srgb, var(--pnl-down) 24%, transparent);}
  .fx-cell.down.l2{background:color-mix(in srgb, var(--pnl-down) 22%, transparent);}
  .fx-cell.down.l3{background:color-mix(in srgb, var(--pnl-down) 31%, transparent);border-color:color-mix(in srgb, var(--pnl-down) 42%, transparent);}
  .fx-cell.up .v{color:var(--pnl-up-ink);} .fx-cell.down .v{color:var(--pnl-down-ink);}
  .fx-cell.flat{background:color-mix(in srgb, var(--grey-dim) 14%, transparent);} .fx-cell.flat .v{color:var(--grey);}
  .fx-cell.today{box-shadow:inset 0 0 0 1.5px var(--amber);}
  .fx-cell.today .d{color:var(--amber);}
  .fx-cell.sel{box-shadow:0 0 0 2px var(--amber);}
  .fx-wl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-dim);margin:14px 4px 6px;font-weight:600;}
  .fx-weeks{display:grid;gap:5px;}
  .fx-weeks > div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:11px;
    background:color-mix(in srgb, var(--card) 70%, transparent);border:1px solid var(--border);min-width:0;}
  html[data-look="glass"] .fx-weeks > div{background:color-mix(in srgb, var(--pane-solid) 50%, transparent);}
  .fx-weeks .k{font:500 9.5px 'JetBrains Mono',monospace;color:var(--grey-dim);white-space:nowrap;}
  .fx-weeks .v{font:700 11.5px 'JetBrains Mono',monospace;color:var(--grey);white-space:nowrap;letter-spacing:-.03em;}
  .fx-weeks .pos .v{color:var(--pnl-up);} .fx-weeks .neg .v{color:var(--pnl-down);}
  .fx-mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .fx-mcell{min-height:62px;border-radius:14px;border:1px solid var(--border);background:color-mix(in srgb, var(--card) 60%, transparent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
    font-family:var(--font-body);color:var(--white);padding:4px;min-width:0;}
  .fx-mcell .d{font-size:12px;font-weight:700;color:var(--grey);letter-spacing:.02em;}
  .fx-mcell .v{font:700 13px 'JetBrains Mono',monospace;letter-spacing:-.03em;white-space:nowrap;}
  .fx-mcell.none .v{color:var(--grey-dim);} .fx-mcell.future{opacity:.36;}
  .fx-mcell.up{background:color-mix(in srgb, var(--pnl-up) 14%, transparent);border-color:color-mix(in srgb, var(--pnl-up) 26%, transparent);}
  .fx-mcell.up.l2{background:color-mix(in srgb, var(--pnl-up) 22%, transparent);}
  .fx-mcell.up.l3{background:color-mix(in srgb, var(--pnl-up) 31%, transparent);}
  .fx-mcell.down{background:color-mix(in srgb, var(--pnl-down) 14%, transparent);border-color:color-mix(in srgb, var(--pnl-down) 26%, transparent);}
  .fx-mcell.down.l2{background:color-mix(in srgb, var(--pnl-down) 22%, transparent);}
  .fx-mcell.down.l3{background:color-mix(in srgb, var(--pnl-down) 31%, transparent);}
  .fx-mcell.up .v{color:var(--pnl-up-ink);} .fx-mcell.down .v{color:var(--pnl-down-ink);}
  .fx-mcell.today{box-shadow:inset 0 0 0 1.5px var(--amber);} .fx-mcell.today .d{color:var(--amber);}
  .fx-hint{font-size:11px;color:var(--grey-dim);margin:12px 4px 0;line-height:1.4;}
  @media(min-width:640px){
    .fx-cell{aspect-ratio:auto;min-height:66px;}
    .fx-cell .d{font-size:15px;} .fx-cell .v{font-size:12.5px;}
    .fx-big{font-size:46px;}
  }

  /* — записи — */
  .fx-rec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .fx-linkbtn{border:none;background:none;color:var(--amber);font:600 12px var(--font-body);cursor:pointer;padding:2px 0;
    letter-spacing:0;text-transform:none;}
  .fx-search{width:100%;margin:0 0 4px;padding:10px 13px;font-size:13.5px;border-radius:13px;
    background:var(--card);border:1px solid var(--border);color:var(--white);font-family:var(--font-body);}
  .fx-search::placeholder{color:var(--grey-dim);}
  .fx-day{margin-top:6px;}
  .fx-dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 2px 6px;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;
    border-bottom:1px solid var(--hair, var(--border));}
  .fx-dh b{font:700 12px 'JetBrains Mono',monospace;letter-spacing:-.01em;text-transform:none;color:var(--grey);}
  .fx-dh b.pos{color:var(--pnl-up);} .fx-dh b.neg{color:var(--pnl-down);}
  .fx-row{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
    border-bottom:1px solid var(--hair, var(--border));padding:11px 4px;text-align:left;cursor:pointer;
    color:var(--white);font-family:var(--font-body);border-radius:0;}
  .fx-row:last-child{border-bottom:none;}
  .fx-row:active{background:color-mix(in srgb, var(--grey-dim) 10%, transparent);}
  .fx-row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .fx-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .fx-row .t b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
  .fx-row .t small{font-size:11.5px;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fx-row .a{font:600 13.5px 'JetBrains Mono',monospace;white-space:nowrap;letter-spacing:-.02em;color:var(--grey);}
  .fx-row .a.pos{color:var(--pnl-up);} .fx-row .a.neg{color:var(--pnl-down);}
  .fx-row.editing{background:color-mix(in srgb, var(--amber) 12%, transparent);border-radius:12px;border-bottom-color:transparent;}
  .fx-empty{text-align:center;color:var(--grey-dim);font-size:12.5px;padding:22px 0 10px;}
  .fx-empty.sm{padding:12px 0;}
  .fx-filterpill{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:7px 8px 7px 12px;border-radius:12px;
    background:var(--info-bg);color:var(--info-fg);font-size:12px;}
  .fx-filterpill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fx-filterpill button{border:none;background:transparent;color:inherit;font-size:14px;cursor:pointer;padding:0 4px;}
  .fx-rec .fin-filter-bar{margin:6px 0 4px;}

  /* — плавающая кнопка — */
  .fx-fab{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:45;
    display:flex;align-items:center;gap:7px;height:52px;padding:0 21px 0 17px;border-radius:26px;border:none;
    background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);
    font:700 14.5px var(--font-body);letter-spacing:-.01em;cursor:pointer;
    box-shadow:0 12px 28px -10px color-mix(in srgb, var(--amber) 85%, transparent), 0 3px 8px rgba(0,0,0,.16);}
  .fx-fab span{font-size:25px;font-weight:400;line-height:1;margin-top:-2px;}
  .fx-fab:active{transform:scale(.96);}
  .fx-spacer{height:64px;}
  html.has-fab .undo-toast{bottom:calc(152px + env(safe-area-inset-bottom));}
  @media(min-width:760px){ .fx-fab{bottom:28px;right:28px;} html.has-fab .undo-toast{bottom:92px;} }

  /* ═══════ ЛИСТ СНИЗУ ═══════ */
  .sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;
    pointer-events:none;}
  .sheet-back{position:absolute;inset:0;background:rgba(8,10,12,.46);opacity:0;transition:opacity .24s ease;
    pointer-events:auto;}
  .sheet{position:relative;pointer-events:auto;width:100%;max-width:640px;margin:0 auto;
    max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:var(--panel);border:1px solid var(--border);border-bottom:none;
    border-radius:26px 26px 0 0;padding:4px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px -18px rgba(0,0,0,.45);
    transform:translateY(104%);transition:transform .28s cubic-bezier(.2,.85,.25,1);}
  html[data-look="glass"] .sheet{background:var(--pane-solid);}
  .sheet-wrap.in .sheet{transform:none;}
  .sheet-wrap.in .sheet-back{opacity:1;}
  @media(prefers-reduced-motion:reduce){ .sheet, .sheet-back{transition:none;} }
  html.sheet-open, html.sheet-open body{overflow:hidden;}
  html.sheet-open .undo-toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));
    transform:translate(-50%,-20px);}
  html.sheet-open .undo-toast.show{transform:translate(-50%,0);}
  .sh-grab{width:40px;height:4px;border-radius:2px;background:var(--grey-dim);opacity:.4;margin:8px auto 10px;}
  .sh-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;touch-action:none;}
  .sh-title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;}
  .sh-title.left{align-items:flex-start;text-align:left;}
  .sh-title b{font-size:16px;font-weight:700;letter-spacing:-.015em;color:var(--white);}
  .sh-title span{font:600 12.5px 'JetBrains Mono',monospace;color:var(--grey);}
  .sh-title span.pos{color:var(--pnl-up);} .sh-title span.neg{color:var(--pnl-down);}
  .sh-title span.zero{font-family:var(--font-body);font-weight:500;color:var(--grey-dim);font-size:12px;}
  .sh-nav, .sh-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);
    color:var(--grey);font-size:16px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);line-height:1;}
  .sh-x{font-size:14px;}
  .sh-list{margin:4px 0 2px;}
  .sh-list .fx-row{padding:10px 8px;}
  .sh-form{margin-top:4px;padding-top:4px;border-top:1px solid var(--hair, var(--border));}
  .sh-lab{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--grey-dim);margin:14px 0 8px;font-weight:600;}
  .sh-form.editing .sh-lab:first-child{color:var(--amber);}
  .fx-pick{display:flex;gap:6px;flex-wrap:wrap;}
  .fx-pick button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:18px;border:1px solid var(--border);
    background:var(--card);color:var(--grey);font:600 13px var(--font-body);cursor:pointer;letter-spacing:-.01em;}
  .fx-pick button small{font:500 10px 'JetBrains Mono',monospace;opacity:.7;}
  .fx-pick button i{width:9px;height:9px;border-radius:50%;background:var(--src);}
  .fx-pick button.on{color:var(--white);border-color:var(--src, var(--amber));
    background:color-mix(in srgb, var(--src, var(--amber)) 18%, var(--card));}
  .fx-pick.cur{margin-top:10px;}
  .fx-pick.cur button{font:600 12px 'JetBrains Mono',monospace;padding:7px 11px;}
  .fx-sign{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;}
  .fx-sign button{padding:11px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--grey);
    font:600 13.5px var(--font-body);cursor:pointer;}
  .fx-sign button.on.pos{color:var(--pnl-up);border-color:color-mix(in srgb, var(--pnl-up) 55%, transparent);
    background:color-mix(in srgb, var(--pnl-up) 16%, var(--card));}
  .fx-sign button.on.neg{color:var(--pnl-down);border-color:color-mix(in srgb, var(--pnl-down) 55%, transparent);
    background:color-mix(in srgb, var(--pnl-down) 16%, var(--card));}
  .fx-amt{display:flex;align-items:center;gap:6px;margin-top:10px;padding:4px 16px;border-radius:18px;
    background:var(--card);border:1px solid var(--border);cursor:text;}
  .fx-amt:focus-within{border-color:var(--amber);}
  .fx-amt .s{font:700 30px var(--fx-num);line-height:1;}
  .fx-amt.pos .s{color:var(--pnl-up);} .fx-amt.neg .s{color:var(--pnl-down);}
  .fx-amt input{flex:1;min-width:0;background:transparent !important;border:none !important;box-shadow:none !important;
    font:700 34px var(--fx-num);letter-spacing:-.03em;color:var(--white);padding:8px 0;outline:none;border-radius:0 !important;}
  .fx-amt input::placeholder{color:var(--grey-dim);opacity:.5;}
  .fx-amt .c{font:600 20px 'JetBrains Mono',monospace;color:var(--grey);}
  .sh-in, .sh-sel{width:100%;margin-top:10px;padding:11px 13px;font-size:14px;border-radius:13px;
    background:var(--card);border:1px solid var(--border);color:var(--white);font-family:var(--font-body);}
  .sh-in::placeholder{color:var(--grey-dim);}
  .sh-actions{display:flex;gap:8px;margin-top:14px;}
  .sh-actions .btn{flex:1;padding:14px 12px;font-size:14.5px;font-weight:700;border-radius:15px;}
  .sh-actions .btn.ghost{flex:0 0 auto;padding-left:16px;padding-right:16px;}
  .sh-actions .btn.danger{color:var(--pnl-down);border-color:color-mix(in srgb, var(--pnl-down) 45%, transparent);}
  .sh-exp .card{background:none !important;border:none !important;box-shadow:none !important;padding:0 !important;
    margin:0 !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
  .sh-exp .card:hover{transform:none !important;}
  .sh-exp .card > h2{display:none;}
  .sh-exp .qa-seg{display:none;}
  /* сумма в листе расхода — такая же крупная, как в листе дохода */
  .sh-exp .qa-amount{align-items:center;gap:6px;padding:4px 16px;margin:4px 0 12px;border-radius:18px;
    background:var(--card);border:1px solid var(--border);}
  .sh-exp .qa-amount:focus-within{border-color:var(--amber);}
  .sh-exp .qa-amount .sign{font:700 30px var(--fx-num);}
  .sh-exp .qa-amount input{background:transparent !important;border:none !important;box-shadow:none !important;
    border-radius:0 !important;font:700 34px var(--fx-num) !important;letter-spacing:-.03em;padding:8px 0 !important;}
  .sh-exp .qa-amount .cur{font-size:20px;}
  .sh-exp .qa-bottom{flex-direction:column;}
  .sh-exp .qa-bottom input{padding:11px 13px;font-size:14px;border-radius:13px;}
  .sh-exp .qa-bottom .btn{padding:14px 12px;font-size:14.5px;font-weight:700;border-radius:15px;}
  .src-list{margin-top:6px;}
  .src-row{display:grid;grid-template-columns:34px minmax(0,1fr) 82px 34px;gap:8px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--hair, var(--border));}
  .src-row .sh-in, .src-row .sh-sel{margin-top:0;}
  .src-row .src-cnt{grid-column:2 / 5;font-size:10.5px;color:var(--grey-dim);margin-top:-2px;}
  .src-dot{width:30px;height:30px;border-radius:50%;border:3px solid color-mix(in srgb, var(--white) 18%, transparent);cursor:pointer;}
  .src-del{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--pnl-down);
    cursor:pointer;font-size:13px;}
  /* доход без источника */
  .fx-assign{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border-radius:13px;
    border:1px dashed color-mix(in srgb, var(--amber) 55%, transparent);background:color-mix(in srgb, var(--amber) 8%, transparent);
    color:var(--grey);font:500 12.5px var(--font-body);cursor:pointer;text-align:left;}
  .fx-assign span{flex:1;min-width:0;}
  .fx-assign b{color:var(--amber);font-weight:700;white-space:nowrap;}
  .fx-pick.sm{gap:5px;}
  .fx-pick.sm button{padding:6px 11px;font-size:12px;}
  .as-list{margin-top:2px;}
  .as-row{padding:11px 0;border-bottom:1px solid var(--hair, var(--border));}
  .as-row:last-child{border-bottom:none;}
  .as-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .as-top .dt{font-size:12.5px;color:var(--white);font-weight:600;}
  .as-top .a{font:600 13px 'JetBrains Mono',monospace;}
  .as-top .a.pos{color:var(--pnl-up);} .as-top .a.neg{color:var(--pnl-down);}
  .as-com{font-size:11.5px;color:var(--grey-dim);margin:2px 0 0;}
  .as-row .fx-pick{margin-top:8px;}

  /* кнопка «+» уходит вниз, пока листаешь вниз */
  .fx-fab{transition:transform .22s ease, opacity .22s ease;}
  html.fab-hide .fx-fab{transform:translateY(160%);opacity:0;pointer-events:none;}

  /* что нового */
  .news-list{margin-top:4px;}
  .news-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair, var(--border));}
  .news-item:last-child{border-bottom:none;}
  .news-item .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;font-size:17px;color:var(--amber);background:color-mix(in srgb, var(--amber) 15%, transparent);}
  .news-item b{display:block;font-size:14px;letter-spacing:-.01em;color:var(--white);}
  .news-item p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:var(--grey);}

  /* голосовой ввод в делах */
  .todo-add{align-items:stretch;}
  .add-row .mic-btn{flex:0 0 auto;width:46px;padding:0;display:flex;align-items:center;justify-content:center;
    background:var(--card2);color:var(--amber);border:1px solid var(--border);box-shadow:none;}
  .add-row .mic-btn:hover{box-shadow:none;}
  .add-row .mic-btn svg{width:19px;height:19px;}
  .add-row .mic-btn.listening{background:var(--pink);color:#fff;border-color:transparent;animation:micPulse 1.1s ease-in-out infinite;}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--pink) 55%, transparent);}
    50%{box-shadow:0 0 0 9px color-mix(in srgb, var(--pink) 0%, transparent);}}
  .todo-hint{font-size:11px;color:var(--grey-dim);margin-top:7px;line-height:1.4;}
  .todo-hint b{color:var(--grey);font-weight:600;}

  /* дела: на телефоне приоритет обрезался до «В» и «С» — теперь строка в два яруса */
  .todo-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .todo-count{font-size:12px;color:var(--grey-dim);white-space:nowrap;}
  .todo-count b{color:var(--pink);font-weight:600;}
  .todo-card .add-row{margin:2px 0 0;}
  .todo-card .add-row input{padding:11px 13px;font-size:14px;}
  .todo-card .row-wrap{margin-top:14px;gap:7px;}
  .todo-row{padding:10px 12px;border-radius:14px;gap:6px 10px;border:1px solid transparent;margin-bottom:0;}
  html[data-look="glass"] .todo-row{background:color-mix(in srgb, var(--pane-solid) 62%, transparent);border-color:var(--border);}
  .todo-row .chk{width:22px;height:22px;border-radius:50%;}
  .todo-row .todo-text{background:transparent !important;border:none !important;box-shadow:none !important;
    border-radius:0 !important;padding:2px 0 !important;font-size:14.5px;font-weight:500;letter-spacing:-.01em;}
  .todo-row .todo-date, .todo-row .todo-priority{height:30px;padding:3px 9px;font-size:12px;border-radius:10px;}
  .todo-row .del{background:transparent;border:none;color:var(--grey-dim);font-size:14px;cursor:pointer;padding:4px;}
  @media(max-width:600px){
    .todo-row{grid-template-columns:26px auto minmax(0,1fr) 28px;grid-template-areas:"chk text text del" "chk date pri pri";}
    .todo-row .chk{align-self:start;margin-top:2px;}
    .todo-row .todo-date{width:auto;max-width:150px;}
    .todo-row .todo-priority{width:auto;justify-self:start;}
  }


  /* голос, версия 3 */
  .add-row .mic-btn{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);
    border:none;width:50px;}
  .add-row .mic-btn svg{width:21px;height:21px;}
  .todo-add #addTodoBtn{background:var(--card2);color:var(--grey);border:1px solid var(--border);box-shadow:none;
    width:46px;padding:0;font-size:20px;}
  .ls-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 2px;}
  .ls-mic{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--on-accent);background:linear-gradient(100deg,var(--amber),var(--amber2));margin:8px 0 14px;
    animation:lsPulse 1.4s ease-in-out infinite;}
  .ls-mic svg{width:32px;height:32px;}
  .ls-mic.busy{animation:none;opacity:.7;}
  @keyframes lsPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--amber) 45%, transparent);}
    50%{box-shadow:0 0 0 16px color-mix(in srgb, var(--amber) 0%, transparent);}}
  .ls-state{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .ls-text{font-size:19px;font-weight:600;letter-spacing:-.015em;color:var(--white);line-height:1.35;
    margin:10px 6px 4px;min-height:52px;}
  .ls-text.empty{color:var(--grey-dim);font-weight:500;}
  .ls-wrap .sh-actions{width:100%;}
  .vh-p{font-size:13.5px;line-height:1.5;color:var(--grey);margin:6px 0 10px;}
  .vh-act{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px;}
  .vh-act .btn{display:block;text-align:center;text-decoration:none;padding:13px 12px;font-size:14px;font-weight:700;border-radius:15px;}
  .vh-note{font-size:11.5px;color:var(--grey-dim);line-height:1.45;margin:2px 2px 0;}
  .app-upd{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:10px 12px;border-radius:13px;
    background:var(--info-bg);color:var(--info-fg);font-size:12px;line-height:1.4;}
  .app-upd span{flex:1;min-width:0;}
  .app-upd .btn{flex:0 0 auto;text-decoration:none;padding:8px 14px;font-size:12.5px;}


  /* голос, версия 4 */
  .ls-items{margin:6px 0 2px;padding:0 0 0 22px;text-align:left;align-self:stretch;max-height:34vh;overflow:auto;}
  .ls-items li{font-size:14px;line-height:1.4;padding:5px 0;color:var(--white);border-bottom:1px solid var(--hair, var(--border));}
  .ls-items li:last-child{border-bottom:none;}
  .ls-items li::marker{color:var(--amber);font-weight:700;}
  .ls-wrap.has-items .ls-mic{width:54px;height:54px;margin:2px 0 8px;}
  .ls-wrap.has-items .ls-mic svg{width:24px;height:24px;}
  .ls-wrap.has-items .ls-text{font-size:13.5px;font-weight:500;color:var(--grey);min-height:0;margin:6px 4px 2px;}
  .todo-row.fresh{animation:todoFresh 2.4s ease;}
  @keyframes todoFresh{0%,35%{background:color-mix(in srgb, var(--amber) 22%, transparent);border-color:var(--amber);}100%{}}
  .vc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 4px;}
  .vc-row.col{flex-direction:column;align-items:stretch;}
  .vc-row .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .vc-row .btn{text-decoration:none;text-align:center;}
  .vc-check{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px;font-size:13.5px;color:var(--white);cursor:pointer;}
  .vc-check input{width:18px;height:18px;accent-color:var(--amber);}
  .vc-check small{flex-basis:100%;font-size:11.5px;color:var(--grey-dim);line-height:1.4;padding-left:26px;}
  .vh-p.sm{font-size:12.5px;margin:0;}


  /* ═══════ ДЕЛА: единый список привычек и дел ═══════ */
  .do-head .dh-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .dh-ring{--p:0;width:66px;height:66px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:conic-gradient(var(--amber) calc(var(--p)*1%), color-mix(in srgb, var(--grey-dim) 24%, transparent) 0);}
  .dh-ring::before{content:"";grid-area:1/1;width:52px;height:52px;border-radius:50%;background:var(--pane-solid, var(--panel));}
  .dh-ring span{grid-area:1/1;position:relative;font:700 17px var(--fx-num);letter-spacing:-.03em;color:var(--white);}
  .dh-ring small{font-size:11px;color:var(--grey-dim);font-weight:600;}
  .dh-txt{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .dh-txt b{font-size:20px;font-weight:700;letter-spacing:-.025em;color:var(--white);line-height:1.15;}
  .dh-txt span{font-size:12.5px;color:var(--grey);line-height:1.35;}
  .do-list{padding-top:14px;}
  .do-group + .do-group{margin-top:20px;}
  .dg-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 7px;border-bottom:1px solid var(--hair, var(--border));}
  .dg-h span{flex:1;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--grey-dim);}
  .dg-h.today span{color:var(--amber);}
  .dg-h b{font:600 11.5px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .do-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--hair, var(--border));}
  .do-row:last-child{border-bottom:none;}
  .do-chk{width:26px;height:26px;border-radius:50%;flex:0 0 auto;padding:0;cursor:pointer;
    border:2px solid color-mix(in srgb, var(--grey-dim) 75%, transparent);background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--on-accent);font:700 11px var(--fx-num);transition:background .15s,border-color .15s;}
  .do-row.habit .do-chk{border-radius:9px;}
  .do-row.hot .do-chk{border-color:var(--pnl-down);}
  .do-chk.part{border-color:var(--amber);color:var(--amber);}
  .do-row.done .do-chk{background:var(--amber);border-color:var(--amber);color:var(--on-accent);}
  .do-row.frozen .do-chk{border-color:var(--cyan);color:var(--cyan);font-size:12px;}
  .do-chk svg{width:15px;height:15px;}
  .do-chk:active{transform:scale(.9);}
  .do-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:none;
    padding:0;cursor:pointer;color:var(--white);font-family:var(--font-body);}
  .do-t{font-size:14.5px;font-weight:500;letter-spacing:-.01em;line-height:1.3;word-break:break-word;}
  .do-m{font-size:11.5px;color:var(--grey-dim);line-height:1.35;}
  .do-m .do-kind{font-style:normal;color:var(--grey);}
  .do-m b.late, .do-m b.hot{color:var(--pnl-down);font-weight:600;}
  .do-row.done .do-t{color:var(--grey-dim);text-decoration:line-through;
    text-decoration-color:color-mix(in srgb, var(--grey-dim) 60%, transparent);}
  .do-row.done .do-m{opacity:.7;}
  .do-row.fresh{animation:todoFresh 2.4s ease;border-radius:12px;}
  .do-empty{font-size:12.5px;color:var(--grey-dim);padding:12px 2px 4px;}
  .do-done summary{cursor:pointer;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;
    color:var(--grey-dim);list-style:none;}
  .do-done summary::-webkit-details-marker{display:none;}
  .do-done summary::after{content:" ›";}
  .do-done[open] summary{margin-bottom:6px;}
  .do-done .fx-linkbtn{display:block;margin-top:10px;}
  .fx-linkbtn.danger{color:var(--pnl-down);}
  .dw-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .dw-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;gap:6px;}
  .dw-row{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px;}
  .dw-grid .wd{font-size:9.5px;color:var(--grey-dim);text-align:center;font-weight:700;letter-spacing:.04em;}
  .dw-grid .wd.now{color:var(--amber);}
  .dw-name{font-size:13.5px;font-weight:500;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
    background:none;border:none;text-align:left;padding:0;font-family:var(--font-body);min-width:0;flex:1;}
  .dw-name small{font-size:11px;color:var(--grey-dim);font-weight:400;margin-left:7px;}
  .dw-c{width:100%;height:32px;border-radius:9px;margin:0;padding:0;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:10px;color:var(--cyan);border:1.5px solid color-mix(in srgb, var(--grey-dim) 50%, transparent);background:transparent;}
  .dw-c.done{background:var(--amber);border-color:var(--amber);}
  .dw-c.frozen{border-color:var(--cyan);background:color-mix(in srgb, var(--cyan) 16%, transparent);}
  .dw-c.off{border-style:dashed;opacity:.4;}
  .dw-c.miss{border-color:color-mix(in srgb, var(--pnl-down) 55%, transparent);}
  .dw-c.future{opacity:.28;cursor:default;}
  .dw-c.today{box-shadow:0 0 0 2px color-mix(in srgb, var(--amber) 30%, transparent);}
  .dw-s{font:600 11px 'JetBrains Mono',monospace;color:var(--grey-dim);text-align:right;white-space:nowrap;}
  .it-text{resize:none;font-size:15px;line-height:1.4;font-weight:500;}
  .it-name{font-size:16px;font-weight:600;}
  .it-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;}
  .it-stats > div{display:flex;flex-direction:column;gap:2px;padding:10px 11px;border-radius:14px;min-width:0;
    background:color-mix(in srgb, var(--card) 72%, transparent);border:1px solid var(--border);}
  .it-stats b{font:700 16px var(--fx-num);letter-spacing:-.02em;color:var(--white);white-space:nowrap;}
  .it-stats span{font-size:10.5px;color:var(--grey-dim);line-height:1.25;}
  .it-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .it-days button{height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--grey);
    font:600 13px var(--font-body);cursor:pointer;}
  .it-days button.on{background:var(--amber);color:var(--on-accent);border-color:transparent;}
  .it-quick{display:inline-flex;gap:10px;text-transform:none;letter-spacing:0;}
  .it-quick button{background:none;border:none;color:var(--amber);font:600 11.5px var(--font-body);cursor:pointer;padding:0;}
  .it-target{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);}
  .it-target input{width:64px;padding:6px 8px;border-radius:10px;}
  /* в сетках месяца и недели — дни не по расписанию и кнопка дней */
  .day-cell.off{opacity:.35;border-style:dashed;}
  .days-btn{background:var(--card2);border:1px solid var(--border);color:var(--grey);border-radius:9px;
    padding:3px 9px;font-size:11px;cursor:pointer;white-space:nowrap;font-family:var(--font-body);}
  .days-btn:hover{border-color:var(--amber);color:var(--white);}

  /* привычки: месяц и неделя в новом виде */
  .hb-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .hb-avg{font:600 12px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .hb-list{display:flex;flex-direction:column;gap:8px;}
  .hb-card{padding:12px 12px 10px;border-radius:16px;background:color-mix(in srgb, var(--pane-solid, var(--card)) 60%, transparent);
    border:1px solid var(--border);}
  .hb-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;}
  .hb-head{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:none;
    padding:0;cursor:pointer;font-family:var(--font-body);color:var(--white);}
  .hb-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;word-break:break-word;}
  .hb-sub{font-size:11.5px;color:var(--grey-dim);}
  .hb-pills{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;max-width:52%;}
  .hb-pill{font:700 11px 'JetBrains Mono',monospace;padding:3px 8px;border-radius:20px;white-space:nowrap;
    background:color-mix(in srgb, var(--grey-dim) 14%, transparent);color:var(--grey);}
  .hb-pill.risk{background:color-mix(in srgb, var(--pnl-down) 16%, transparent);color:var(--pnl-down);}
  .hb-pill.ok{background:var(--ok-bg);color:var(--ok-fg);}
  .hb-pill.low{background:var(--bad-bg);color:var(--bad-fg);}
  .hb-list.week .days-scroll{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;overflow:visible;}
  .hb-list.week .day-cell{width:auto;height:34px;}
  .day-cell.is-today{box-shadow:inset 0 0 0 1.5px var(--amber);}

  /* ---- уведомления ---- */
  .nt-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .nt-off{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:15px;margin-bottom:12px;
    background:color-mix(in srgb, var(--amber) 12%, transparent);border:1px solid color-mix(in srgb, var(--amber) 38%, transparent);}
  .nt-off > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .nt-off b{font-size:13.5px;color:var(--white);letter-spacing:-.01em;}
  .nt-off span{font-size:12px;line-height:1.4;color:var(--grey);}
  .nt-off .btn{flex:0 0 auto;padding:10px 15px;text-decoration:none;}
  .nt-on{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:baseline;font-size:12px;color:var(--grey);margin-bottom:12px;}
  .nt-on .ok{color:var(--green);font-weight:600;}
  .nt-warn{flex-basis:100%;margin:4px 0 0;font-size:11.5px;line-height:1.4;color:var(--pink);}
  .nt-warn button{border:none;background:none;color:var(--amber);font:600 11.5px var(--font-body);padding:0 0 0 4px;cursor:pointer;}
  .nt-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .nt-btns .btn{padding:8px 13px;font-size:12.5px;}
  .nt-opt{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .nt-opt .vc-check{flex:1;min-width:0;}
  .vc-check .tt{flex:1;min-width:0;}
  .nt-time{width:88px;flex:0 0 auto;margin-top:8px;padding:7px 8px;border-radius:11px;border:1px solid var(--border);
    background:var(--card);color:var(--white);font:600 13px 'JetBrains Mono',monospace;}
  .vc-check.sub{margin:4px 0 4px 26px;font-size:12.5px;}
  .vc-check.sub small{padding-left:26px;}
  .nt-next{margin-top:14px;padding-top:10px;border-top:1px solid var(--hair, var(--border));}
  .nt-next .lab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;margin-bottom:4px;}
  .nt-pi{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:4px 0;color:var(--grey);}
  .nt-pi .t{flex:0 0 104px;font:500 11px 'JetBrains Mono',monospace;color:var(--grey-dim);white-space:nowrap;}
  .nt-pi .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---- доходы: план месяца ---- */
  .fx-plan{display:block;width:100%;text-align:left;margin-top:14px;padding:11px 13px 10px;border-radius:16px;
    border:1px solid var(--border);background:color-mix(in srgb, var(--card) 72%, transparent);color:var(--grey);
    font:inherit;cursor:pointer;}
  .fx-plan-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;}
  .fx-plan-top b{color:var(--white);font-family:var(--fx-num);font-weight:700;letter-spacing:-.01em;}
  .fx-plan-top .pc{font:700 15px var(--fx-num);color:var(--white);letter-spacing:-.02em;}
  .fx-meter.plan{position:relative;margin:9px 0 8px;}
  .fx-meter.plan b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--white);opacity:.55;}
  .fx-plan-row{font-size:12px;line-height:1.45;color:var(--grey);}
  .fx-plan-row b{color:var(--white);font-weight:600;}
  .fx-plan-note{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--grey-dim);}
  .fx-plan-add{display:block;width:100%;margin-top:12px;border:1px dashed color-mix(in srgb, var(--amber) 55%, transparent);
    background:none;color:var(--amber);font:600 12.5px var(--font-body);padding:10px 13px;border-radius:14px;
    cursor:pointer;text-align:left;}

  /* ---- доходы: разбор ---- */
  .fx-sec + .fx-sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair, var(--border));}
  .fx-sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .fx-sec-h .t{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .fx-cta{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:12px;line-height:1.45;color:var(--grey);}
  .yl-grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);align-items:center;}
  .yl-grid .h{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-dim);text-align:right;padding:0 0 2px 12px;}
  .yl-grid .v{padding-left:12px;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;}
  .yl-grid .n{min-width:0;display:flex;flex-direction:column;gap:1px;padding:7px 0;}
  .yl-grid .n b{font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .yl-grid .n b i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}
  .yl-grid .n small{font:500 10.5px 'JetBrains Mono',monospace;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .yl-grid .v{font:600 12.5px 'JetBrains Mono',monospace;text-align:right;white-space:nowrap;color:var(--grey);letter-spacing:-.02em;}
  .yl-grid .v.pos{color:var(--pnl-up);} .yl-grid .v.neg{color:var(--pnl-down);}
  .yl-grid .tot{border-top:1px solid var(--hair, var(--border));}
  .yl-grid .n.tot b{color:var(--grey);}
  .cs-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;font-size:13px;color:var(--grey);}
  .cs-row .v{font:600 13px 'JetBrains Mono',monospace;white-space:nowrap;letter-spacing:-.02em;}
  .cs-row .v.pos{color:var(--pnl-up);} .cs-row .v.neg{color:var(--pnl-down);}
  .cs-row.tot{border-top:1px solid var(--hair, var(--border));margin-top:3px;padding-top:8px;color:var(--white);font-weight:600;}
  .cs-note{font-size:11.5px;line-height:1.45;color:var(--grey-dim);margin-top:4px;}
  .wd-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:8px;}
  .wd-col{display:flex;flex-direction:column;align-items:stretch;background:none;border:none;padding:4px 0 5px;
    font:inherit;color:inherit;cursor:pointer;border-radius:10px;min-width:0;}
  .wd-col.sel{background:color-mix(in srgb, var(--grey-dim) 14%, transparent);}
  .wd-z{display:flex;justify-content:center;}
  .wd-z.up{align-items:flex-end;border-bottom:1px solid color-mix(in srgb, var(--grey-dim) 45%, transparent);}
  .wd-z.dn{align-items:flex-start;}
  .wd-z i{display:block;width:58%;max-width:24px;}
  .wd-z.up i{background:var(--pnl-up);border-radius:4px 4px 0 0;}
  .wd-z.dn i{background:var(--pnl-down);border-radius:0 0 4px 4px;}
  .wd-col .v{font:600 10px 'JetBrains Mono',monospace;color:var(--grey);text-align:center;margin-top:5px;white-space:nowrap;letter-spacing:-.04em;}
  .wd-col .k{font-size:10.5px;color:var(--grey-dim);text-align:center;margin-top:1px;}
  .wd-col .c{font:500 9px 'JetBrains Mono',monospace;color:var(--grey-dim);text-align:center;opacity:.85;min-height:11px;}
  .wd-say{font-size:12px;line-height:1.5;color:var(--grey);margin-top:9px;}
  .wd-say b{color:var(--white);font-weight:600;}

  /* ---- доходы: комиссия и фандинг в листе дня ---- */
  .fx-costs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
  .fx-cost{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:13px;border:1px solid var(--border);
    background:var(--card);min-width:0;}
  .fx-cost:focus-within{border-color:var(--amber);}
  .fx-cost .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-dim);flex:0 0 auto;}
  .fx-cost .s{font:700 15px var(--fx-num);flex:0 0 auto;}
  .fx-cost .s.pos{color:var(--pnl-up);} .fx-cost .s.neg{color:var(--pnl-down);}
  .fx-cost button.s{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:none;
    padding:0;cursor:pointer;line-height:1;}
  .fx-cost input{flex:1;min-width:0;width:100%;background:transparent !important;border:none !important;box-shadow:none !important;
    padding:6px 0;font:600 15px 'JetBrains Mono',monospace;color:var(--white);text-align:right;outline:none;}
  .fx-costs-add{display:block;margin-top:10px;}
  .src-cap{grid-column:2 / 5;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--grey);margin-top:-2px;}
  .src-cap span{flex:0 0 auto;}
  .src-cap .sh-in{margin-top:0;padding:8px 11px;font-size:13px;text-align:right;}
  .src-cap b{font:600 12px 'JetBrains Mono',monospace;color:var(--grey);flex:0 0 auto;}

  /* ---- здоровье ---- */
  html[data-look="glass"] .fd-mark.slp{background:var(--cyan);}
  .hl-big{font-family:var(--fx-num);font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1.05;color:var(--white);}
  .hl-sub{font-size:12.5px;color:var(--grey);margin-top:5px;line-height:1.45;}
  .hl-sub b{color:var(--white);font-weight:600;}
  .hl-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .hl-row .btn{flex:1;min-width:120px;}
  .hl-compact{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--grey);}
  .hl-compact b{color:var(--white);}
  .sl-times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .sl-time{display:flex;flex-direction:column;gap:3px;padding:8px 12px;border-radius:14px;border:1px solid var(--border);background:var(--card);min-width:0;}
  .sl-time span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .sl-time input{background:transparent !important;border:none !important;box-shadow:none !important;padding:0;
    font:700 22px 'JetBrains Mono',monospace;color:var(--white);width:100%;min-width:0;outline:none;}
  .sl-dur{font:600 12.5px 'JetBrains Mono',monospace;color:var(--grey);margin-top:8px;text-align:center;}
  .sl-q{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:10px;}
  .sl-q button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:13px;
