    border:1px solid var(--border);background:var(--card);color:var(--grey);font:inherit;cursor:pointer;min-width:0;}
  .sl-q button b{font:700 16px var(--fx-num);color:var(--white);}
  .sl-q button small{font-size:9.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .sl-q button.on{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 18%, var(--card));color:var(--white);}
  .hl-lab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;margin:14px 0 6px;}
  .sl-axis{position:relative;height:14px;margin:4px 46px 2px 46px;}
  .sl-axis span{position:absolute;transform:translateX(-50%);font:500 9.5px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .sl-r{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;width:100%;background:none;border:none;
    padding:3px 0;font:inherit;color:inherit;cursor:pointer;text-align:left;}
  .sl-r .d{font-size:11px;color:var(--grey-dim);white-space:nowrap;}
  .sl-r .d.we{color:var(--grey);font-weight:600;}
  .sl-r .tr{position:relative;height:14px;border-radius:7px;background:color-mix(in srgb, var(--grey-dim) 11%, transparent);}
  .sl-r .tr i{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--amber);}
  .sl-r .tr i.short{background:var(--pink);}
  .sl-r .tr b{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px dashed color-mix(in srgb, var(--grey) 75%, transparent);}
  .sl-r .v{font:600 11.5px 'JetBrains Mono',monospace;color:var(--grey);text-align:right;white-space:nowrap;}
  .sl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--grey-dim);margin-top:9px;}
  .sl-legend i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:5px;}
  .sl-legend i.t{width:0;height:10px;border-left:1.5px dashed var(--grey);border-radius:0;margin-right:7px;vertical-align:-1px;}
  .sl-goal{display:flex;gap:5px;flex-wrap:wrap;}
  .sl-goal button{padding:8px 12px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--grey);
    font:600 13px 'JetBrains Mono',monospace;cursor:pointer;}
  .sl-goal button.on{border-color:var(--amber);color:var(--white);background:color-mix(in srgb, var(--amber) 18%, var(--card));}
  .hl-set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13.5px;color:var(--white);}
  .hl-set input[type=time], .hl-set input.num{width:96px;padding:7px 9px;border-radius:11px;border:1px solid var(--border);
    background:var(--card);color:var(--white);font:600 13px 'JetBrains Mono',monospace;}
  .hl-note{font-size:12.5px;line-height:1.5;color:var(--grey);margin-top:10px;}
  .hl-note b{color:var(--white);font-weight:600;}
  .ev-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;background:none;border:none;
    border-top:1px solid var(--hair, var(--border));font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .ev-row:first-of-type{border-top:none;padding-top:2px;}
  .ev-row span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ev-row b{font-size:14px;font-weight:600;color:var(--white);}
  .ev-row small{font-size:12px;color:var(--grey-dim);line-height:1.35;}
  .ev-row i{font-style:normal;color:var(--amber);font-size:18px;}
  .wt-in{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .wt-in label{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:2px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);}
  .wt-in label:focus-within{border-color:var(--amber);}
  .wt-in input{flex:1;min-width:0;background:transparent !important;border:none !important;box-shadow:none !important;
    font:700 24px var(--fx-num);color:var(--white);padding:8px 0;outline:none;}
  .wt-in span{font:600 14px 'JetBrains Mono',monospace;color:var(--grey);}
  .wt-in .btn{flex:0 0 auto;padding:14px 16px;}
  .wt-svg{width:100%;height:auto;display:block;margin-top:8px;}
  .wt-leg{display:flex;gap:14px;font-size:11px;color:var(--grey-dim);margin-top:4px;}
  .wt-leg i{display:inline-block;vertical-align:1px;margin-right:5px;}
  .wt-leg i.dot{width:6px;height:6px;border-radius:50%;background:var(--amber);opacity:.5;}
  .wt-leg i.ln{width:14px;height:2px;background:var(--amber);}
  .wt-list .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;
    border-bottom:1px solid var(--hair, var(--border));font-size:13px;color:var(--grey);}
  .wt-list .r:last-child{border-bottom:none;}
  .wt-list .r b{font:600 13px 'JetBrains Mono',monospace;color:var(--white);}
  .wt-list .r small{font-size:11px;color:var(--grey-dim);}
  .wt-list .r button{border:none;background:none;color:var(--grey-dim);cursor:pointer;font-size:13px;padding:2px 6px;}
  .fe-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:8px;}
  .fe-strip span{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font:500 9.5px 'JetBrains Mono',monospace;color:var(--grey-dim);background:color-mix(in srgb, var(--grey-dim) 11%, transparent);}
  .fe-strip span.l1, .fe-leg i.l1{background:color-mix(in srgb, var(--amber) 20%, var(--card));color:var(--grey);}
  .fe-strip span.l2, .fe-leg i.l2{background:color-mix(in srgb, var(--amber) 36%, var(--card));color:var(--grey);}
  .fe-strip span.l3, .fe-leg i.l3{background:color-mix(in srgb, var(--amber) 54%, var(--card));color:var(--white);}
  .fe-strip span.l4, .fe-leg i.l4{background:color-mix(in srgb, var(--amber) 76%, var(--card));color:var(--on-accent, #fff);}
  .fe-strip span.l5, .fe-leg i.l5{background:var(--amber);color:var(--on-accent, #fff);}
  .fe-strip span.today{outline:1.5px solid var(--white);outline-offset:1px;}
  .fe-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--grey-dim);margin-top:8px;}
  .fe-leg i{width:12px;height:12px;border-radius:4px;display:inline-block;}
  .fe-note{width:100%;margin-top:10px;padding:10px 12px;border-radius:13px;border:1px solid var(--border);background:var(--card);
    color:var(--white);font:400 14px var(--font-body);}
  .fe-notes .r{padding:7px 0;border-bottom:1px solid var(--hair, var(--border));font-size:13px;color:var(--white);line-height:1.4;}
  .fe-notes .r:last-child{border-bottom:none;}
  .fe-notes .r small{display:block;font-size:11px;color:var(--grey-dim);margin-bottom:2px;}
  /* ---- дневник: три вопроса ---- */
  .jq{display:flex;flex-direction:column;gap:12px;}
  .jq label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--white);}
  .jq textarea{width:100%;min-height:54px;resize:vertical;padding:10px 12px;border-radius:13px;border:1px solid var(--border);
    background:var(--card);color:var(--white);font:400 14px/1.45 var(--font-body);}
  .jq textarea:focus{border-color:var(--amber);outline:none;}
  .jq-todo{align-self:flex-start;padding:8px 13px;font-size:12.5px;}
  .jq-ok{color:var(--green);font-weight:700;}
  .jq-past{font-size:13.5px;line-height:1.55;color:var(--grey);white-space:pre-wrap;}
  .jq-past b{display:block;color:var(--white);font-size:12px;margin-top:6px;}

  /* ---- дела в сетке недели ---- */
  .dw-c.dw-t{cursor:default;font:700 12px 'JetBrains Mono',monospace;color:var(--grey);}
  .dw-c.dw-t.done{color:var(--on-accent, #fff);}
  .dw-c.part{background:color-mix(in srgb, var(--amber) 38%, transparent);border-color:var(--amber);color:var(--white);}
  .dw-name.dw-todo{cursor:default;font-weight:600;}

  /* ---- привычки: шапка ---- */
  .hb2-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;
    background:color-mix(in srgb, var(--grey-dim) 13%, transparent);}
  .hb2-seg button{padding:9px 4px;border:none;border-radius:10px;background:none;color:var(--grey);
    font:600 13px var(--font-body);cursor:pointer;}
  .hb2-seg button.on{background:var(--pane-solid, var(--card));color:var(--white);box-shadow:0 1px 4px rgba(0,0,0,.10);}
  .hb2-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;}
  .hb2-nav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);
    color:var(--white);font-size:18px;cursor:pointer;flex:0 0 auto;}
  .hb2-nav span{font-weight:600;font-size:15px;color:var(--white);text-align:center;}
  .hb2-big{display:flex;align-items:baseline;gap:10px;margin-top:14px;}
  .hb2-big b{font-family:var(--fx-num);font-size:42px;font-weight:700;letter-spacing:-.04em;color:var(--white);line-height:1;}
  .hb2-big span{font-size:13px;color:var(--grey);}
  .hb2-meter{height:6px;border-radius:4px;margin:10px 0 2px;overflow:hidden;background:color-mix(in srgb, var(--grey-dim) 16%, transparent);}
  .hb2-meter i{display:block;height:100%;border-radius:4px;background:var(--amber);}
  .hb2-say{font-size:12.5px;color:var(--grey);margin-top:8px;line-height:1.5;}
  .hb2-say b{color:var(--white);font-weight:600;}
  /* ---- клетка дня — неделя и календарь месяца ---- */
  .hw-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .hw-head{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .hw-head span{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--grey-dim);}
  .hw-head b{font:600 12px 'JetBrains Mono',monospace;color:var(--grey);}
  .hw-head.now span, .hw-head.now b{color:var(--amber);}
  .hw-name{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:12px;
    background:none;border:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0;}
  .hw-name .n{font-size:14px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .hw-name .n small{font-size:11px;font-weight:400;color:var(--grey-dim);margin-left:6px;}
  .hw-name .m{flex:0 0 auto;font:600 11.5px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .hw-name .m.risk{color:var(--pink);}
  .hc{height:40px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;
    justify-content:center;font:700 13px 'JetBrains Mono',monospace;color:var(--grey-dim);cursor:pointer;padding:0;min-width:0;}
  .hc.done{background:var(--amber);border-color:var(--amber);color:var(--on-accent, #fff);}
  .hc.frozen{border-color:var(--cyan);background:color-mix(in srgb, var(--cyan) 16%, transparent);color:var(--cyan);}
  .hc.part{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 22%, transparent);color:var(--white);font-size:11px;}
  .hc.off{border-style:dashed;opacity:.45;}
  .hc.miss{border-color:color-mix(in srgb, var(--pnl-down) 50%, transparent);}
  .hc.future{opacity:.32;cursor:default;}
  .hc.today{box-shadow:0 0 0 2.5px color-mix(in srgb, var(--amber) 38%, transparent);}
  .hc.blank{visibility:hidden;}
  /* ---- месяц: строки ---- */
  .hm-row{border-top:1px solid var(--hair, var(--border));}
  .hm-row:first-child{border-top:none;}
  .hm-head{display:block;width:100%;background:none;border:none;padding:13px 0 12px;font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .hm-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .hm-top .n{font-size:14.5px;font-weight:600;color:var(--white);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-top .p{font:700 16px var(--fx-num);color:var(--white);flex:0 0 auto;}
  .hm-top .p.low{color:var(--pink);}
  .hm-sub{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--grey-dim);margin-top:3px;}
  .hm-sub .risk{color:var(--pink);}
  .hm-strip{display:grid;gap:2px;margin-top:9px;height:18px;}
  .hm-strip i{border-radius:3px;background:color-mix(in srgb, var(--grey-dim) 15%, transparent);}
  .hm-strip i.done{background:var(--amber);}
  .hm-strip i.frozen{background:color-mix(in srgb, var(--cyan) 55%, transparent);}
  .hm-strip i.part{background:color-mix(in srgb, var(--amber) 45%, transparent);}
  .hm-strip i.off{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--grey-dim) 22%, transparent);}
  .hm-strip i.miss{background:color-mix(in srgb, var(--pnl-down) 24%, transparent);}
  .hm-strip i.future{opacity:.45;}
  .hm-strip i.today{box-shadow:0 0 0 2px color-mix(in srgb, var(--amber) 55%, transparent);}
  .hm-row.open .hm-head{padding-bottom:6px;}
  .hm-row.open .hm-strip{display:none;}
  .hm-cal{padding:4px 0 14px;}
  .hm-cal-act{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;}
  .hm-chev{display:inline-block;margin-left:6px;color:var(--grey-dim);font-size:11px;transition:transform .15s;}
  .hm-row.open .hm-chev{transform:rotate(180deg);}
  /* ---- год ---- */
  .hy-bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:104px;margin-top:8px;}
  .hy-bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;background:none;border:none;
    padding:0;cursor:pointer;font:inherit;min-width:0;}
  .hy-bar em{font:600 9.5px 'JetBrains Mono',monospace;font-style:normal;color:var(--grey);margin-bottom:3px;}
  .hy-bar i{display:block;width:74%;border-radius:4px 4px 0 0;background:var(--amber);min-height:2px;}
  .hy-bar.empty i{background:color-mix(in srgb, var(--grey-dim) 16%, transparent);}
  .hy-bar.future{cursor:default;}
  .hy-lab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:5px;border-top:1px solid var(--hair, var(--border));padding-top:5px;}
  .hy-lab span{text-align:center;font:600 9.5px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .hy-lab span.now{color:var(--amber);}
  .hy-row{padding:10px 0;border-top:1px solid var(--hair, var(--border));}
  .hy-row:first-of-type{border-top:none;}
  .hy-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;}
  .hy-row .n{font-size:14px;font-weight:600;color:var(--white);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hy-row .p{font:600 12px 'JetBrains Mono',monospace;color:var(--grey);flex:0 0 auto;}
  .hy-cells{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;}
  .hy-cells button, .hy-leg i{height:22px;border-radius:6px;border:none;padding:0;cursor:pointer;
    background:color-mix(in srgb, var(--grey-dim) 12%, transparent);}
  .hy-cells button.future{opacity:.3;cursor:default;}
  .hy-cells button.l1, .hy-leg i.l1{background:color-mix(in srgb, var(--amber) 20%, var(--card));}
  .hy-cells button.l2, .hy-leg i.l2{background:color-mix(in srgb, var(--amber) 38%, var(--card));}
  .hy-cells button.l3, .hy-leg i.l3{background:color-mix(in srgb, var(--amber) 56%, var(--card));}
  .hy-cells button.l4, .hy-leg i.l4{background:color-mix(in srgb, var(--amber) 76%, var(--card));}
  .hy-cells button.l5, .hy-leg i.l5{background:var(--amber);}
  .hy-cells button.now{box-shadow:0 0 0 2px color-mix(in srgb, var(--amber) 55%, transparent);}
  .hy-cells button.none{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--grey-dim) 25%, transparent);cursor:default;}
  .hy-head{margin:2px 0 -2px;}
  .hy-head span{text-align:center;font:600 9.5px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .hy-head span.now{color:var(--amber);}
  .hy-bar.future i{visibility:hidden;}
  .hy-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--grey-dim);margin-top:10px;}
  .hy-leg i{width:14px;height:12px;border-radius:4px;display:inline-block;cursor:default;}

  /* ---- тренировки ---- */
  .wk2-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px;}
  .wk2-stats > div{display:flex;flex-direction:column;gap:3px;padding:10px 9px;border-radius:13px;min-width:0;
    background:color-mix(in srgb, var(--card) 72%, transparent);border:1px solid var(--border);}
  .wk2-stats b{font:700 16px var(--fx-num);color:var(--white);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wk2-stats span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .fx-hero .wk-cal{gap:4px;}
  .fx-hero .wk-cell{min-height:34px;}
  .wk2-add{width:100%;margin-top:14px;padding:13px;font-size:14.5px;font-weight:700;border-radius:15px;}
  .wk2-day{display:flex;justify-content:space-between;gap:10px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--grey-dim);font-weight:600;margin:14px 0 2px;}
  .wk2-day:first-child{margin-top:2px;}
  .wk2-day b{letter-spacing:0;text-transform:none;font:500 11px 'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pr-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;
    border-bottom:1px solid var(--hair, var(--border));font-size:13.5px;color:var(--white);}
  .pr-row:last-child{border-bottom:none;}
  .pr-row b{font:600 13px 'JetBrains Mono',monospace;white-space:nowrap;}
  .pr-row small{display:block;font-size:11px;color:var(--grey-dim);margin-top:1px;}
  .ws-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .ws-field{display:flex;flex-direction:column;gap:3px;padding:8px 12px;border-radius:14px;border:1px solid var(--border);
    background:var(--card);min-width:0;}
  .ws-field:focus-within{border-color:var(--amber);}
  .ws-field span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-dim);font-weight:600;}
  .ws-field input{background:transparent !important;border:none !important;box-shadow:none !important;padding:0;
    font:600 16px 'JetBrains Mono',monospace;color:var(--white);width:100%;min-width:0;outline:none;}
  .ws-ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 32px;gap:6px;align-items:center;margin-top:7px;}
  .ws-ex input{min-width:0;width:100%;padding:10px 11px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--white);font-size:13.5px;}
  .ws-ex input.sets{font-family:'JetBrains Mono',monospace;font-size:13px;}
  .ws-ex button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--grey-dim);cursor:pointer;}
  .ws-ex small{grid-column:1/-1;font:500 11px 'JetBrains Mono',monospace;color:var(--grey-dim);margin:-1px 0 1px 4px;}
  .ws-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .ws-quick button{padding:7px 11px;border-radius:16px;border:1px dashed var(--border);background:none;color:var(--grey);
    font:500 12px var(--font-body);cursor:pointer;}
  .ws-quick button.own{border-style:solid;border-color:var(--amber);color:var(--amber);}
  /* ---- счета ---- */
  .acc2-rates{display:flex;flex-wrap:wrap;gap:5px 12px;align-items:baseline;margin-top:14px;padding-top:10px;
    border-top:1px solid var(--hair, var(--border));font:500 11.5px 'JetBrains Mono',monospace;color:var(--grey);}
  .acc2-rates small{font-family:var(--font-body);color:var(--grey-dim);font-size:11px;}
  .acc2-rates button{border:none;background:none;color:var(--amber);font:600 12px var(--font-body);cursor:pointer;padding:0;margin-left:auto;}
  .acc2-rates .note{flex-basis:100%;font-family:var(--font-body);font-size:11px;color:var(--grey-dim);}
  .acc2-bank{display:flex;justify-content:space-between;gap:10px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--grey-dim);font-weight:600;margin:14px 0 0;}
  .acc2-bank:first-child{margin-top:2px;}
  .acc2-bank b{letter-spacing:0;text-transform:none;font:500 11px 'JetBrains Mono',monospace;}
  .fx-row .a small{display:block;font:500 10.5px 'JetBrains Mono',monospace;color:var(--grey-dim);text-align:right;margin-top:1px;}
  .acc2-cur{font:500 11.5px 'JetBrains Mono',monospace;color:var(--grey);margin-top:8px;}
  .acc2-note{font-size:11.5px;color:var(--grey-dim);margin-top:10px;line-height:1.45;}
  .acc2-rec{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .acc2-rec input{flex:1;min-width:0;padding:11px 13px;border-radius:13px;border:1px solid var(--border);background:var(--card);
    color:var(--white);font:600 14px 'JetBrains Mono',monospace;}
  .acc2-rec .btn{flex:0 0 auto;padding:11px 14px;}

  /* ---- привычка «не смог» ---- */
  .do-row.failed .do-t{text-decoration:line-through;color:var(--grey-dim);}
  .do-row.failed .do-chk{color:var(--pink);border-color:color-mix(in srgb, var(--pink) 55%, transparent);font-weight:700;}
  .hc.fail{border-color:var(--pink);background:color-mix(in srgb, var(--pink) 14%, transparent);color:var(--pink);}
  .hm-strip i.fail{background:var(--pink);}
  .dw-c.fail{border-color:var(--pink);background:color-mix(in srgb, var(--pink) 14%, transparent);color:var(--pink);font-weight:700;}
  .it-why{margin-top:10px;}
  .it-why .sh-in{margin-top:8px;}
  .it-fail{font-size:12px;color:var(--grey);margin-top:8px;line-height:1.45;}
  .it-fail b{color:var(--pink);font-weight:600;}
  /* ---- итоги ---- */
  .rt-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;
    border-top:1px solid var(--hair, var(--border));}
  .rt-row:first-of-type{border-top:none;padding-top:4px;}
  .rt-row .ic{font-size:18px;text-align:center;}
  .rt-row .l{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .rt-row .l b{font-size:14px;color:var(--white);font-weight:600;}
  .rt-row .l small{font-size:11.5px;color:var(--grey-dim);line-height:1.35;}
  .rt-row .v{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .rt-row .v b{font:700 16px var(--fx-num);color:var(--white);white-space:nowrap;letter-spacing:-.02em;}
  .rt-d{font:600 11px 'JetBrains Mono',monospace;white-space:nowrap;color:var(--grey-dim);}
  .rt-d.good{color:var(--pnl-up);} .rt-d.bad{color:var(--pnl-down);}
  .rt-say{font-size:13px;line-height:1.5;color:var(--grey);margin-top:12px;}
  .rt-say b{color:var(--white);font-weight:600;}

  /* ---- накопления ---- */
  .sv-ring{--p:0;--s:96px;width:var(--s);height:var(--s);border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:conic-gradient(var(--amber) calc(var(--p)*1%), color-mix(in srgb, var(--grey-dim) 18%, transparent) 0);}
  .sv-ring::before{content:"";grid-area:1/1;width:calc(var(--s) - 16px);height:calc(var(--s) - 16px);border-radius:50%;
    background:var(--pane-solid, var(--panel));}
  .sv-ring span{grid-area:1/1;position:relative;font:700 22px var(--fx-num);letter-spacing:-.03em;color:var(--white);}
  .sv-ring.sm{--s:46px;}
  .sv-ring.sm::before{width:36px;height:36px;}
  .sv-ring.sm span{font-size:15px;}
  .sv-hero{display:flex;align-items:center;gap:16px;}
  .sv-hero .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .sv-hero .t b{font-size:17px;font-weight:700;color:var(--white);letter-spacing:-.01em;}
  .sv-hero .t span{font-size:13px;color:var(--grey);line-height:1.4;}
  .sv-hero .t span b{font-size:13px;}
  .sv-pace{font-size:12.5px;line-height:1.5;color:var(--grey);margin-top:12px;}
  .sv-pace b{color:var(--white);font-weight:600;}
  .sv-pace .ok{color:var(--green);}
  .sv-pace .late{color:var(--pink);}
  .sv-goals{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;}
  .sv-goals::-webkit-scrollbar{display:none;}
  .sv-goal{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:18px;
    border:1px solid var(--border);background:var(--card);cursor:pointer;font:inherit;color:inherit;text-align:left;max-width:220px;}
  .sv-goal.on{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 14%, var(--card));}
  .sv-goal .n{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .sv-goal .n b{font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sv-goal .n small{font:500 10.5px 'JetBrains Mono',monospace;color:var(--grey-dim);}
  .sv-goal.add{border-style:dashed;color:var(--amber);font-weight:600;font-size:13px;padding:12px 16px;}
  .sv-month{font-size:12.5px;color:var(--grey);margin:2px 0 6px;line-height:1.45;}
  .sv-month b{color:var(--white);}
  /* ---- настройки: разделы ---- */
  .set-card.closed{padding-top:2px;padding-bottom:2px;margin-bottom:8px;}
  .set-card.closed > :not(.set-head){display:none !important;}
  .set-card:not(.closed) > h2.set-title{display:none;}
  .set-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:12px 0;
    font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .set-head .i{font-size:20px;width:28px;text-align:center;flex:0 0 auto;}
  .set-head .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .set-head .t b{font-size:15px;font-weight:600;color:var(--white);}
  .set-head .t small{font-size:12px;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .set-head .chev{color:var(--grey-dim);font-size:18px;transition:transform .15s;flex:0 0 auto;}
  .set-card:not(.closed) .set-head{margin-bottom:6px;border-bottom:1px solid var(--hair, var(--border));}
  .set-card:not(.closed) .set-head .chev{transform:rotate(90deg);}

  /* ---- быстрая запись ---- */
  .qa-fab{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:44;width:56px;height:56px;
    border-radius:50%;border:none;background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--on-accent);
    font:300 32px/1 var(--font-body);cursor:pointer;display:grid;place-items:center;padding:0 0 3px;
    box-shadow:0 12px 28px -10px color-mix(in srgb, var(--amber) 85%, transparent), 0 3px 8px rgba(0,0,0,.16);
    transition:transform .22s ease, opacity .22s ease;}
  .qa-fab:active{transform:scale(.94);}
  html.fab-hide .qa-fab, html.sheet-open .qa-fab{transform:translateY(160%);opacity:0;pointer-events:none;}
  html.has-qa .undo-toast{bottom:calc(156px + env(safe-area-inset-bottom));}
  /* конец любого списка докручивается выше кнопки — она не закрывает последние строки */
  html.has-qa .app{padding-bottom:calc(166px + env(safe-area-inset-bottom));}
  @media(min-width:760px){ .qa-fab{bottom:28px;right:28px;} html.has-qa .undo-toast{bottom:96px;} html.has-qa .app{padding-bottom:110px;} }
  .qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .qa-tile{display:flex;align-items:center;gap:10px;padding:15px 12px;border-radius:16px;border:1px solid var(--border);
    background:var(--card);color:var(--white);font:600 13.5px var(--font-body);text-align:left;cursor:pointer;min-width:0;}
  .qa-tile .i{font:600 19px/1 var(--font-body);width:26px;text-align:center;flex:0 0 auto;color:var(--amber);}
  .qa-tile:active{transform:scale(.98);}

  /* ---- план на месяц ---- */
  .pl-chips{padding:10px 2px 0;margin-bottom:-2px;}
  .pl-chips button.pl-edit{color:var(--grey-dim);border-style:dashed;}
  .pl-sec{--pc:var(--amber);}
  .pl-sec + .pl-sec{margin-top:14px;}
  .pl-h{display:flex;align-items:center;gap:8px;font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;
    color:var(--grey);padding:2px 2px 2px;}
  .pl-h i{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:0 0 auto;}
  .pl-h b{margin-left:auto;font:600 11px 'JetBrains Mono',monospace;color:var(--grey-dim);letter-spacing:0;}
  .pl-sec .do-chk{border-color:color-mix(in srgb, var(--pc) 70%, var(--border));}
  .pl-sec .do-row.done .do-chk{background:var(--pc);border-color:var(--pc);}
  .pl-sec .do-row.moved .do-t{color:var(--grey-dim);}
  .pl-carry b{display:block;font-size:15px;font-weight:600;color:var(--white);}
  .pl-carry span{display:block;font-size:12.5px;color:var(--grey);margin-top:4px;line-height:1.45;}
  .pl-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .pl-ex button{border:1px dashed var(--border);background:none;color:var(--grey);border-radius:14px;padding:6px 11px;
    font:500 12px var(--font-body);cursor:pointer;}
  .pl-acts{display:flex;gap:8px;margin-top:12px;}
  .pl-acts .btn{flex:1 1 0;padding-left:8px;padding-right:8px;font-size:13px;}
  .pc-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .pc-row .sh-in{margin-top:0;flex:1;min-width:0;}
  .pc-dot{width:30px;height:30px;border-radius:50%;flex:0 0 auto;cursor:pointer;padding:0;
    border:3px solid color-mix(in srgb, var(--white) 22%, transparent);}
  .pc-n{font:500 11px 'JetBrains Mono',monospace;color:var(--grey-dim);min-width:16px;text-align:right;}
  .pc-del{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--grey-dim);
    flex:0 0 auto;cursor:pointer;font-size:12px;}
  .pc-del.confirm{width:auto;padding:0 10px;color:var(--pnl-down);border-color:color-mix(in srgb, var(--pnl-down) 45%, transparent);}

  /* ---- инвестиции ---- */
  .iv-sub b.pos{color:var(--pnl-up);} .iv-sub b.neg{color:var(--pnl-down);}
  .iv-list .fx-row .a small.pos{color:var(--pnl-up);} .iv-list .fx-row .a small.neg{color:var(--pnl-down);}
  .iv-list .acc2-bank small{font:500 10.5px var(--font-body);letter-spacing:0;text-transform:none;color:var(--green);margin-left:6px;}
  .iv-list .acc2-bank + .fx-row{border-top:none;}
  .iv-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .iv-add .btn{flex:1 1 0;padding-left:8px;padding-right:8px;font-size:13px;white-space:nowrap;}
  .iv-prev{margin-top:14px;padding:11px 13px;border-radius:14px;background:color-mix(in srgb, var(--amber) 9%, var(--card));
    border:1px solid color-mix(in srgb, var(--amber) 22%, var(--border));font-size:12.5px;color:var(--grey);line-height:1.5;}
  .iv-prev b{color:var(--white);font-weight:600;}
  .iv-prev b.pos{color:var(--pnl-up);} .iv-prev b.neg{color:var(--pnl-down);}
  .iv-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .iv-2 .sh-in{margin-top:6px;}

  /* ---- день одной фразой ---- */
  .qa-tile.qa-wide{grid-column:1/-1;background:color-mix(in srgb, var(--amber) 13%, var(--card));
    border-color:color-mix(in srgb, var(--amber) 32%, var(--border));}
  .qa-tile .tt{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .qa-tile .tt small{font-weight:500;font-size:11.5px;color:var(--grey);line-height:1.3;}
  .dp-in{display:flex;gap:8px;align-items:stretch;margin-top:4px;}
  .dp-in textarea{flex:1;margin-top:0;min-height:88px;resize:vertical;font-size:14px;line-height:1.4;}
  .dp-mic{width:56px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--amber),var(--amber2));
    color:var(--on-accent);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;padding:0;}
  .dp-mic svg{width:24px;height:24px;}
  .dp-ex{font-size:11.5px;color:var(--grey-dim);margin:8px 2px 0;line-height:1.45;}
  .dp-ex button{border:none;background:none;padding:0;color:var(--amber);font:600 11.5px var(--font-body);cursor:pointer;}
  .dp-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .dp-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:14px;border:1px solid var(--border);
    background:var(--card);font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .dp-item .i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;font:700 15px var(--font-body);
    background:color-mix(in srgb, var(--amber) 15%, transparent);color:var(--amber);}
  .dp-item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .dp-item .t b{font-size:13.5px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dp-item .t small{font-size:11.5px;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dp-item .t b.pos{color:var(--pnl-up);} .dp-item .t b.neg{color:var(--pnl-down);}
  .dp-item .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--amber);background:var(--amber);color:var(--on-accent);
    display:grid;place-items:center;flex:0 0 auto;}
  .dp-item .ck svg{width:13px;height:13px;}
  .dp-cur{border:1px solid var(--border);background:var(--pane, var(--card));border-radius:9px;padding:4px 9px;
    font:600 13px var(--font-body);color:var(--white);cursor:pointer;flex:0 0 auto;min-width:32px;}
  .dp-item.off{opacity:.5;}
  .dp-item.off .ck{background:none;color:transparent;border-color:var(--border);}
  .dp-item.off .t b{text-decoration:line-through;}
  .dp-none{font-size:12.5px;color:var(--grey-dim);padding:12px 4px 2px;line-height:1.5;}
  .dp-card .dp-c-t b{display:block;font-size:16px;font-weight:700;color:var(--white);letter-spacing:-.01em;}
  .dp-card .dp-c-t span{display:block;font-size:12.5px;color:var(--grey);margin-top:3px;line-height:1.4;}
  .dp-card .dp-c-b{display:flex;gap:8px;margin-top:12px;}
  .dp-card .dp-c-b .btn{flex:1 1 0;}

  /* ---- банк и чеки ---- */
  .bk-card .bk-h{display:flex;align-items:flex-start;gap:12px;}
  .bk-card .bk-h .i{font-size:22px;line-height:1.1;flex:0 0 auto;}
  .bk-card .bk-h b{display:block;font-size:15px;font-weight:600;color:var(--white);}
  .bk-card .bk-h span{display:block;font-size:12.5px;color:var(--grey);margin-top:3px;line-height:1.42;}
  .bk-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .bk-acts .btn{flex:1 1 0;white-space:nowrap;}
  .bk-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--hair, var(--border));flex-wrap:wrap;}
  .bk-row:last-child{border-bottom:none;}
  .bk-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .bk-row .t b{font:600 13.5px var(--font-body);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk-row .t small{font-size:11px;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk-row .a{font:600 13px 'JetBrains Mono',monospace;white-space:nowrap;color:var(--grey);}
  .bk-row .a.pos{color:var(--pnl-up);} .bk-row .a.neg{color:var(--pnl-down);}
  .bk-btns{display:flex;gap:6px;width:100%;justify-content:flex-end;}
  .bk-btns button{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:6px 11px;
    font:600 12px var(--font-body);color:var(--white);cursor:pointer;}
  .bk-btns button.x{color:var(--grey-dim);}
  .bk-note{font-size:11.5px;color:var(--grey-dim);line-height:1.5;margin-top:10px;}
  .bk-note b{color:var(--grey);}
  .bk-ok{color:var(--green);font-weight:600;}
  .bk-test{margin-top:8px;font-size:12px;color:var(--grey);line-height:1.5;}
  .bk-test b{color:var(--white);}
  .bk-cards .pc-row{margin-top:6px;}
  .bk-cards .lbl{font:600 12.5px var(--font-body);color:var(--white);min-width:96px;}
  .sh-qr{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:7px 10px;font:600 12px var(--font-body);
    color:var(--white);cursor:pointer;margin-right:6px;flex:0 0 auto;}
  .rc-dup{margin-top:12px;padding:10px 12px;border-radius:13px;font-size:12.5px;line-height:1.45;color:var(--grey);
    background:color-mix(in srgb, var(--amber) 10%, var(--card));border:1px solid color-mix(in srgb, var(--amber) 28%, var(--border));}
  .rc-dup b{color:var(--white);}

  /* ---- привычки сами ---- */
  .ha-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .ha-list .r{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--white);}
  .ha-list .r small{display:block;font-size:11.5px;color:var(--grey-dim);}
  .ha-list .r .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--amber);display:grid;place-items:center;
    color:var(--on-accent);background:var(--amber);flex:0 0 auto;cursor:pointer;padding:0;}

  .ha-list .r .ck svg{width:12px;height:12px;}
  .ha-val{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--grey);}
  .ha-val input{width:auto;margin-top:0;padding:8px 10px;}

  /* ---- со скриншота ---- */
  .sh-prog{height:6px;border-radius:4px;background:color-mix(in srgb, var(--grey-dim) 20%, transparent);overflow:hidden;margin-top:14px;}
  .sh-prog i{display:block;height:100%;background:var(--amber);border-radius:4px;transition:width .3s;}
  .sh-stage{font-size:13px;color:var(--grey);margin-top:10px;line-height:1.45;}
  .sh-img{display:block;max-width:100%;max-height:180px;margin:10px auto 0;border-radius:12px;border:1px solid var(--border);}
  .dp-item .ty{border:1px solid var(--border);background:var(--pane, var(--card));border-radius:9px;padding:4px 8px;
    font:600 11.5px var(--font-body);color:var(--grey);cursor:pointer;flex:0 0 auto;}
  .shot-list .dp-item .t b{white-space:normal;line-height:1.3;}
  .sh-raw{margin-top:12px;font-size:12px;color:var(--grey-dim);}
  .sh-raw pre{white-space:pre-wrap;font:12px/1.4 'JetBrains Mono',monospace;color:var(--grey);margin:6px 0 0;max-height:220px;overflow:auto;}

  /* ---- режимы дня ---- */
  .md-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 13px;border-radius:16px;border:1px solid var(--border);
    background:var(--card);color:var(--grey);font:600 12.5px var(--font-body);cursor:pointer;max-width:100%;}
  .md-chip.on{color:var(--white);border-color:var(--amber);background:color-mix(in srgb, var(--amber) 14%, var(--card));}
  .md-chip i{font-style:normal;opacity:.6;font-size:10px;}
  .md-opt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--border);
    background:var(--card);margin-top:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;}
  .md-opt.on{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 14%, var(--card));}
  .md-opt .i{font-size:22px;width:30px;text-align:center;flex:0 0 auto;}
  .md-opt .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .md-opt .t b{font-size:14px;font-weight:600;color:var(--white);}
  .md-opt .t small{font-size:11.5px;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .md-opt .ed{border:none;background:none;color:var(--amber);font:600 12px var(--font-body);cursor:pointer;padding:6px 2px 6px 8px;flex:0 0 auto;}
  .md-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px;}
  .md-week button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;border:1px solid var(--border);
    background:var(--card);cursor:pointer;font:inherit;color:var(--grey);}
  .md-week button.on{border-color:var(--amber);}
  .md-week button small{font-size:10.5px;}
  .md-week button b{font-size:16px;font-weight:400;min-height:20px;line-height:20px;}
  .md-icons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .md-icons button{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:20px;cursor:pointer;}
  .md-icons button.on{border-color:var(--amber);background:color-mix(in srgb, var(--amber) 16%, var(--card));}

  /* ---- календарь событий ---- */
  .ce-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;}
  .ce-wd span{text-align:center;font-size:10.5px;color:var(--grey-dim);letter-spacing:.06em;text-transform:uppercase;}
  .ce-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px;}
  .ce-d{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:7px 0 6px;min-height:46px;border-radius:12px;
    border:1px solid transparent;background:none;cursor:pointer;font:inherit;color:var(--white);}
  .ce-d b{font:600 14px var(--fx-num);}
  .ce-d.we b{color:var(--grey);}
  .ce-d.past b{opacity:.55;}
  .ce-d.today{border-color:color-mix(in srgb, var(--amber) 60%, transparent);}
  .ce-d.sel{background:var(--amber);border-color:var(--amber);}
  .ce-d.sel b{color:var(--on-accent);opacity:1;}
  .ce-dots{display:flex;gap:3px;height:6px;}
  .ce-dots i{width:6px;height:6px;border-radius:50%;background:var(--amber);}
  .ce-dots i.t{background:var(--cyan);} .ce-dots i.p{background:var(--pink);}
  .ce-d.sel .ce-dots i{background:var(--on-accent);}
  .ce-day h3{font-size:15px;font-weight:700;color:var(--white);margin:0 0 6px;letter-spacing:-.01em;}
  .ce-it{display:flex;align-items:center;gap:11px;width:100%;padding:10px 2px;border:none;border-bottom:1px solid var(--hair, var(--border));
    background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;}
  .ce-it:last-child{border-bottom:none;}
  .ce-it .tm{font:600 12.5px 'JetBrains Mono',monospace;color:var(--amber);min-width:44px;}
  .ce-it .tm.t{color:var(--cyan);} .ce-it .tm.p{color:var(--pink);}
  .ce-it .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ce-it .x b{font-size:13.5px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ce-it .x small{font-size:11.5px;color:var(--grey-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ce-it.done .x b{text-decoration:line-through;color:var(--grey-dim);}
  .ce-legend{display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--grey-dim);}
  .ce-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:5px;}
  .ce-legend i.t{background:var(--cyan);} .ce-legend i.p{background:var(--pink);}
  .ev-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .ev-row2 .sh-in{margin-top:4px;}

  /* ---- shell: topbar + bottom tabbar + subnav ---- */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 4px 4px;}
  .tb-left{min-width:0;}
  .today-label{margin:0;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--grey);font-weight:600;font-family:var(--font-body);}
  .tb-actions{display:flex;gap:7px;flex:0 0 auto;}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--border);
    color:var(--grey);font-size:17px;cursor:pointer;transition:.15s;line-height:1;
    display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .icon-btn:hover{color:var(--white);border-color:var(--amber);}
  .icon-btn.on{background:var(--amber);color:var(--on-accent);border-color:transparent;}
  .icon-btn:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}

  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:color-mix(in srgb, var(--bg) 93%, transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:9px 6px calc(14px + env(safe-area-inset-bottom));}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--grey);cursor:pointer;
    font-family:var(--font-body);font-size:9.5px;font-weight:600;letter-spacing:.2px;padding:2px;
    display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;border-radius:9px;}
  nav.tabbar button .ic{font-size:17px;line-height:1;opacity:.55;}
  nav.tabbar button:hover{color:var(--white);}
  nav.tabbar button.active{color:var(--amber);}
  nav.tabbar button.active .ic{opacity:1;}
  nav.tabbar button:focus-visible{outline:2px solid var(--amber2);outline-offset:-2px;}
  @media(min-width:760px){
    nav.tabbar{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--border);
      padding:6px 4px;margin-bottom:14px;}
    nav.tabbar button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:9px 15px;}
    nav.tabbar button .ic{font-size:14px;}
    nav.tabbar button.active{background:var(--amber);color:var(--on-accent);border-radius:9px;}
  }

  .subnav{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .subnav::-webkit-scrollbar{display:none;}
  .subnav button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--grey);
    padding:7px 14px;border-radius:18px;font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:var(--font-body);transition:.15s;}
  .subnav button:hover{color:var(--white);}
  .subnav button.on{background:var(--card2);color:var(--amber);border-color:var(--amber);}
  .subnav button:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}

  /* ---- today screen (mockup A) ---- */
  .today-head{margin-bottom:20px;}
  .today-head h2{font-family:var(--font-display);font-size:30px;font-weight:400;margin:6px 0 0;
    line-height:1.16;letter-spacing:.1px;text-transform:none;color:var(--white);}
  .today-head h2 em{font-style:italic;color:var(--amber);}
  .today-head .th-sub{margin:8px 0 0;font-size:12px;color:var(--grey);}

  .focus-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--card-radius);
    padding:20px;margin-bottom:14px;}
  .focus-card .lbl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber);
    font-weight:700;margin-bottom:12px;}
  .focus-card.empty .lbl{color:var(--green);}
  .focus-card .task{font-size:19px;font-weight:600;line-height:1.3;margin-bottom:6px;}
  .focus-card .meta{font-size:12.5px;color:var(--grey);}
  .focus-card .go{margin-top:16px;width:100%;background:var(--amber);color:var(--on-accent);
    border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13.5px;
    font-family:var(--font-body);cursor:pointer;transition:.15s;}
  .focus-card .go:hover{background:var(--amber2);}
  .focus-card .go:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}

  .quiet-summary{font-size:12px;color:var(--grey);line-height:1.65;padding:2px 2px 6px;margin-bottom:14px;}
  .quiet-summary b{color:var(--white);font-weight:600;}

  .fd-time{flex:0 0 auto;width:34px;font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--grey-dim);margin-top:3px;text-align:right;}

  .retro-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .retro-row .rr-name{flex:0 0 92px;font-size:12px;color:var(--grey);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .retro-row .rr-bar{flex:1;height:13px;background:var(--card);border-radius:7px;overflow:hidden;}
  .retro-row .rr-bar span{display:block;height:100%;border-radius:7px;}
  .retro-row .rr-num{flex:0 0 auto;min-width:56px;text-align:right;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--grey);}

  .day-feed{display:flex;flex-direction:column;gap:1px;background:var(--border);
    border-radius:var(--row-radius);overflow:hidden;}
  .fd-entry{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;background:var(--panel);}
  .fd-mark{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;margin-top:1px;min-width:64px;text-align:center;
    font-family:var(--font-body);}
  .fd-mark.hab{background:var(--ok-bg);color:var(--ok-fg);}
  .fd-mark.mon{background:var(--info-bg);color:var(--info-fg);}
  .fd-mark.todo{background:var(--card2);color:var(--grey);}
  .fd-mark.note{background:var(--warn-bg1);color:var(--warn-fg);}
  .fd-mark.wrk{background:var(--warn-bg2);color:var(--warn-fg);}
  .fd-body{flex:1;min-width:0;font-size:13.5px;line-height:1.5;}
  .fd-text{font-weight:500;}
  .fd-amt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;margin-left:8px;}
  .fd-amt.pos{color:var(--green);} .fd-amt.neg{color:var(--pink);}
  .fd-note{display:block;font-size:10.5px;color:var(--grey-dim);margin-top:3px;
    font-family:'JetBrains Mono',monospace;}
  .fd-quote{font-size:13px;color:var(--grey);line-height:1.6;font-style:italic;margin-top:2px;}
  .fd-entry.done .fd-text{color:var(--grey);}
  .fd-entry.frozen .fd-text{color:var(--frozen-fg);}
  .fd-tick{flex:0 0 auto;width:17px;height:17px;margin-top:3px;border-radius:50%;background:transparent;
    border:1.5px solid var(--grey);cursor:pointer;font-size:0;transition:.15s;padding:0;color:transparent;}
  .fd-tick:hover{border-color:var(--amber);background:var(--card2);}
  .fd-tick:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}


  .arch-btn{background:var(--card2);border:1px solid var(--border);color:var(--grey);border-radius:7px;
    padding:3px 8px;font-size:12px;cursor:pointer;line-height:1;font-family:inherit;}
  .arch-btn:hover{border-color:var(--amber);color:var(--white);}
  .arch-block{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;}
  .arch-block summary{cursor:pointer;font-size:11.5px;color:var(--grey);font-weight:600;
    letter-spacing:.3px;list-style:none;}
  .arch-block summary::-webkit-details-marker{display:none;}
  .arch-block summary::before{content:'▸ ';color:var(--grey-dim);}
  .arch-block[open] summary::before{content:'▾ ';}
  .arch-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);}
  .arch-row:last-child{border-bottom:none;}
  .arch-name{flex:1;font-size:12.5px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arch-meta{flex:0 0 auto;font-size:10px;color:var(--grey-dim);font-family:'JetBrains Mono',monospace;}
  .arch-row .btn.ghost{padding:4px 10px;font-size:11px;}

  .undo-toast{position:fixed;left:50%;transform:translate(-50%,20px);z-index:80;
    bottom:calc(78px + env(safe-area-inset-bottom));
    background:var(--card2);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px 10px 15px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;
    font-size:12.5px;color:var(--white);max-width:calc(100vw - 28px);}
  .undo-toast.show{opacity:1;transform:translate(-50%,0);}
  .undo-toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .undo-toast button{flex:0 0 auto;background:var(--amber);color:var(--on-accent);border:none;
    border-radius:8px;padding:6px 13px;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font-body);}
  .undo-toast button:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}
  @media(min-width:760px){.undo-toast{bottom:20px;}}

  .look-grid{display:flex;gap:9px;flex-wrap:wrap;}
  .look-card{flex:1;min-width:135px;background:var(--card);border:1.5px solid var(--border);
    border-radius:12px;padding:11px;cursor:pointer;text-align:left;font-family:inherit;
    display:flex;flex-direction:column;gap:6px;transition:.15s;}
  .look-card:hover{border-color:var(--grey);}
  .look-card.on{border-color:var(--amber);}
  .look-card:focus-visible{outline:2px solid var(--amber2);outline-offset:2px;}
  .look-card .lk-prev{display:flex;flex-direction:column;gap:3px;height:34px;justify-content:center;
    border-radius:6px;padding:6px 7px;}
  .look-card .lk-prev i{display:block;height:4px;border-radius:2px;}
  .look-card .lk-prev.focus{background:#191E1B;}
  .look-card .lk-prev.focus i:nth-child(1){width:62%;background:#F2C14E;}
  .look-card .lk-prev.focus i:nth-child(2){width:88%;background:#2A322D;}
  .look-card .lk-prev.focus i:nth-child(3){width:44%;background:#2A322D;}
  .look-card .lk-prev.console{background:#0B0C0E;flex-direction:row;align-items:flex-end;gap:2px;}
  .look-card .lk-prev.console i{height:100%;width:5px;border-radius:1px;background:#232830;}
  .look-card .lk-prev.console i:nth-child(1){background:#4FD1C5;height:70%;}
  .look-card .lk-prev.console i:nth-child(2){height:45%;}
  .look-card .lk-prev.console i:nth-child(3){background:#4FD1C5;height:90%;}
  /* превью «Стекла»: цветной фон и две полупрозрачные панели поверх него */
  .look-card .lk-prev.glass{background:linear-gradient(150deg,#DCEEDD,#E7F2E2 55%,#F1F4E2);
    justify-content:center;gap:4px;}
  .look-card .lk-prev.glass i{background:rgba(255,255,255,.72);
    box-shadow:0 1px 2px rgba(60,95,70,.13);height:6px;}
  .look-card .lk-prev.glass i:nth-child(1){width:70%;}
  .look-card .lk-prev.glass i:nth-child(2){width:92%;}
  .look-card .lk-prev.glass i:nth-child(3){width:52%;background:#4E8C6A;height:5px;}
  .look-card .lk-name{font-size:13px;font-weight:700;color:var(--white);}
  .look-card.on .lk-name{color:var(--amber2);}
  .look-card .lk-hint{font-size:10.5px;color:var(--grey-dim);line-height:1.35;}

  .search-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;
    color:var(--white);padding:10px 13px;font-size:13.5px;}
  .search-input:focus{outline:none;border-color:var(--amber);}
  .search-result-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;
    padding:10px;margin-bottom:6px;cursor:pointer;transition:.12s;border:1px solid transparent;}
  .search-result-row:hover{border-color:var(--amber);}
  .sr-icon{font-size:16px;flex:0 0 auto;}
  .sr-body{flex:1;min-width:0;}
  .sr-title{font-size:13px;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sr-meta{font-size:10.5px;color:var(--grey-dim);margin-top:2px;}
  .sr-arrow{color:var(--grey-dim);font-size:13px;flex:0 0 auto;}

  .add-row{display:flex;gap:8px;margin-top:10px;}
  .add-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--white);padding:9px 12px;font-size:13px;}
  .add-row button, .btn{background:linear-gradient(100deg,var(--amber),var(--amber2));color:var(--on-accent);border:none;
    border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s;}
  .add-row button:hover, .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(232,112,58,.6);}
  .btn.pink{background:var(--pink);color:var(--on-pink);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--grey);box-shadow:none;}
  .del{background:none;border:none;color:var(--grey-dim);cursor:pointer;font-size:15px;padding:2px 6px;}
  .del:hover{color:var(--pink);}

  /* plan categories */
  .plan-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:720px){.plan-grid{grid-template-columns:1fr 1fr;}}
  .plan-cat{border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);}
  .plan-cat .hd{padding:9px 13px;font-weight:800;font-size:12px;color:var(--on-accent);letter-spacing:.3px;
    display:flex;align-items:center;gap:6px;}
  .plan-cat .hd input.cat-name-input{flex:1;background:transparent;border:none;color:var(--on-accent);font-weight:800;
    font-size:12px;letter-spacing:.3px;text-transform:uppercase;font-family:var(--font-body);padding:2px 0;min-width:0;}
  .plan-cat .hd input.cat-name-input:focus{outline:none;}
  .plan-cat .hd .cat-del{color:var(--on-accent);opacity:.65;font-size:13px;}
  .plan-cat .hd .cat-del:hover{opacity:1;color:var(--on-accent);}
  .plan-cat .body{background:var(--card);padding:9px;display:flex;flex-direction:column;gap:6px;}
  .plan-item{display:flex;align-items:center;gap:8px;}
  .plan-item .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--grey-dim);flex:0 0 auto;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;transition:.12s;}
  .plan-item .chk.done{background:var(--green);border-color:var(--green);color:var(--on-green);}
  .plan-item .chk.frozen{background:var(--card);border-color:var(--frozen-border);color:var(--frozen-fg);font-size:10px;}
  .plan-item input{flex:1;background:transparent;border:none;color:var(--white);font-size:13px;}
  .plan-item input:focus{outline:none;}
  .plan-item.done input{color:var(--grey-dim);text-decoration:line-through;}

  /* finance */
  .fin-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .fin-summary .box{flex:1;min-width:110px;background:var(--card);border-radius:12px;padding:11px;}
  .fin-summary .box .l{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;}

<script>
/*
 * Мост к нативной части. Страница написана под хост, который даёт ей window.storage
 * (в браузерной сборке его предоставляет контейнер), поэтому здесь тот же интерфейс,
 * только поверх файлов в приватной папке приложения.
 */
window.TRACKER_BUILD = "2026-10-03 00:18+186020b5";

(function(){
  if (typeof AndroidHost === "undefined") return;   // открыли в обычном браузере

  window.storage = {
    async get(key){
      const s = AndroidHost.get(String(key));
      return s ? JSON.parse(s) : null;
    },
    async set(key, value){
      // Молча потерянная запись — худшее, что может случиться с трекером,
      // поэтому неудача превращается в исключение, а не в тихий false.
      if (!AndroidHost.set(String(key), String(value))) throw new Error("не удалось записать " + key);
      return { key: String(key), value: String(value), shared: false };
    },
    async delete(key){
      AndroidHost.remove(String(key));
      return { key: String(key), deleted: true };
    },
    async list(){
      return { keys: JSON.parse(AndroidHost.keys()) };
    }
  };

  // В WebView клик по «<a download>» с blob:-ссылкой не доходит до DownloadListener
  // и просто ничего не делает. Подменяем сохранение на системный диалог выбора папки.
  window.addEventListener("DOMContentLoaded", function(){
    // Сообщаем оболочке, что страница поднялась. Если этого не случится, при
    // следующем запуске она откатится на встроенную версию — иначе неудачное
    // обновление означало бы кирпич без единого способа его починить.
    try { AndroidHost.launchOk(); } catch (e) {}

    if (typeof backupJson !== "function" || typeof backupFilename !== "function") return;
    window.downloadBackupFile = function(){
      AndroidHost.saveBackup(backupFilename(), backupJson());
    };
  });
})();
</script>

<script>
const MONTHS_RU=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_SHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];

// ---------- CHART HELPERS (canvas, no deps) ----------
function rr(ctx,x,y,w,h,r){
  if(h<=0.4) return;
  r=Math.max(0,Math.min(r,w/2,Math.abs(h)/2));
  const up = h<0; const hh=Math.abs(h); const yy = up? y+h : y;
  ctx.beginPath();
  ctx.moveTo(x+r,yy);
  ctx.arcTo(x+w,yy,x+w,yy+hh,r);
  ctx.arcTo(x+w,yy+hh,x,yy+hh,r);
  ctx.arcTo(x,yy+hh,x,yy,r);
  ctx.arcTo(x,yy,x+w,yy,r);
  ctx.closePath();
  ctx.fill();
}
function setupCanvas(canvas){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth||canvas.parentElement.clientWidth, H = canvas.clientHeight||160;
  canvas.width = Math.max(1,W*dpr); canvas.height = Math.max(1,H*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  return {ctx,W,H};
}
function drawGroupedBars(canvasId, labels, series){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  const padL=6, padR=6, padT=10, padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=labels.length;
  const groupW=chartW/n;
  const gap=2, barW=(groupW-gap*(series.length+1))/series.length;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  ctx.font="9px 'JetBrains Mono',monospace"; ctx.textAlign="center";
  for(let i=0;i<n;i++){
    const x0=padL+i*groupW;
    series.forEach((s,si)=>{
      const v=s.data[i]||0;
      const h=(v/max)*chartH;
      ctx.fillStyle=s.color;
      rr(ctx, x0+gap+si*(barW+gap), padT+chartH-h, barW, h, 3);
    });

function drawLineArea(canvasId, labels, values, color, color2, goal){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  const padL=8, padR=8, padT=12, padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=values.length;
  const max=Math.max(1, goal||0, ...values);
  const stepX = n>1? chartW/(n-1) : chartW;
  const pts = values.map((v,i)=>[padL+i*stepX, padT+chartH-(v/max)*chartH]);

  if(goal){
    const gy = padT+chartH-(goal/max)*chartH;
    ctx.setLineDash([4,4]); ctx.strokeStyle=cssVar("--grey-dim"); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(W-padR,gy); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(pts.length>1){
    const grad=ctx.createLinearGradient(0,padT,0,padT+chartH);
    grad.addColorStop(0, color2+"55"); grad.addColorStop(1, color2+"05");
    ctx.beginPath(); ctx.moveTo(pts[0][0],padT+chartH);
    pts.forEach(p=>ctx.lineTo(p[0],p[1]));
    ctx.lineTo(pts[pts.length-1][0],padT+chartH); ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();

    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.stroke();
  }
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2.6,0,7); ctx.fillStyle=color; ctx.fill(); });
  ctx.font="9px 'JetBrains Mono',monospace"; ctx.fillStyle=cssVar("--grey"); ctx.textAlign="center";
  const step=Math.ceil(n/8);
  labels.forEach((l,i)=>{ if(i%step===0 || i===n-1) ctx.fillText(l, padL+i*stepX, H-4); });
}

// and days the user has frozen (vacation/sick) don't count toward the requirement either.
function habitGoal(idx, year, monthIdx){
  const raw=(DATA.habits.goals && DATA.habits.goals[idx]) || 21;
  const nd=daysInMonth(year, monthIdx);
  const key=`${year}-${monthIdx}`;
  const frozen=(DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx]) || [];
  // в зачёт идут только дни по расписанию и без заморозки
  let availableDays=0;
  for(let d=1; d<=nd; d++){
    if(habitScheduledOn(idx, new Date(year, monthIdx, d)) && !frozen.includes(d)) availableDays++;
  }
  return Math.min(raw, Math.max(1, availableDays));

function getWeekStart(date){
  const d=new Date(date); d.setHours(0,0,0,0);

// Projects when a savings goal will be reached based on the average monthly
// contribution rate seen so far (total saved / number of calendar months
// since the first contribution).
function projectSavingsCompletion(entries, remaining){
  if(remaining<=0) return null;
  const withAmount=(entries||[]).filter(e=>e.date && (+e.amount||0)!==0);
  if(!withAmount.length) return null;
  const sortedDates=withAmount.map(e=>e.date).sort();
  const first=parseLocalDate(sortedDates[0]);
  if(!first) return null;
  const now=new Date();
  const monthsSpan=Math.max(1,(now.getFullYear()-first.getFullYear())*12+(now.getMonth()-first.getMonth())+1);
  const totalSaved=withAmount.reduce((s,e)=>s+(+e.amount||0),0);
  const avgMonthly=totalSaved/monthsSpan;
  if(avgMonthly<=0) return null;
  const monthsNeeded=Math.ceil(remaining/avgMonthly);
  return {avgMonthly, target:addMonthsToDate(now, monthsNeeded)};
}

// ═════════ ПРИВЫЧКИ: РАЗДЕЛ ═════════
// Раньше у каждой привычки была своя карточка с лентой дней, которая листалась
// вбок, а год был стеной из 365 квадратиков на каждую. Теперь: неделя — одна
// сетка, месяц — строка с полоской дней на всю ширину и календарём по нажатию,
// год — месяцы цветом.
function hbView(){ return cur.habitView==="week" || cur.habitView==="year" ? cur.habitView : "month"; }
// Выполнение плана: сколько отмечено из дней по расписанию, без пропусков.
// Сегодня входит в план, только когда уже отмечено, — утром процент не проседает.
// Учёт начинается с первой отметки: месяцы до неё — не «0%», а «ещё не вёл»
function hbStartKey(){
  let min="";
  const H=DATA.habits;
  [H.checks, H.counts, H.frozen].forEach(src=>{
    Object.keys(src||{}).forEach(key=>{
      const [y,m]=key.split("-").map(Number);
      if(isNaN(y) || isNaN(m)) return;
      const per=src[key]||{};
      Object.keys(per).forEach(i=>{
        const v=per[i];
        (Array.isArray(v)? v : Object.keys(v||{}).filter(d=>+v[d]>0).map(Number)).forEach(d=>{
          if(!d) return;
          const k=`${y}-${pad2(m+1)}-${pad2(d)}`;
          if(!min || k<min) min=k;
        });
      });
    });
  });
  return min || todayStr();
}
function habitPlanStat(idx, from, to){
  const ts=todayStr(), start=cur._hbStart||"";
  let done=0, need=0;
  const d=new Date(from); d.setHours(0,0,0,0);
  const end=new Date(to); end.setHours(0,0,0,0);
  while(d<=end){
    const k=ymdOf(d);
    if(k>ts) break;
    const isDone=isHabitDoneOn(idx,d);
    if(isDone){ done++; need++; }
    else if(isHabitFailedOn(idx,d)) need++;
    else if(k<ts && k>=start && habitScheduledOn(idx,d) && !isHabitFrozenOn(idx,d)) need++;
    d.setDate(d.getDate()+1);
  }
  return {done, need, pct: need? Math.min(1, done/need) : null};
}
function hbAvg(stats){
  const ok=stats.filter(s=>s && s.pct!=null);
  return ok.length? ok.reduce((a,s)=>a+s.pct,0)/ok.length : null;
}
function hbPct(p){ return p==null? "—" : Math.round(p*100)+"%"; }
function hbAtRisk(idx){
  const now=new Date();
  return habitStreak(idx)>0 && habitScheduledOn(idx,now) && !isHabitDoneOn(idx,now) && !isHabitFrozenOn(idx,now);
}
// Клетка дня. Будущее не отмечается — только показывается.
function hbCell(idx, dt, withNum){
  const ts=todayStr(), k=ymdOf(dt);
  const done=isHabitDoneOn(idx,dt), frozen=!done && isHabitFrozenOn(idx,dt), sched=habitScheduledOn(idx,dt);
  const cnt = habitType(idx)==='counter' ? habitDailyCount(idx,dt) : 0;
  const cls=["hc"];
  if(done) cls.push("done");
  else if(frozen) cls.push("frozen");
  else if(isHabitFailedOn(idx,dt)) cls.push("fail");
  else if(cnt>0) cls.push("part");
  else if(!sched) cls.push("off");
  else if(k<ts) cls.push("miss");
  if(k>ts) cls.push("future");
  if(k===ts) cls.push("today");
  const label = done? "✓" : frozen? "❄" : isHabitFailedOn(idx,dt)? "✕" : cnt>0? `${cnt}/${habitCounterTarget(idx)}` : (withNum? dt.getDate() : "");
  const name=escapeHtml(DATA.habits.list[idx]||"");
  if(k>ts) return `<span class="${cls.join(" ")}">${withNum? dt.getDate() : ""}</span>`;
  return `<button class="${cls.join(" ")}" data-hc="${idx}:${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}" aria-label="${name}, ${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}">${label}</button>`;
}
function hbStripCell(idx, dt){
  const ts=todayStr(), k=ymdOf(dt);
  const done=isHabitDoneOn(idx,dt), frozen=!done && isHabitFrozenOn(idx,dt);
  const cnt = habitType(idx)==='counter' ? habitDailyCount(idx,dt) : 0;
  const cls=[];
  if(done) cls.push("done");
  else if(frozen) cls.push("frozen");
  else if(isHabitFailedOn(idx,dt)) cls.push("fail");
  else if(cnt>0) cls.push("part");
  else if(!habitScheduledOn(idx,dt)) cls.push("off");
  else if(k<ts) cls.push("miss");
  if(k>ts) cls.push("future");
  if(k===ts) cls.push("today");
  return `<i class="${cls.join(" ")}"></i>`;
}

    : `${a.getDate()} ${MONTHS_GEN[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MONTHS_GEN[b.getMonth()].slice(0,3)}`;

function renderHabitsHero(){
  const v=hbView(), ids=activeHabitIdx(), now=new Date(), ts=todayStr();

  if(v==="week"){
    const dates=getWeekDates(cur.weekAnchor);
    from=dates[0]; to=dates[6]; navLabel=hbWeekLabel(dates); sub="по плану за неделю";
  } else if(v==="year"){
    from=new Date(cur.year,0,1); to=new Date(cur.year,11,31); navLabel=`${cur.year} год`; sub="по плану за год";
  } else {

function renderHabitsYear2(){
  const y=cur.year, ids=activeHabitIdx(), ts=todayStr(), now=new Date();
  const nowM = now.getFullYear()===y ? now.getMonth() : -1;
  const grid=ids.map(idx=>Array.from({length:12}, (_,m)=>{
    const from=new Date(y,m,1), to=new Date(y,m,daysInMonth(y,m));
    if(ymdOf(from)>ts) return null;
    if(ymdOf(to)<cur._hbStart) return {none:true, done:0, need:0, pct:null};
    return habitPlanStat(idx, from, to);
  }));
  const monthAvg=Array.from({length:12}, (_,m)=>hbAvg(grid.map(r=>r[m])));
  const monthNone=Array.from({length:12}, (_,m)=>grid.length>0 && grid.every(r=>r[m] && r[m].none));
  let marks=0, bestIdx=-1, bestPct=-1;
  ids.forEach((idx,r)=>{
    let dn=0, nd=0;
    grid[r].forEach(s=>{ if(s){ dn+=s.done; nd+=s.need; } });
    marks+=dn;
    const p=nd? dn/nd : -1;
    if(p>bestPct){ bestPct=p; bestIdx=idx; }
  });
  let bestM=-1;
  monthAvg.forEach((v,m)=>{ if(v!=null && (bestM<0 || v>monthAvg[bestM])) bestM=m; });
  const lvl=p=> p==null? "" : p<=0? "" : p<0.2? "l1" : p<0.4? "l2" : p<0.6? "l3" : p<0.8? "l4" : "l5";
  const tiles=`<div class="fx-tiles" style="margin-top:0;">
      <div><span class="k">Отмечено</span><span class="v">${marks}</span><span class="s">${plural(marks,'раз','раза','раз')} за ${y}</span></div>
      <div><span class="k">Лучшая</span><span class="v">${bestPct>0? hbPct(bestPct) : "—"}</span><span class="s">${bestIdx>=0 && bestPct>0? escapeHtml(DATA.habits.list[bestIdx]) : "пока нет данных"}</span></div>
      <div><span class="k">Лучший месяц</span><span class="v">${bestM>=0? hbPct(monthAvg[bestM]) : "—"}</span><span class="s">${bestM>=0? MONTHS_RU[bestM].toLowerCase() : ""}</span></div>
    </div>`;
  const bars=monthAvg.map((v,m)=>{
    const future=v==null || monthNone[m];
    const h=future? 0 : Math.max(2, Math.round(v*80));
    return `<button class="hy-bar ${future?'future':''} ${!future && !v?'empty':''}" ${future? "" : `data-hym="${m}:"`} aria-label="${MONTHS_RU[m]}: ${hbPct(v)}">
      ${future? "" : `<em>${Math.round(v*100)}</em>`}<i style="height:${h}px"></i></button>`;
  }).join("");
  const labs=MONTHS_SHORT.map((l,m)=>`<span class="${m===nowM?'now':''}">${l.slice(0,1)}</span>`).join("");
  const rows=ids.map((idx,r)=>{
    let dn=0, nd=0;
    grid[r].forEach(s=>{ if(s){ dn+=s.done; nd+=s.need; } });
    const best=bestStreakEver(idx);
    return `<div class="hy-row">
      <div class="top"><span class="n">${escapeHtml(DATA.habits.list[idx])}</span><span class="p">${nd? hbPct(dn/nd) : "—"}${best>1? ` · 🏆 ${best}` : ""}</span></div>
      <div class="hy-cells">${grid[r].map((s,m)=>s==null || s.none
        ? `<button class="${s==null? "future" : "none"}" disabled aria-hidden="true"></button>`
        : `<button class="${lvl(s.pct)} ${m===nowM?'now':''}" data-hym="${m}:${idx}" aria-label="${escapeHtml(DATA.habits.list[idx])}, ${MONTHS_RU[m]}: ${hbPct(s.pct)}"></button>`).join("")}</div>
    </div>`;
  }).join("");
  return `<div class="card">${tiles}
      <div class="hl-lab" style="margin-top:16px;">Все привычки по месяцам</div>
      <div class="hy-bars">${bars}</div>
      <div class="hy-lab">${labs}</div>
    </div>
    <div class="card">
      <h2>Каждая привычка</h2>
      ${rows? `<div class="hy-cells hy-head">${MONTHS_SHORT.map((l,m)=>`<span class="${m===nowM?'now':''}">${l.slice(0,1)}</span>`).join("")}</div>` : ""}
      ${rows || '<div class="empty">Пока нет привычек</div>'}

    </div>`;
}

// ---------- YEAR HEATMAP ----------
function bestStreakEver(idx){
  const type=habitType(idx);
  const target=habitCounterTarget(idx);
  const doneDates=new Set();
  const frozenDates=new Set();
  const allKeys=new Set([
    ...Object.keys(DATA.habits.checks||{}),
    ...Object.keys(DATA.habits.counts||{}),
    ...Object.keys(DATA.habits.frozen||{})
  ]);
  allKeys.forEach(key=>{
    const parts=key.split('-'); const y=+parts[0], m=+parts[1];
    if(isNaN(y)||isNaN(m)) return;
    if(type==='counter'){
      const counts=(DATA.habits.counts && DATA.habits.counts[key] && DATA.habits.counts[key][idx]) || {};
      Object.keys(counts).forEach(dStr=>{ if((+counts[dStr]||0)>=target) doneDates.add(new Date(y,m,+dStr).getTime()); });
    } else {
      const arr=(DATA.habits.checks[key]&&DATA.habits.checks[key][idx])||[];
      arr.forEach(d=>doneDates.add(new Date(y,m,d).getTime()));
    }
    const farr=(DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx]) || [];
    farr.forEach(d=>frozenDates.add(new Date(y,m,d).getTime()));
  });
  if(!doneDates.size) return 0;
  const dates=[...doneDates].sort((a,b)=>a-b);
  let best=1, run=1;
  for(let i=1;i<dates.length;i++){
    const gapDays=Math.round((dates[i]-dates[i-1])/86400000);
    if(gapDays===0) continue;
    if(gapDays===1){ run++; }
    else {
      let allFrozen=true;
      for(let g=1; g<gapDays; g++){
        const gd=dates[i-1]+g*86400000;
        if(!frozenDates.has(gd) && habitScheduledOn(idx, new Date(gd))){ allFrozen=false; break; }
      }
      run = allFrozen ? run+1 : 1;
    }
    if(run>best) best=run;
  }
  return best;
}

// ---------- HABITS ----------
function isHabitArchived(idx){ return !!(DATA.habits.archived && DATA.habits.archived[idx]); }
function activeHabitIdx(){ return DATA.habits.list.map((_,i)=>i).filter(i=>!isHabitArchived(i)); }
function habitType(idx){ return (DATA.habits.types && DATA.habits.types[idx]) || 'check'; }
function habitCounterTarget(idx){ return (DATA.habits.counterTargets && DATA.habits.counterTargets[idx]) || 1; }
function habitDailyCount(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  return (DATA.habits.counts && DATA.habits.counts[key] && DATA.habits.counts[key][idx] && DATA.habits.counts[key][idx][date.getDate()]) || 0;
}
function isHabitFrozenOn(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  const arr=(DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx]) || [];
  return arr.includes(date.getDate());
}
function isHabitDoneOn(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  if(habitType(idx)==='counter') return habitDailyCount(idx,date) >= habitCounterTarget(idx);
  const arr=(DATA.habits.checks[key]&&DATA.habits.checks[key][idx])||[];
  return arr.includes(date.getDate());
}
function habitPct(idx){
  const goal=habitGoal(idx, cur.year, cur.monthIdx);
  const nd=daysInMonth(cur.year,cur.monthIdx);
  let done=0;
  for(let d=1; d<=nd; d++){ if(isHabitDoneOn(idx,new Date(cur.year,cur.monthIdx,d))) done++; }
  return Math.min(1, done/goal);
}
// Frozen days (vacation/sick pause) don't break a streak — they're skipped over —
// but they don't add to the count either.
function habitStreak(idx){
  let d=new Date(); d.setHours(0,0,0,0);
  if(isHabitFailedOn(idx,d)) return 0;          // сорвался сегодня — серия кончилась
  if(!isHabitDoneOn(idx,d) && !isHabitFrozenOn(idx,d)) d.setDate(d.getDate()-1);
  let streak=0, guard=0;
  while(guard<3660){
    guard++;
    if(isHabitDoneOn(idx,d)){ streak++; d.setDate(d.getDate()-1); continue; }
    if(isHabitFailedOn(idx,d)) break;
    // заморозка и дни не по расписанию серию не рвут, но и не удлиняют
    if(isHabitFrozenOn(idx,d) || !habitScheduledOn(idx,d)){ d.setDate(d.getDate()-1); continue; }
    break;
  }
  return streak;
}

  const sub=[habitDaysLabel(idx)];

// Cycles a single day's state for a habit on tap:
// - check-type: empty -> done -> frozen -> empty
// - counter-type: 0 -> 1 -> 2 -> ... -> target -> frozen -> 0
function markHabitTime(idx, key, day){
  DATA.habits.times=DATA.habits.times||{};
  DATA.habits.times[key]=DATA.habits.times[key]||{};
  DATA.habits.times[key][idx]=DATA.habits.times[key][idx]||{};
  const d=new Date();
  // only stamp today's cell — back-filling an older day shouldn't claim "now"
  if(day===d.getDate() && key===`${d.getFullYear()}-${d.getMonth()}`) DATA.habits.times[key][idx][day]=nowTime();
}
function habitTimeOn(idx,date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  return (DATA.habits.times && DATA.habits.times[key] && DATA.habits.times[key][idx] && DATA.habits.times[key][idx][date.getDate()])||"";
}
// «Не смог»: честный срыв — в отличие от пропуска ❄ серия обнуляется и день
// считается невыполненным, но привычка больше не висит в «осталось» и вечером
// о ней не напоминают. Причину можно записать: потом видно, что мешает чаще всего.
const FAIL_REASONS=["проснулся поздно","не было времени","плохо себя чувствовал","забыл","лень"];
function habitFailArr(idx, key){
  const H=DATA.habits;
  H.failed=H.failed||{}; H.failed[key]=H.failed[key]||{}; H.failed[key][idx]=H.failed[key][idx]||[];
  return H.failed[key][idx];
}
function isHabitFailedOn(idx, date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  const arr=(DATA.habits.failed && DATA.habits.failed[key] && DATA.habits.failed[key][idx]) || [];
  return arr.includes(date.getDate());
}
function habitFailWhy(idx, date){
  const key=`${date.getFullYear()}-${date.getMonth()}`;
  const w=DATA.habits.failWhy && DATA.habits.failWhy[key] && DATA.habits.failWhy[key][idx];
  return (w && w[date.getDate()]) || "";
}
function setHabitFailWhy(idx, date, why){
  const H=DATA.habits, key=`${date.getFullYear()}-${date.getMonth()}`, day=date.getDate();
  H.failWhy=H.failWhy||{}; H.failWhy[key]=H.failWhy[key]||{}; H.failWhy[key][idx]=H.failWhy[key][idx]||{};
  if(why) H.failWhy[key][idx][day]=why; else delete H.failWhy[key][idx][day];
}
function clearHabitFail(idx, key, day){
  const arr=DATA.habits.failed && DATA.habits.failed[key] && DATA.habits.failed[key][idx];
  if(arr){ const i=arr.indexOf(day); if(i>=0) arr.splice(i,1); }
  const w=DATA.habits.failWhy && DATA.habits.failWhy[key] && DATA.habits.failWhy[key][idx];
  if(w) delete w[day];
}
// Сколько срывов за последние N дней и какая причина чаще всего
function habitFailStats(idx, days){
  let n=0;
  const why={};
  const d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<(days||90);i++){
    if(isHabitFailedOn(idx,d)){ n++; const w=habitFailWhy(idx,d); if(w) why[w]=(why[w]||0)+1; }
    d.setDate(d.getDate()-1);
  }
  const top=Object.keys(why).sort((a,b)=>why[b]-why[a])[0];
  return {n, top, topN: top? why[top] : 0};
}
function cycleHabitDay(idx, key, day){
  const wasDone=(()=>{ const [y,m]=key.split('-').map(Number); return isHabitDoneOn(idx,new Date(y,m,day)); })();
  DATA.habits.frozen=DATA.habits.frozen||{}; DATA.habits.frozen[key]=DATA.habits.frozen[key]||{}; DATA.habits.frozen[key][idx]=DATA.habits.frozen[key][idx]||[];
  const frozenArr=DATA.habits.frozen[key][idx];
  if(habitType(idx)==='counter'){
    const target=habitCounterTarget(idx);
    DATA.habits.counts=DATA.habits.counts||{}; DATA.habits.counts[key]=DATA.habits.counts[key]||{}; DATA.habits.counts[key][idx]=DATA.habits.counts[key][idx]||{};
    const counts=DATA.habits.counts[key][idx];
    const curC=counts[day]||0;
    const fi=frozenArr.indexOf(day);
    const failArr=habitFailArr(idx,key), xi=failArr.indexOf(day);
    // …→ цель → пропуск ❄ → не смог ✕ → 0
    if(fi>=0){ frozenArr.splice(fi,1); delete counts[day]; failArr.push(day); }
    else if(xi>=0){ clearHabitFail(idx,key,day); }
    else if(curC>=target){ frozenArr.push(day); delete counts[day]; }
    else { counts[day]=curC+1; }
  } else {
    DATA.habits.checks[key]=DATA.habits.checks[key]||{}; DATA.habits.checks[key][idx]=DATA.habits.checks[key][idx]||[];
    const doneArr=DATA.habits.checks[key][idx];
    const di=doneArr.indexOf(day), fi=frozenArr.indexOf(day);
    const failArr=habitFailArr(idx,key), xi=failArr.indexOf(day);
    // пусто → сделано → пропуск ❄ → не смог ✕ → пусто
    if(di>=0){ doneArr.splice(di,1); frozenArr.push(day); }
    else if(fi>=0){ frozenArr.splice(fi,1); failArr.push(day); }
    else if(xi>=0){ clearHabitFail(idx,key,day); }
    else { doneArr.push(day); }
  }
  const [y,m]=key.split('-').map(Number);
  const nowDone=isHabitDoneOn(idx,new Date(y,m,day));
  if(nowDone && !wasDone) markHabitTime(idx,key,day);
  else if(!nowDone && DATA.habits.times && DATA.habits.times[key] && DATA.habits.times[key][idx])
    delete DATA.habits.times[key][idx][day];
}
// Короткая подпись имени привычки. Кнопка в чате живёт долго, а список привычек
// за это время может поменяться: удаление делает list.splice(idx,1), и все
// следующие индексы съезжают. Поэтому воркер кладёт подпись в callback_data, а
// мы сверяем её перед тем, как ставить отметку. Та же функция есть в worker.js —
// менять можно только в обоих местах сразу.
function habitSig(name){
  let h=0x811c9dc5;
  const s=String(name==null?"":name);
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h.toString(16).padStart(8,"0").slice(0,4);
}
