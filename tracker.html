  const now=new Date();
  const prevSame=spentByDayOfMonth(now.getFullYear(), now.getMonth()-1, now.getDate());
  const d=prevSame? fmtDelta(spent, prevSame) : null;
  const dTxt = !d ? "не с чем сравнить"
    : d.cls==="up" ? `сейчас на ${d.txt.replace("+","")} больше`
    : d.cls==="down" ? `сейчас на ${d.txt.replace("−","")} меньше`
    : "сейчас столько же";

  return `<div class="card">
    <h2>Бюджет этого месяца <span style="font-size:11px;color:var(--grey-dim);font-weight:400;">(всё в ₽ по курсу)</span></h2>
    <div class="savings-goal" style="margin-bottom:10px;">
      <div><label>Лимит расходов на месяц, ₽ (0 — не ограничивать)</label><input id="budgetInp" type="number" value="${budget||""}"></div>
    </div>
    ${budget? `<div class="kpi" style="border-top-color:${over?"var(--pink)":"var(--green)"};">
      <div class="t">Потрачено в этом месяце</div>
      <div class="v" style="color:${over?"var(--pink)":"var(--white)"}">${fmtRub(spent)}</div>
      <div class="s">${over? `Бюджет превышен на ${fmtRub(spent-budget)}` : `${pct}% от лимита ${fmtRub(budget)}`}</div>
      <div class="progress-bar"><div class="fill" style="width:${Math.min(100,pct)}%;background:${over?"var(--pink)":"var(--green)"}"></div></div>
      <div class="s" style="margin-top:6px;">${willOver
        ? `⚠️ По прогнозу к концу месяца выйдет ~${fmtRub(f.forecastExpense)} — это больше лимита`
        : `По прогнозу к концу месяца ~${fmtRub(f.forecastExpense)} — в пределах лимита`}</div>
    </div>` : `<div class="empty">Задай лимит, чтобы отслеживать бюджет</div>`}
    <div class="fc-daily" style="margin-top:12px;">
      <div class="b"><div class="k">На это число месяцем раньше</div>
        <div class="n">${prevSame? fmtRub(prevSame) : "—"}</div>
        <div class="s">${dTxt}</div></div>
      <div class="b"><div class="k">Можно в день</div>
        <div class="n" style="color:${f.safePerDay==null?"var(--grey)":"var(--white)"}">${f.safePerDay==null? "—" : fmtRub(f.safePerDay)}</div>
        <div class="s">${f.daysLeft} ${plural(f.daysLeft,"день","дня","дней")} до конца месяца</div></div>
      <div class="b"><div class="k">Из них подписки</div>
        <div class="n">${fmtRub(f.cur.expRec)}</div>
        <div class="s">${f.up.expense? `впереди ещё ${fmtRub(f.up.expense)}` : "все уже списаны"}</div></div>
    </div>
  </div>`;
}

/* ---------- КАЛЕНДАРЬ ДНЯ ---------- */
// Месяц клетками: сразу видно ритм трат, дорогие дни и дни, когда не потратил
// ничего. Тап по дню показывает, из чего он сложился, и там же добавляет запись.
//
// Цвет по умолчанию — не «прибыль», а трата против дневной нормы. В трейдинге
// зелёный день значит «заработал», но в личном бюджете доход приходит пару раз
// в месяц: календарь прибыли был бы сплошь красным с двумя зелёными клетками и
// ничего не сообщал. Норма же отвечает на вопрос, который задают каждый день:
// я сегодня вписался или нет. Режим «прибыль» остался вторым переключателем.
const CAL_METRICS=[["spend","Траты"],["net","Прибыль"]];

function calMonth(){
  if(cur.calY==null || cur.calM==null){
    const n=new Date();
    cur.calY=n.getFullYear();
    cur.calM=n.getMonth();
  }
  return {y:cur.calY, m:cur.calM};
}
function calShift(delta){
  const {y,m}=calMonth();
  const d=new Date(y, m+delta, 1);
  cur.calY=d.getFullYear();
  cur.calM=d.getMonth();
  cur.calSel=null;
}
// В клетке нет места на «12 340 ₽», поэтому крупные суммы сокращаются
function shortMoney(n){
  const v=Math.round(+n||0), a=Math.abs(v);
  if(a>=1000000) return (v/1000000).toFixed(1).replace(".",",")+"млн";
  if(a>=1000) return (v/1000).toFixed(1).replace(".",",")+"к";
  return String(v);
}
// Календарь считает по рублёвым счетам — как бюджет, прогноз и категории
function financeByDay(y, m){
  const ids=rubAccountIds();
  const prefix=`${y}-${pad2(m+1)}`;
  const out={};
  entriesInRub().forEach(e=>{
    if(!e.date || e.date.slice(0,7)!==prefix) return;
    const d=parseInt(e.date.slice(8,10),10);
    if(!d) return;
    const cell=out[d]||(out[d]={inc:0, exp:0, n:0});
    if(e.type==="доход") cell.inc+=(+e.amount||0); else cell.exp+=(+e.amount||0);
    cell.n++;
  });
  Object.keys(out).forEach(d=>{ out[d].net=out[d].inc-out[d].exp; });
  return out;
}
function financeByMonth(y){
  const ids=rubAccountIds();
  const out={};
  for(let m=0;m<12;m++) out[m]={inc:0, exp:0, net:0, n:0};
  entriesInRub().forEach(e=>{
    if(!e.date || e.date.slice(0,4)!==String(y)) return;
    const m=parseInt(e.date.slice(5,7),10)-1;
    if(!(m>=0 && m<12)) return;
    if(e.type==="доход") out[m].inc+=(+e.amount||0); else out[m].exp+=(+e.amount||0);
    out[m].n++;
  });
  for(let m=0;m<12;m++) out[m].net=out[m].inc-out[m].exp;
  return out;
}
// Дневная норма: лимит месяца, размазанный по дням. Без лимита — средняя трата
// по дням, в которые вообще что-то тратилось: сравнивать с нулём бессмысленно.
function dailyNorm(y, m, byDay){
  const budget=+DATA.finance.budgetLimit||0;
  if(budget>0) return budget/daysInMonth(y,m);
  const days=Object.keys(byDay).filter(d=>byDay[d].exp>0);
  if(!days.length) return 0;
  return days.reduce((s,d)=>s+byDay[d].exp,0)/days.length;
}
function calMetric(){ return cur.calMetric==="net" ? "net" : "spend"; }

// Клетка красится в три ступени. Для трат шкала привязана к дневной норме, а не
// к самому дорогому дню месяца: один выброс вроде «купил телефон» иначе делает
// все остальные клетки одинаково бледными, и календарь перестаёт что-либо
// показывать. Для прибыли выбросы как раз и есть смысл, там шкала от пика.
function calCellClass(value, metric, norm, peak){
  if(value===0) return "";
  const cls=[];
  if(metric==="net"){
    cls.push(value>0 ? "up" : "down");
    const share=peak>0 ? Math.abs(value)/peak : 0;
    cls.push(share>0.66 ? "hi" : share>0.33 ? "mid" : "lo");
  } else {
    const base=norm>0 ? norm : peak/2;
    const share=base>0 ? value/base : 0;
    cls.push(share>1 ? "down" : "up");
    cls.push(share>1 ? "hi" : share>0.5 ? "mid" : "lo");
  }
  return cls.join(" ");
}

function renderCalendarDays(){
  const {y,m}=calMonth();
  const byDay=financeByDay(y,m);
  const metric=calMetric();
  const norm=dailyNorm(y,m,byDay);
  const nd=daysInMonth(y,m);
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const now=new Date();
  const isThisMonth = now.getFullYear()===y && now.getMonth()===m;

  const values=[];
  for(let d=1;d<=nd;d++){
    const c=byDay[d];
    values.push(c ? (metric==="net" ? c.net : c.exp) : 0);
  }
  const peak=Math.max(1, ...values.map(Math.abs));

  let cells="";
  for(let i=0;i<lead;i++) cells+='<div class="pcal-cell blank"></div>';
  for(let d=1;d<=nd;d++){
    const c=byDay[d];
    const v=values[d-1];
    const key=`${y}-${pad2(m+1)}-${pad2(d)}`;
    const cls=["pcal-cell"];
    const paint=calCellClass(c? v : 0, metric, norm, peak);
    if(paint) cls.push(paint);
    if(isThisMonth && d===now.getDate()) cls.push("today");
    if(cur.calSel===key) cls.push("sel");
    const label = !c ? "—"
      : metric==="net" ? (v>0?"+":v<0?"−":"") + shortMoney(Math.abs(v))
      : shortMoney(v);
    cells+=`<div class="${cls.join(' ')}" data-calday="${key}">
      <span class="d">${d}</span><span class="v">${label}</span></div>`;
  }
  return `<div class="pcal">
    ${WEEKDAYS.map(w=>`<div class="wd">${w}</div>`).join("")}
    ${cells}
  </div>`;
}

function renderCalendarMonths(){
  const {y}=calMonth();
  const byM=financeByMonth(y);
  const metric=calMetric();
  const values=[];
  for(let m=0;m<12;m++) values.push(metric==="net" ? byM[m].net : byM[m].exp);
  const peak=Math.max(1, ...values.map(Math.abs));
  const now=new Date();

  // Для месяца норма — сам лимит расходов: вопрос ведь ровно тот же, что и по
  // дням, только крупнее — вписался в бюджет или нет.
  const monthNorm = metric==="net" ? 0 : (+DATA.finance.budgetLimit||0);
  const cells=values.map((v,m)=>{
    const has=byM[m].n>0;
    const cls=["pcal-cell","mon"];
    const paint=calCellClass(has? v : 0, metric, monthNorm, peak);
    if(paint) cls.push(paint);
    if(now.getFullYear()===y && now.getMonth()===m) cls.push("today");
    const label = !has ? "—"
      : metric==="net" ? (v>0?"+":v<0?"−":"") + shortMoney(Math.abs(v))
      : shortMoney(v);
    return `<div class="${cls.join(' ')}" data-calmon="${m}">
      <span class="d">${MONTHS_SHORT[m]}</span><span class="v">${label}</span></div>`;
  }).join("");
  return `<div class="pcal months">${cells}</div>`;
}

function calDraft(){
  if(!cur.calDraft) cur.calDraft={type:"расход", amount:"", category:"", comment:"", currency:""};
  return cur.calDraft;
}
function renderCalendarDay(){
  const key=cur.calSel;
  if(!key) return "";
  const dt=parseLocalDate(key);
  if(!dt) return "";
  const ids=rubAccountIds();
  const rows=entriesInRub().filter(e=>e.date===key);
  const inc=rows.filter(e=>e.type==="доход").reduce((s,e)=>s+(+e.amount||0),0);
  const exp=rows.filter(e=>e.type!=="доход").reduce((s,e)=>s+(+e.amount||0),0);
  const d=calDraft();
  const catOpts=DATA.financeCats.map(c=>
    `<option value="${escapeHtml(c.name)}" ${c.name===d.category?"selected":""}>${escapeHtml(c.name)}</option>`).join("");

  const list=rows.length
    ? rows.map(e=>`<div class="ins-row">
        <div class="l">${escapeHtml(e.comment||e.category||(e.type==="доход"?"доход":"расход"))}${e.comment&&e.category?`<small>${escapeHtml(e.category)}</small>`:""}</div>
        <div class="v" style="color:${e.type==="доход"?"var(--green)":"var(--pink)"}">${e.type==="доход"?"+":"−"}${(+e.amount||0).toLocaleString('ru-RU',{maximumFractionDigits:2})}</div>
        <button class="del" data-caldel="${e._i}">✕</button>
      </div>`).join("")
    : '<div class="empty" style="padding:8px 0;">В этот день записей нет</div>';

  return `<div class="pcal-day">
    <div class="pd-head">
      <span class="dt">${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}</span>
      <span class="wd">${WEEKDAYS[(dt.getDay()+6)%7]}</span>
      <span class="sum">${inc?`<b style="color:var(--green)">+${Math.round(inc).toLocaleString('ru-RU')}</b> `:""}${exp?`<b style="color:var(--pink)">−${Math.round(exp).toLocaleString('ru-RU')}</b>`:""}${!inc&&!exp?"пусто":""}</span>
      <button class="pd-close" data-calclose="1">✕</button>
    </div>
    <div class="pd-list">${list}</div>
    <div class="pd-add">
      <div class="seg">
        <button class="${d.type==="доход"?"":"active"}" data-caltype="расход">− Расход</button>
        <button class="${d.type==="доход"?"active":""}" data-caltype="доход">+ Доход</button>
      </div>
      <input id="calAmount" type="text" inputmode="decimal" placeholder="Сумма" value="${escapeHtml(String(d.amount||''))}">
      <select id="calCat"><option value="">без категории</option>${catOpts}</select>
      ${finCurrencies().length>1? `<select id="calCur">${finCurrencies().map(c=>
        `<option value="${c}" ${(d.currency||accountCurrency(defaultAccountId()))===c?"selected":""}>${c}</option>`).join("")}</select>`:""}
      <input id="calComment" placeholder="Комментарий" value="${escapeHtml(d.comment||'')}">
      <button class="btn" id="calAdd">Добавить</button>
    </div>
  </div>`;
}

function renderProfitCalendar(){
  ensureFinanceCats(); ensureFinanceAccounts();
  const {y,m}=calMonth();
  const byMonth=cur.calMode==="months";
  const metric=calMetric();
  const norm=byMonth? 0 : dailyNorm(y,m,financeByDay(y,m));

  const hint = byMonth
    ? (metric==="net" ? "Доход минус расход за месяц"
        : ((+DATA.finance.budgetLimit||0)>0

            : "Расходы за месяц"))
    : (metric==="net"
        ? "Доход минус расход за день · тап по дню, чтобы дописать"
        : (norm>0
            ? `Норма ${fmtRub(norm)}/день, красный — дороже · тап по дню, чтобы дописать`
            : "Задай лимит расходов на месяц, и появится дневная норма"));

  return `<div class="card">
    <h2>Календарь <span style="font-size:11px;color:var(--grey-dim);font-weight:400;">(всё в ₽ по курсу)</span></h2>
    <div class="pcal-bar">
      <div class="seg">

      </div>
      <div class="ynav">
        <button data-calnav="-1">‹</button>

function bindProfitCalendar(){
  document.querySelectorAll('[data-calmode]').forEach(b=>{
    b.onclick=()=>{ cur.calMode=b.dataset.calmode; cur.calSel=null; render(); };
  });
  document.querySelectorAll('[data-calmetric]').forEach(b=>{
    b.onclick=()=>{ cur.calMetric=b.dataset.calmetric; render(); };
  });
  document.querySelectorAll('[data-calnav]').forEach(b=>{
    b.onclick=()=>{
      if(cur.calMode==="months"){ calMonth(); cur.calY+= +b.dataset.calnav; cur.calSel=null; }
      else calShift(+b.dataset.calnav);
      render();
    };
  });
  document.querySelectorAll('[data-calmon]').forEach(b=>{
    // тап по месяцу проваливается в его дни — иначе год выглядит тупиком
    b.onclick=()=>{ cur.calM=+b.dataset.calmon; cur.calMode="days"; cur.calSel=null; render(); };
  });
  document.querySelectorAll('[data-calday]').forEach(b=>{
    b.onclick=()=>{
      const key=b.dataset.calday;
      cur.calSel = cur.calSel===key ? null : key;
      render();
    };
  });
  const close=document.querySelector('[data-calclose]');
  if(close) close.onclick=()=>{ cur.calSel=null; render(); };

  document.querySelectorAll('[data-caltype]').forEach(b=>{
    b.onclick=()=>{ syncCalDraft(); calDraft().type=b.dataset.caltype; render(); };
  });
  document.querySelectorAll('[data-caldel]').forEach(b=>{
    b.onclick=()=>{ deleteWithUndo('Запись', ()=>DATA.finance.entries.splice(+b.dataset.caldel,1)); };
  });

  const amount=document.getElementById("calAmount");
  if(!amount) return;
  const submit=()=>{
    syncCalDraft();
    const d=calDraft();
    const v=parseFloat(String(d.amount).replace(",","."));
    if(!isFinite(v) || v<=0){ flashError(amount,"Введи сумму"); return; }
    const accCur=accountCurrency(defaultAccountId());
    const entry={date:cur.calSel, time:nowTime(), amount:v, type:d.type,
      category:d.category||"", comment:(d.comment||"").trim(), accountId:String(defaultAccountId())};
    if(d.currency && d.currency!==accCur) entry.currency=d.currency;
    DATA.finance.entries.push(entry);
    d.amount=""; d.comment="";     // тип и категория остаются: обычно за день их несколько подряд
    cur.calFocus=true;
    scheduleSave(); render();
  };
  document.getElementById("calAdd").onclick=submit;
  const enter=e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } };
  amount.onkeydown=enter;
  const comment=document.getElementById("calComment");
  if(comment) comment.onkeydown=enter;
  const cat=document.getElementById("calCat");
  if(cat) cat.onchange=()=>{ syncCalDraft(); };
  const ccur=document.getElementById("calCur");
  if(ccur) ccur.onchange=()=>{ syncCalDraft(); };
  if(cur.calFocus){ cur.calFocus=false; amount.focus(); }
}
// поля живут в DOM до перерисовки, поэтому забираем их значения перед ней
function syncCalDraft(){
  const d=calDraft();
  const a=document.getElementById("calAmount");
  const c=document.getElementById("calComment");
  const cat=document.getElementById("calCat");
  if(a) d.amount=a.value;
  if(c) d.comment=c.value;
  if(cat) d.category=cat.value;
  const ccur=document.getElementById("calCur");
  if(ccur) d.currency=ccur.value;
}

// ═════════ ФИНАНСЫ: ДОХОДЫ КАК ТОРГОВЫЙ ЖУРНАЛ ═════════
// Доход здесь — результат арбитража, и он бывает отрицательным. Убыток хранится
// как доход со знаком минус: так баланс счёта, итог месяца и календарь считаются
// из одной и той же суммы, а расходы на жизнь не смешиваются с торговыми.

const SOURCE_PALETTE=["#E0A33A","#5B8DEF","#A07FE0","#3FAE96","#E07A8C","#8FA24A","#D9794A"];
const SOURCES_DEFAULT=[
  {id:"crypto", name:"Крипто-арбитраж", note:"между фьючерсами", color:"#E0A33A", currency:"USDT"},
  {id:"stocks", name:"Фондовый арбитраж", note:"", color:"#5B8DEF", currency:"RUB"}
];
const OTHER_SRC={id:"other", name:"Прочее", note:"", color:"#9A9A9A", currency:""};
const MONTHS_DAT=["январю","февралю","марту","апрелю","маю","июню","июлю","августу","сентябрю","октябрю","ноябрю","декабрю"];
const WEEKDAYS_FULL=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];

function incomeSources(){
  if(!Array.isArray(DATA.finance.sources) || !DATA.finance.sources.length)
    DATA.finance.sources=SOURCES_DEFAULT.map(s=>({...s}));
  return DATA.finance.sources;
}
function srcById(id){ return incomeSources().find(s=>s.id===id) || null; }
function srcMeta(id){ return srcById(id) || OTHER_SRC; }
function srcShort(s){ return String(s.name||"").split(/[\s-]/)[0] || s.name; }
// У старых записей источника нет. Доход в USDT — почти наверняка крипта: его
// относим к крипто-источнику, не переписывая сами записи. Остальное — «прочее».
function entrySource(e){
  if(e.source && srcById(e.source)) return e.source;
  if(!e.source && entryCurrency(e)==="USDT"){
    const s=srcById("crypto") || incomeSources().find(x=>x.currency==="USDT");
    if(s) return s.id;
  }
  return "other";
}
// Доход, у которого источник никто не выбирал: старые записи и то, что пришло
// списком. Шаблоны вроде зарплаты — не арбитраж, их не дёргаем.
function isUnassignedIncome(e){
  return e.type==="доход" && !e.source && !e.recurringId && entrySource(e)==="other";
}
// Счёт, на который по умолчанию ложится результат источника: запомненный, иначе
// первый счёт в валюте источника, иначе основной.
function srcAccount(meta){
  const accs=DATA.finance.accounts;
  if(meta.accountId && accs.some(a=>String(a.id)===String(meta.accountId))) return String(meta.accountId);
  const byCur=meta.currency && accs.find(a=>(a.currency||"RUB")===meta.currency);
  return String(byCur? byCur.id : defaultAccountId());
}

// Валюта, в которой календарь сводит всё в одно число. Пока её не выбрали —
// та, в которой записано больше всего доходов.
function pnlCurrency(){
  const f=DATA.finance;
  if(CURRENCY_LIST.includes(f.pnlCur)) return f.pnlCur;
  const cnt={};
  (f.entries||[]).forEach(e=>{ if(e.type==="доход"){ const c=entryCurrency(e); cnt[c]=(cnt[c]||0)+1; } });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0] || "RUB";
}
function pnlCurList(){
  const list=["USDT","USD","RUB"];
  if(finCurrencies().includes("EUR")) list.push("EUR");
  return list;
}
// null — курса нет, и честно пересчитать нельзя. Доллар и USDT друг в друга
// переводятся и без курса к рублю.
function pnlIn(e, to){
  const v=+e.amount||0, from=entryCurrency(e);
  if(from===to) return v;
  const usdish=c=>c==="USD"||c==="USDT";
  if(usdish(from) && usdish(to)) return v;
  return convertMoney(v, from, to);
}
function pnlMonth(y, m, src, to){
  const prefix=`${y}-${pad2(m+1)}`;
  const days={}, bySrc={}, missing=new Set();
  let total=0, n=0;
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type!=="доход" || !e.date || e.date.slice(0,7)!==prefix) return;
    const s=entrySource(e);
    if(src && src!=="all" && s!==src) return;
    const v=pnlIn(e,to);
    if(v==null){ missing.add(entryCurrency(e)); return; }
    const d=parseInt(e.date.slice(8,10),10);
    if(!d) return;
    const c=days[d]||(days[d]={v:0,n:0});
    c.v+=v; c.n++;
    bySrc[s]=(bySrc[s]||0)+v;
    total+=v; n++;
  });
  return {days, bySrc, total, n, missing:[...missing]};
}
function pnlYear(y, src, to){
  const months=[]; const missing=new Set(); let total=0;
  for(let m=0;m<12;m++) months.push({v:0,n:0});
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type!=="доход" || !e.date || e.date.slice(0,4)!==String(y)) return;
    if(src && src!=="all" && entrySource(e)!==src) return;
    const v=pnlIn(e,to);
    if(v==null){ missing.add(entryCurrency(e)); return; }
    const m=parseInt(e.date.slice(5,7),10)-1;
    if(!(m>=0 && m<12)) return;
    months[m].v+=v; months[m].n++; total+=v;
  });
  return {months, total, missing:[...missing]};
}
// Серия — сколько последних торговых дней подряд закрыты в плюс. Дни без
// записей (выходные, пропуски) серию не рвут: не торговал — не проиграл.
function pnlStreak(to){
  const byDate={};
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type!=="доход" || !e.date) return;
    const v=pnlIn(e,to);
    if(v==null) return;
    byDate[e.date]=(byDate[e.date]||0)+v;
  });
  const dates=Object.keys(byDate).filter(d=>d<=todayStr()).sort().reverse();
  let n=0;
  for(const d of dates){ if(byDate[d]>0.004) n++; else break; }
  return n;
}

function fmtPnl(v, curr, digits){
  const sign = v>0.004? "+" : v<-0.004? "−" : "";
  const a=Math.abs(+v||0);
  const d = digits!=null? digits : (a>=100? 0 : 2);
  return `${sign}${a.toLocaleString('ru-RU',{maximumFractionDigits:d})} ${CURRENCY_SYMBOL[curr]||curr}`;
}
// В клетке календаря места на «+12 340 ₮» нет: «+12к», «+1,2к», «−35»
function shortPnl(v){
  const a=Math.abs(+v||0);
  if(a<0.005) return "0";
  const sign=v>0? "+" : "−";
  const trim=s=>s.replace(/,0$/,"");
  let s;
  if(a>=1e6) s=trim((a/1e6).toFixed(a>=1e7?0:1).replace(".",","))+"м";
  else if(a>=1e4) s=Math.round(a/1e3)+"к";
  else if(a>=1e3) s=trim((a/1e3).toFixed(1).replace(".",","))+"к";
  else if(a>=10) s=String(Math.round(a));
  else s=trim(a.toFixed(1).replace(".",","));
  return sign+s;
}
function pnlClass(v){ return v>0.004? "pos" : v<-0.004? "neg" : "zero"; }

function finMode(){
  const s=DATA.settings||(DATA.settings={});
  return s.finMode==="exp" ? "exp" : "inc";
}

function renderPnlHero(){

  const PP=pnlMonth(pd.getFullYear(), pd.getMonth(), "all", to);
  const dayList=Object.keys(P.days).map(d=>({d:+d, v:P.days[d].v}));
  const trading=dayList.length;
  const win=dayList.filter(x=>x.v>0.004).length;
  const best=dayList.slice().sort((a,b)=>b.v-a.v)[0];
  const worst=dayList.slice().sort((a,b)=>a.v-b.v)[0];
  const isNow=(()=>{ const n=new Date(); return n.getFullYear()===y && n.getMonth()===m; })();

  let delta="";
  if(PP.n && Math.abs(PP.total)>0.004 && P.n){
    const pct=Math.round((P.total-PP.total)/Math.abs(PP.total)*100);
    delta=`<span class="${pct>=0?'pos':'neg'}">${pct>=0?'▲':'▼'} ${Math.abs(pct)}%</span> к ${MONTHS_DAT[pd.getMonth()]}`;
  }
  const subParts=[];
  if(delta) subParts.push(delta);
  if(trading) subParts.push(`${win} из ${trading} ${plural(trading,'дня','дней','дней')} в плюсе`);

  const srcIds=Object.keys(P.bySrc).sort((a,b)=>P.bySrc[b]-P.bySrc[a]);

  const rows=srcIds.map(id=>{
    const meta=srcMeta(id), v=P.bySrc[id];

    return `<div class="fx-srow">
      <i style="background:${meta.color}"></i>
      <span class="n">${escapeHtml(meta.name)}</span>
      <span class="v ${pnlClass(v)}">${fmtPnl(v,to)}</span>
      <span class="p">${share}</span>
    </div>`;
  }).join("");

  const unassigned=(DATA.finance.entries||[]).filter(isUnassignedIncome).length;
  const assignNote = unassigned ? `<button class="fx-assign" data-fxassign="1">
      <span>${unassigned} ${plural(unassigned,'запись','записи','записей')} дохода без источника</span><b>Разнести ›</b></button>` : "";
  const streak=isNow? pnlStreak(to) : 0;
  const tiles=trading? `<div class="fx-tiles">
      <div><span class="k">Лучший день</span><span class="v pos">${best && best.v>0? fmtPnl(best.v,to,0) : "—"}</span><span class="s">${best && best.v>0? `${best.d} ${MONTHS_GEN[m].slice(0,3)}` : "плюсовых нет"}</span></div>
      <div><span class="k">В среднем</span><span class="v ${pnlClass(P.total/trading)}">${fmtPnl(P.total/trading,to,0)}</span><span class="s">за торговый день</span></div>
      ${isNow
        ? `<div><span class="k">Серия</span><span class="v">${streak}</span><span class="s">${plural(streak,'день','дня','дней')} в плюс подряд</span></div>`
        : `<div><span class="k">Худший день</span><span class="v ${worst && worst.v<0?'neg':''}">${worst && worst.v<0? fmtPnl(worst.v,to,0) : "—"}</span><span class="s">${worst && worst.v<0? `${worst.d} ${MONTHS_GEN[m].slice(0,3)}` : "без минусов"}</span></div>`}
    </div>` : "";

  const missing=P.missing.length? `<div class="fx-warn">Нет курса для ${P.missing.join(", ")} — эти записи не вошли в сумму.
      <button data-fxrates="1">Обновить курс</button></div>` : "";

  return `<div class="card fx-hero ${pnlClass(P.total)}">
    <div class="fx-hero-top">
      <span class="fx-k">Доход · ${MONTHS_RU[m].toLowerCase()}${y!==new Date().getFullYear()? " "+y:""}</span>
      <div class="fx-cur" role="group" aria-label="Валюта сводки">${pnlCurList().map(c=>
        `<button class="${c===to?'on':''}" data-pncur="${c}" title="${c}">${CURRENCY_SYMBOL[c]||c}</button>`).join("")}</div>
    </div>
    <div class="fx-big ${pnlClass(P.total)}">${P.n? fmtPnl(P.total,to) : `0 ${CURRENCY_SYMBOL[to]||to}`}</div>
    <div class="fx-sub">${P.n? subParts.join(" · ") : "Записей за этот месяц нет — нажми на день в календаре"}</div>
    ${renderPnlPlan(y,m)}
    ${bar}
    ${rows? `<div class="fx-srows">${rows}</div>` : ""}

function pnlSrcFilter(){

}
function usedSourceIds(){
  const ids=new Set(incomeSources().map(s=>s.id));

function renderPnlCalendar(){
  const to=pnlCurrency();
  const src=pnlSrcFilter();
  const {y,m}=calMonth();
  const byMonth=cur.calMode==="months";
  const ids=usedSourceIds();
  const chips = ids.length>1 ? `<div class="fx-chips">
      <button class="${src==="all"?'on':''}" data-pcsrc="all">Все</button>
      ${ids.map(id=>{ const meta=srcMeta(id); return `<button class="${src===id?'on':''}" data-pcsrc="${id}" style="--src:${meta.color}"><i></i>${escapeHtml(srcShort(meta))}</button>`; }).join("")}
    </div>` : "";

  let body, total, missing;
  if(byMonth){
    const Y=pnlYear(y,src,to);
    total=Y.total; missing=Y.missing;
    const peak=Math.max(0,...Y.months.map(x=>Math.abs(x.v)));
    const now=new Date();
    body=`<div class="fx-mgrid">${Y.months.map((c,mi)=>{
      const cls=["fx-mcell"];
      const future = y>now.getFullYear() || (y===now.getFullYear() && mi>now.getMonth());
      if(c.n){
        cls.push(c.v>0.004?"up":c.v<-0.004?"down":"flat");
        const share=peak>0? Math.abs(c.v)/peak : 0;
        cls.push(share>0.66?"l3":share>0.33?"l2":"l1");
      } else cls.push(future?"future":"none");
      if(now.getFullYear()===y && now.getMonth()===mi) cls.push("today");
      const val = c.n? fmtPnl(c.v,to,0).replace(/\s\S+$/,"") : (future? "" : "—");
      return `<button class="${cls.join(" ")}" data-pcmon="${mi}"><span class="d">${MONTHS_SHORT[mi]}</span><span class="v">${val}</span></button>`;
    }).join("")}</div>`;
  } else {
    const P=pnlMonth(y,m,src,to);
    total=P.total; missing=P.missing;
    const nd=daysInMonth(y,m);
    const lead=(new Date(y,m,1).getDay()+6)%7;
    const todayKey=todayStr();
    const peak=Math.max(0,...Object.values(P.days).map(c=>Math.abs(c.v)));
    const selKey = cur.sheet && cur.sheet.kind==="day" ? cur.sheet.date : "";
    let cells="";
    for(let i=0;i<lead;i++) cells+='<span class="fx-cell blank"></span>';
    for(let d=1; d<=nd; d++){
      const key=`${y}-${pad2(m+1)}-${pad2(d)}`;
      const c=P.days[d];
      const cls=["fx-cell"];
      let val="—";
      if(c){
        if(Math.abs(c.v)<0.005){ cls.push("flat"); val="0"; }
        else{
          cls.push(c.v>0?"up":"down");
          const share=peak>0? Math.abs(c.v)/peak : 0;
          cls.push(share>0.66?"l3":share>0.33?"l2":"l1");
          val=shortPnl(c.v);
        }
      } else if(key>todayKey){ cls.push("future"); val=""; }
      else cls.push("none");
      if(key===todayKey) cls.push("today");
      if(key===selKey) cls.push("sel");
      cells+=`<button class="${cls.join(" ")}" data-pcday="${key}" aria-label="${d} ${MONTHS_GEN[m]}${c? ": "+fmtPnl(c.v,to):""}"><span class="d">${d}</span><span class="v">${val}</span></button>`;
    }
    // итоги недель — то, на что трейдер смотрит сразу после дня
    const weeks=[];
    for(let start=1-lead; start<=nd; start+=7){
      const a=Math.max(1,start), b=Math.min(nd,start+6);
      if(`${y}-${pad2(m+1)}-${pad2(a)}`>todayKey) break;
      let v=0, n=0;
      for(let d=a; d<=b; d++){ const c=P.days[d]; if(c){ v+=c.v; n+=c.n; } }
      weeks.push({a,b,v,n});
    }
    const weekHtml=weeks.length? `<div class="fx-weeks" style="grid-template-columns:repeat(${weeks.length},minmax(0,1fr))">
        ${weeks.map(w=>`<div class="${w.n? pnlClass(w.v):'zero'}"><span class="k">${w.a===w.b? w.a : `${w.a}–${w.b}`}</span><span class="v">${w.n? shortPnl(w.v) : "—"}</span></div>`).join("")}
      </div>` : "";
    body=`<div class="fx-grid">${WEEKDAYS.map(w=>`<span class="wd">${w}</span>`).join("")}${cells}</div>
      ${weekHtml? `<div class="fx-wl">Недели</div>${weekHtml}` : ""}`;
  }

  return `<div class="card fx-cal">
    <div class="fx-cal-title">
      <h2>Календарь прибыли</h2>
      <span class="fx-total ${pnlClass(total)}">${fmtPnl(total,to,0)}</span>
    </div>
    <div class="fx-cal-top">
      <div class="seg fx-seg">
        <button class="${byMonth?"":"active"}" data-pcmode="days">По дням</button>
        <button class="${byMonth?"active":""}" data-pcmode="months">По месяцам</button>
      </div>
      <div class="fx-nav">
        <button data-pcnav="-1" aria-label="Назад">‹</button>
        <span>${byMonth? y : `${MONTHS_RU[m]} ${y}`}</span>
        <button data-pcnav="1" aria-label="Вперёд">›</button>
      </div>
    </div>
    ${chips}
    ${body}
    ${missing && missing.length? `<div class="fx-warn">Нет курса для ${missing.join(", ")} — не вошло. <button data-fxrates="1">Обновить курс</button></div>`:""}
    <div class="fx-hint">${byMonth? "Нажми на месяц — откроются его дни" : "Нажми на день, чтобы записать или поправить результат"}</div>
  </div>`;
}

function dayLabel(key){
  const dt=parseLocalDate(key);
  if(!dt) return key||"";
  const t=todayStr();
  const y=new Date(); y.setDate(y.getDate()-1);
  const yKey=`${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`;
  const base=`${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}`;
  if(key===t) return `Сегодня, ${base}`;
  if(key===yKey) return `Вчера, ${base}`;
  const yearPart = dt.getFullYear()!==new Date().getFullYear() ? ` ${dt.getFullYear()}` : "";
  return `${base}${yearPart}, ${WEEKDAYS[(dt.getDay()+6)%7].toLowerCase()}`;
}
function groupByDate(list){
  const out=[]; let curKey=null, grp=null;
  list.forEach(x=>{
    const k=x.e.date||"";
    if(k!==curKey){ curKey=k; grp={date:k, items:[]}; out.push(grp); }
    grp.items.push(x);
  });
  return out;
}
const FX_SEARCH_LIMIT=120;
function incomeRecordsList(){
  const to=pnlCurrency();
  const {y,m}=calMonth();
  const q=(cur.fxQ||"").trim().toLowerCase();
  let list=(DATA.finance.entries||[]).map((e,i)=>({e,i})).filter(x=>x.e.type==="доход");
  if(q) list=list.filter(({e})=>`${e.comment||""} ${srcMeta(entrySource(e)).name} ${e.amount}`.toLowerCase().includes(q));
  else { const prefix=`${y}-${pad2(m+1)}`; list=list.filter(({e})=>(e.date||"").slice(0,7)===prefix); }
  list.sort((a,b)=>(b.e.date||"").localeCompare(a.e.date||"") || b.i-a.i);
  const total=list.length;
  if(q) list=list.slice(0,FX_SEARCH_LIMIT);
  if(!list.length) return `<div class="fx-empty">${q? "Ничего не нашлось" : "В этом месяце доходов пока нет"}</div>`;
  const groups=groupByDate(list).map(g=>{
    let sum=0, ok=true;
    g.items.forEach(({e})=>{ const v=pnlIn(e,to); if(v==null) ok=false; else sum+=v; });
    return `<div class="fx-day">
      <div class="fx-dh"><span>${escapeHtml(dayLabel(g.date))}</span>${ok? `<b class="${pnlClass(sum)}">${fmtPnl(sum,to)}</b>`:""}</div>
      ${g.items.map(({e,i})=>{
        const meta=srcMeta(entrySource(e));
        const curr=entryCurrency(e);
        return `<button class="fx-row" data-fxinc="${i}">
          <i class="dot" style="background:${meta.color}"></i>
          <span class="t"><b>${escapeHtml(meta.name)}</b>${incomeNote(e)? `<small>${escapeHtml(incomeNote(e))}</small>`:""}</span>
          <span class="a ${pnlClass(+e.amount)}">${fmtPnl(+e.amount||0,curr)}</span>
        </button>`;
      }).join("")}
    </div>`;
  }).join("");
  return groups + (q && total>list.length? `<div class="fx-empty">показано ${list.length} из ${total}</div>` : "");
}

  const prefix=`${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  let list;
  if(expenseFilterActive()){
    list=filterFinanceEntries(DATA.finance.entries).filter(e=>e.type!=="доход").map(e=>({e, i:e._i}));
  } else {
    list=(DATA.finance.entries||[]).map((e,i)=>({e,i})).filter(x=>x.e.type!=="доход" && (x.e.date||"").slice(0,7)===prefix);
  }
  list.sort((a,b)=>(b.e.date||"").localeCompare(a.e.date||"") || b.i-a.i);
  const lim=cur.finLimit||FIN_PAGE;
  const shown=list.slice(0,lim);
  if(!shown.length) return `<div class="fx-empty">${expenseFilterActive()? "Ничего не нашлось" : "В этом месяце расходов пока нет"}</div>`;
  const html=groupByDate(shown).map(g=>{
    const sums={};
    g.items.forEach(({e})=>{ const c=entryCurrency(e); sums[c]=(sums[c]||0)+(+e.amount||0); });
    return `<div class="fx-day">
      <div class="fx-dh"><span>${escapeHtml(dayLabel(g.date))}</span><b class="neg">−${fmtMoneyMap(sums,0)}</b></div>
      ${g.items.map(({e,i})=>{
        if(cur.finEdit===i) return renderFinEditRow(e,i);
        const col=catColor[e.category]||"var(--grey-dim)";
        const title=e.comment || e.category || "расход";
        const sub=e.comment && e.category? e.category : "";
        const curr=entryCurrency(e);
        const acc=DATA.finance.accounts.length>1? ` · ${escapeHtml(accName[e.accountId||defaultAccountId()]||"")}` : "";
        return `<button class="fx-row" data-finrow="${i}">
          <i class="dot" style="background:${col}"></i>
          <span class="t"><b>${escapeHtml(title)}</b>${sub||acc? `<small>${escapeHtml(sub)}${acc}</small>`:""}</span>
          <span class="a neg">−${fmtMoney(+e.amount||0,curr)}</span>
        </button>`;
      }).join("")}
    </div>`;
  }).join("");
  const more = list.length>shown.length
    ? `<div class="fin-more"><button class="btn ghost" id="finMore">Показать ещё ${Math.min(FIN_PAGE, list.length-shown.length)}</button></div>` : "";
  return html+more;
}
function renderExpenseRecords(){
  const f=cur.finFilter||{};
  const active=expenseFilterActive();
  const pill = active ? (()=>{
    const parts=[];
    if(f.category) parts.push(f.category==="__none__"? "без категории" : f.category);
    if(f.from||f.to) parts.push(`${f.from? f.from.slice(8,10)+"."+f.from.slice(5,7) : "…"}–${f.to? f.to.slice(8,10)+"."+f.to.slice(5,7) : "…"}`);
    if(f.q) parts.push(`«${f.q}»`);
    if(f.accountId) parts.push((DATA.finance.accounts.find(a=>String(a.id)===String(f.accountId))||{}).name||"счёт");
    return `<div class="fx-filterpill"><span>Фильтр: ${escapeHtml(parts.join(" · "))}</span><button id="fxFilterReset" aria-label="Сбросить фильтр">✕</button></div>`;
  })() : "";
  return `<div class="card fx-rec">
    <div class="fx-rec-head">
      <h2>${active? "Найденные расходы" : `Расходы · ${MONTHS_RU[new Date().getMonth()].toLowerCase()}`}</h2>
      <button class="fx-linkbtn" id="fxFilterToggle">${cur.fxFilterOpen? "Скрыть фильтр" : "Фильтр"}</button>

}

// ---------- ЛИСТ ДНЯ: ЗАПИСАТЬ РЕЗУЛЬТАТ ----------
function incomeDraftFor(editIdx, keep){
  if(editIdx!=null){
    const e=DATA.finance.entries[editIdx];
    if(e) return {src:entrySource(e), sign:(+e.amount<0)?-1:1, amount:String(Math.abs(+e.amount||0)).replace(".",","),
      currency:entryCurrency(e), comment:e.comment||"", accountId:String(e.accountId||defaultAccountId()),
      fee: +e.fee? String(+e.fee).replace(".",",") : "", fund: +e.fund? String(Math.abs(+e.fund)).replace(".",",") : "",
      fundSign: (+e.fund<0)? -1 : 1, costs: !!(+e.fee || +e.fund)};
  }
  const last = keep && keep.src ? keep.src
    : (DATA.finance.lastSource && (srcById(DATA.finance.lastSource) || DATA.finance.lastSource==="other") ? DATA.finance.lastSource
      : (incomeSources()[0]||OTHER_SRC).id);
  const meta=srcMeta(last);
  const accountId = keep && keep.accountId ? keep.accountId : srcAccount(meta);
  return {src:last, sign: keep && keep.sign ? keep.sign : 1, amount:"",
    currency: (keep && keep.currency) || meta.currency || accountCurrency(accountId), comment:"", accountId,
    fee:"", fund:"", fundSign:1, costs: !!(keep && keep.costs)};
}
function openDaySheet(date, editIdx, fromFab){
  // Клавиатура сразу — только когда ясно, что будут вводить: день пустой или
  // нажали «+». Иначе она закрыла бы список того, что в этот день уже есть.
  const hasRows=(DATA.finance.entries||[]).some(e=>e.type==="доход" && e.date===date);
  const s={kind:"day", scope:"fin", date, edit: editIdx==null? null : editIdx,
    focus: editIdx==null && (fromFab || !hasRows)};
  s.draft=incomeDraftFor(s.edit);
  cur.sheet=s;
  render();          // и подсветить выбранный день под листом, и открыть лист
}

  const d=s.draft;

  const srcs=incomeSources();
  const srcBtns=[...srcs, OTHER_SRC].map(meta=>
    `<button class="${d.src===meta.id?'on':''}" data-shsrc="${meta.id}" style="--src:${meta.color}"><i></i>${escapeHtml(meta.name)}</button>`).join("");
  const accs=DATA.finance.accounts;
  const accRow = accs.length>1 ? `<div class="sh-lab">Счёт</div><div class="fx-pick">${accs.map(a=>
      `<button class="${String(d.accountId)===String(a.id)?'on':''}" data-shacc="${a.id}">${escapeHtml(a.name)} <small>${a.currency||"RUB"}</small></button>`).join("")}</div>` : "";
  const list = rows.length ? rows.map(({e,i})=>{
      const meta=srcMeta(entrySource(e));
      return `<button class="fx-row ${s.edit===i?'editing':''}" data-shedit="${i}">
        <i class="dot" style="background:${meta.color}"></i>

        <span class="a ${pnlClass(+e.amount)}">${fmtPnl(+e.amount||0, entryCurrency(e))}</span>
      </button>`; }).join("")
    : `<div class="fx-empty sm">В этот день результатов нет</div>`;
  const sym=CURRENCY_SYMBOL[d.currency]||d.currency;
  return `<div class="sh-head">
      <button class="sh-nav" data-shday="-1" aria-label="Предыдущий день">‹</button>
      <div class="sh-title"><b>${wd[0].toUpperCase()+wd.slice(1)}, ${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}</b>
        <span class="${rows.length? pnlClass(sum):'zero'}">${rows.length? (ok? fmtPnl(sum,to)+" за день" : "итог без части валют") : "пустой день"}</span></div>
      <button class="sh-nav" data-shday="1" aria-label="Следующий день">›</button>
      <button class="sh-x" data-shclose="1" aria-label="Закрыть">✕</button>
    </div>
    <div class="sh-list">${list}</div>
    <div class="sh-form ${editing?'editing':''}">
      <div class="sh-lab">${editing? "Правка записи" : "Новый результат"}<button class="fx-linkbtn" data-shsources="1">Источники</button></div>
      <div class="fx-pick src">${srcBtns}</div>
      <div class="fx-sign">
        <button class="${d.sign>0?'on pos':''}" data-shsign="1">+ Прибыль</button>
        <button class="${d.sign<0?'on neg':''}" data-shsign="-1">− Убыток</button>
      </div>
      <label class="fx-amt ${d.sign<0?'neg':'pos'}">
        <span class="s">${d.sign<0?'−':'+'}</span>
        <input id="shAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${escapeHtml(d.amount||"")}">
        <span class="c">${sym}</span>
      </label>
      <div class="fx-pick cur">${["USDT","USD","RUB","EUR"].filter(c=>CURRENCY_LIST.includes(c)).map(c=>
        `<button class="${d.currency===c?'on':''}" data-shcur="${c}">${CURRENCY_SYMBOL[c]||c} ${c}</button>`).join("")}</div>
      ${renderFeeFields(d)}
      ${accRow}
      <input class="sh-in" id="shComment" placeholder="Комментарий: пара, биржа, стратегия…" value="${escapeHtml(d.comment||"")}" autocomplete="off">
      <div class="sh-actions">
        ${editing? `<button class="btn ghost danger" id="shDel">Удалить</button><button class="btn ghost" id="shCancel">Отмена</button>`:""}
        <button class="btn" id="shSave">${editing? "Сохранить" : "Записать"}</button>
      </div>
    </div>`;
}
function syncDayDraft(s){
  const a=document.getElementById("shAmount"), c=document.getElementById("shComment");
  if(a) s.draft.amount=a.value;
  if(c) s.draft.comment=c.value;
  const f=document.getElementById("shFee"), u=document.getElementById("shFund");
  if(f) s.draft.fee=f.value;
  if(u) s.draft.fund=u.value;
}
function bindDaySheet(s){
  const root=sheetRoot();
  const q=sel=>root.querySelectorAll(sel);
  q('[data-shsrc]').forEach(b=>b.onclick=()=>{
    syncDayDraft(s);
    const meta=srcMeta(b.dataset.shsrc);
    s.draft.src=meta.id;
    if(meta.currency) s.draft.currency=meta.currency;
    s.draft.accountId=srcAccount(meta);
    renderSheet();
  });
  q('[data-shsign]').forEach(b=>b.onclick=()=>{ syncDayDraft(s); s.draft.sign=+b.dataset.shsign; renderSheet(); focusAmount(); });
  q('[data-shcur]').forEach(b=>b.onclick=()=>{ syncDayDraft(s); s.draft.currency=b.dataset.shcur; renderSheet(); });
  q('[data-shacc]').forEach(b=>b.onclick=()=>{ syncDayDraft(s); s.draft.accountId=b.dataset.shacc; renderSheet(); });
  q('[data-shedit]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.shedit;
    if(s.edit===i){ s.edit=null; s.draft=incomeDraftFor(null, s.draft); }
    else { s.edit=i; s.draft=incomeDraftFor(i); }
    renderSheet();
  });
  q('[data-shday]').forEach(b=>b.onclick=()=>{
    const dt=parseLocalDate(s.date)||new Date();
    dt.setDate(dt.getDate()+(+b.dataset.shday));
    s.date=`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
    syncDayDraft(s);
    s.edit=null; s.draft=incomeDraftFor(null, s.draft);
    // календарь под листом идёт за выбранным днём
    cur.calY=dt.getFullYear(); cur.calM=dt.getMonth(); cur.calMode="days";
    render();
  });
  q('[data-shsources]').forEach(b=>b.onclick=()=>{ syncDayDraft(s); cur.sheet={kind:"sources", scope:"fin", back:s}; renderSheet(); });
  bindFeeFields(s, q);
  const a=document.getElementById("shAmount");
  const c=document.getElementById("shComment");
  if(a){ a.oninput=()=>{ s.draft.amount=a.value; }; a.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); saveDaySheet(s); } }; }
  if(c){ c.oninput=()=>{ s.draft.comment=c.value; }; c.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); saveDaySheet(s); } }; }
  const save=document.getElementById("shSave");
  if(save) save.onclick=()=>saveDaySheet(s);
  const cancel=document.getElementById("shCancel");
  if(cancel) cancel.onclick=()=>{ s.edit=null; s.draft=incomeDraftFor(null, s.draft); renderSheet(); };
  const del=document.getElementById("shDel");
  if(del) del.onclick=()=>{
    const i=s.edit;
    if(i==null) return;
    s.edit=null; s.draft=incomeDraftFor(null, s.draft);
    deleteWithUndo("Запись", ()=>DATA.finance.entries.splice(i,1));
  };
  if(s.focus){ s.focus=false; focusAmount(); }
}
function focusAmount(){
  const a=document.getElementById("shAmount");
  if(a){ a.focus(); try{ const n=a.value.length; a.setSelectionRange(n,n); }catch(e){} }
}
function saveDaySheet(s){
  syncDayDraft(s);
  const d=s.draft;
  const amountEl=document.getElementById("shAmount");
  const v=parseFloat(String(d.amount).replace(/\s/g,"").replace(",","."));
  if(!isFinite(v) || v<=0){ flashError(amountEl, d.amount? "Сумма должна быть больше нуля — знак выбирается кнопками выше" : "Введи сумму"); return; }
  const signed = d.sign<0 ? -v : v;
  const accCur=accountCurrency(d.accountId);
  const e = s.edit!=null && DATA.finance.entries[s.edit] ? DATA.finance.entries[s.edit]
    : {date:s.date, time:nowTime(), type:"доход", category:""};
  e.type="доход";
  e.amount=signed;
  e.comment=(d.comment||"").trim();
  e.accountId=String(d.accountId||defaultAccountId());
  // «Прочее» тоже пишем явно: так выбранное руками не путается с записями,
  // у которых источник ещё никто не указывал
  e.source=d.src||"other";
  const costNum=x=>{ const v=parseFloat(String(x||"").replace(/\s/g,"").replace(",",".")); return isFinite(v) && v>0 ? v : 0; };
  const fee=costNum(d.fee), fund=costNum(d.fund)*(d.fundSign<0? -1 : 1);
  if(fee) e.fee=fee; else delete e.fee;
  if(fund) e.fund=fund; else delete e.fund;
  if(fee || fund) DATA.finance.costsUsed=true;
  if(d.currency && d.currency!==accCur) e.currency=d.currency; else delete e.currency;
  const isNew = s.edit==null;
  if(isNew) DATA.finance.entries.push(e);
  // запоминаем, куда и в чём обычно ложится этот источник
  const src=srcById(d.src);
  if(src){ src.accountId=e.accountId; if(d.currency) src.currency=d.currency; }
  DATA.finance.lastSource=d.src;
  s.edit=null;
  s.draft=incomeDraftFor(null, d);
  s.focus=isNew;         // следующий результат того же дня — сразу в сумму
  scheduleSave();
  render();
  showActionToast(`${isNew? "Записано" : "Сохранено"}: ${fmtPnl(signed, entryCurrency(e))} · ${srcMeta(d.src).name}`);
}

function bindSourcesSheet(s){
  const root=sheetRoot();

  root.querySelectorAll('[data-shback]').forEach(b=>b.onclick=()=>{
    cur.sheet=s.back||null;

    render();
  });
  root.querySelectorAll('[data-srcname]').forEach(el=>el.onchange=()=>{

    const v=el.value.trim();
    if(!v){ el.value=x.name; return; }
    x.name=v; scheduleSave(); render();

    const x=list[+el.dataset.srccur];
    if(x){ x.currency=el.value; scheduleSave(); render(); }
  });
  root.querySelectorAll('[data-srccolor]').forEach(b=>b.onclick=()=>{
    const x=list[+b.dataset.srccolor];
    if(!x) return;
    const at=SOURCE_PALETTE.indexOf(x.color);
    x.color=SOURCE_PALETTE[(at+1)%SOURCE_PALETTE.length];
    scheduleSave(); render();
  });
  root.querySelectorAll('[data-srcdel]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.srcdel;
    const x=list[i];
    if(!x) return;
    deleteWithUndo(`Источник «${x.name}»`, ()=>{ DATA.finance.sources.splice(i,1); if(!DATA.finance.sources.length) DATA.finance.sources.push({id:"src"+Date.now(), name:"Доход", note:"", color:SOURCE_PALETTE[0], currency:"RUB"}); });
  });
  const add=document.getElementById("srcAdd");
  if(add) add.onclick=()=>{
    const used=new Set(list.map(x=>x.color));
    const color=SOURCE_PALETTE.find(c=>!used.has(c)) || SOURCE_PALETTE[list.length%SOURCE_PALETTE.length];
    list.push({id:"src"+Date.now().toString(36), name:"Новый источник", note:"", color, currency:"RUB"});
    scheduleSave(); render();
    const inp=sheetRoot().querySelector(`[data-srcname="${list.length-1}"]`);
    if(inp){ inp.focus(); inp.select(); }
  };
}

// ---------- ЛИСТ: РАСХОД ----------
// Форма та же, что была на странице, — со списком, категориями и счетами, —
// только живёт теперь в листе, а не занимает пол-экрана над календарём.

function watchFabScroll(){
  if(window.__fxFabWatch) return;
  window.__fxFabWatch=true;
  let lastY=window.scrollY||0;
  window.addEventListener("scroll", ()=>{
    const y=window.scrollY||0, root=document.documentElement;
    if(y>lastY+6 && y>140) root.classList.add("fab-hide");
    else if(y<lastY-6 || y<140) root.classList.remove("fab-hide");
    lastY=y;
  }, {passive:true});
}

function pnlGoal(){
  const g=DATA.finance.pnlGoal;
  return g && +g.amount>0 ? g : null;
}
// Темп плана на месяц (y, m), если смотреть из дня ref: сколько торговых дней
// прошло и осталось, сколько нужно в день, где по графику должен быть результат.
// День ref считается прошедшим, только если его результат уже записан.
function pnlPlanStatus(y, m, ref){
  const g=pnlGoal();
  if(!g) return null;
  const C=CURRENCY_LIST.includes(g.currency)? g.currency : pnlCurrency();
  const P=pnlMonth(y, m, "all", C);
  const now=ref||new Date();
  const refMonth=ymdOf(now).slice(0,7), monthKey=`${y}-${pad2(m+1)}`;
  const isCur=refMonth===monthKey, past=refMonth>monthKey;
  const refDone=isCur && !!P.days[now.getDate()];
  let total=0, passed=0, left=0;
  for(let d=1; d<=daysInMonth(y,m); d++){
    const dt=new Date(y,m,d);
    if(g.weekdays && isWeekend(dt)) continue;
    total++;
    if(past || (isCur && (d<now.getDate() || (d===now.getDate() && refDone)))) passed++;
    else left++;
  }
  const done=P.total, remaining=g.amount-done;
  const avg=passed? done/passed : 0;
  const expected=total? g.amount*passed/total : 0;
  return {goal:g.amount, cur:C, done, remaining, left, passed, total, isCur, past,
    perDay: left>0 && remaining>0 ? remaining/left : 0,
    expected, diff:done-expected, forecast:done+avg*left, pct:done/g.amount};
}
function renderPnlPlan(y, m){
  const nowMonth=todayStr().slice(0,7), monthKey=`${y}-${pad2(m+1)}`;
  if(monthKey>nowMonth) return "";
  const s=pnlPlanStatus(y, m, new Date());
  if(!s) return monthKey===nowMonth ? `<button class="fx-plan-add" data-pnlgoal="1">◎ Поставить план на месяц — увидишь, сколько нужно в день</button>` : "";
  const money=v=>fmtMoney(v, s.cur, 0);
  const pct=Math.round(s.pct*100);
  const fill=Math.max(0, Math.min(100, s.pct*100));
  const mark=s.isCur && s.total ? s.passed/s.total*100 : null;
  let row="", note="";
  if(s.isCur){
    if(s.remaining<=0) row=`<span class="pos">План выполнен${pct>100? ` на ${pct}%`:""} ✓</span>`;
    else {
      row=`Осталось <b>${money(s.remaining)}</b> — по <b>${money(s.perDay)}</b> в день · ${s.left} ${plural(s.left,'день','дня','дней')}`;
      const tol=s.goal*0.01;
      const pace = !s.passed ? "" : s.diff>=tol ? `<span class="pos">Опережаешь график на ${money(s.diff)}</span>`
        : s.diff<=-tol ? `<span class="neg">Отстаёшь от графика на ${money(-s.diff)}</span>` : "Идёшь ровно по графику";
      note = pace + (s.passed>=3 && pace? ` · прогноз ≈ ${money(s.forecast)}` : "");
    }
  } else {
    row = s.remaining<=0 ? `<span class="pos">План выполнен на ${pct}% ✓</span>` : `Выполнен на ${pct}% · не хватило <b>${money(s.remaining)}</b>`;
  }
  return `<button class="fx-plan" data-pnlgoal="1" aria-label="План на месяц — изменить">
    <div class="fx-plan-top"><span>План <b>${money(s.goal)}</b>${s.isCur? "" : " · был"}</span><span class="pc">${pct}%</span></div>
    <div class="fx-meter plan"><i style="width:${fill.toFixed(1)}%"></i>${mark!=null? `<b style="left:${mark.toFixed(1)}%" title="где нужно быть сегодня"></b>`:""}</div>
    <div class="fx-plan-row">${row}</div>
    ${note? `<div class="fx-plan-note">${note}</div>`:""}
  </button>`;
}

// ---------- капитал источника ----------
// Капитал меняется — довнёс, вывел. История нужна, чтобы прошлые месяцы
// считались от того капитала, что был тогда, а не от сегодняшнего.
function srcCapital(src, key){
  const h=Array.isArray(src.cap)? src.cap : [];
  if(!h.length) return null;
  let x=h[0];
  h.forEach(e=>{ if(!e.from || e.from<=key) x=e; });
  return +x.v>0 ? {v:+x.v, c:x.c||src.currency||"RUB"} : null;
}
function setSrcCapital(src, v){
  const t=todayStr(), c=src.currency||"RUB";
  if(!(v>0)){ delete src.cap; return; }
  // первый раз — на всю историю; правка в тот же день — исправление, а не новая точка
  if(!Array.isArray(src.cap) || !src.cap.length){ src.cap=[{from:"", v, c, at:t}]; return; }
  const last=src.cap[src.cap.length-1];
  if(last.at===t){ last.v=v; last.c=c; return; }
  src.cap.push({from:t, v, c, at:t});
}
function renderSrcCap(x, i){
  const cap=srcCapital(x, todayStr());
  return `<label class="src-cap"><span>Капитал в работе</span>
    <input class="sh-in" data-srccap="${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="не указан" value="${cap? cap.v.toLocaleString('ru-RU',{maximumFractionDigits:2}):""}">
    <b>${CURRENCY_SYMBOL[cap? cap.c : x.currency]||x.currency}</b></label>`;
}
function bindSrcCap(root, list){
  root.querySelectorAll('[data-srccap]').forEach(el=>el.onchange=()=>{
    const x=list[+el.dataset.srccap];
    if(!x) return;

    const v=raw? parseFloat(raw) : 0;
    if(raw && !(isFinite(v) && v>=0)){ flashError(el, "Число, например 10000"); return; }
    setSrcCapital(x, v); scheduleSave(); render();
  });
}

// ---------- комиссия и фандинг у записи ----------
// Сумма записи — чистый итог, он и идёт в баланс. Комиссия и фандинг — для
// разбора: сколько ушло биржам и сколько принёс фандинг.
function incomeNote(e){
  const c=entryCurrency(e), bits=[];
  if(e.comment) bits.push(e.comment);
  if(+e.fee) bits.push(`комиссия ${fmtMoney(+e.fee,c)}`);
  if(+e.fund) bits.push(`фандинг ${+e.fund>0?"+":"−"}${fmtMoney(Math.abs(+e.fund),c)}`);
  return bits.join(" · ");
}

// ---------- разбор месяца ----------
function fmtPct(p, digits){
  const d = digits!=null ? digits : (Math.abs(p)>=10 ? 1 : 2);
  const a=Math.abs(p).toLocaleString('ru-RU', {minimumFractionDigits:0, maximumFractionDigits:d});
  return `${p>0.00005? "+" : p<-0.00005? "−" : ""}${a}%`;
}
function pnlYield(y, m, src){
  const nowKey=todayStr(), monthKey=`${y}-${pad2(m+1)}`;
  const isCur=monthKey===nowKey.slice(0,7);
  const endKey=isCur? nowKey : `${monthKey}-${pad2(daysInMonth(y,m))}`;
  const elapsed=isCur? new Date().getDate() : daysInMonth(y,m);
  const rows=[];
  incomeSources().forEach(s=>{
    if(src && src!=="all" && src!==s.id) return;
    const cap=srcCapital(s, endKey);
    if(!cap) return;
    let v=0;
    const dates=new Set();
    (DATA.finance.entries||[]).forEach(e=>{
      if(e.type!=="доход" || !e.date || e.date.slice(0,7)!==monthKey || entrySource(e)!==s.id) return;
      const x=pnlIn(e, cap.c);
      if(x==null) return;
      v+=x; dates.add(e.date);
    });
    const pct=v/cap.v*100;
    rows.push({s, cap:cap.v, C:cap.c, v, pct, dates, n:dates.size,
      day: dates.size? pct/dates.size : 0, year: elapsed? pct/elapsed*365 : 0});
  });
  let total=null;
  if(rows.length>1){
    const to=pnlCurrency();
    let cap=0, v=0, ok=true;
    const dates=new Set();
    rows.forEach(r=>{
      const c=pnlIn({amount:r.cap, currency:r.C}, to), x=pnlIn({amount:r.v, currency:r.C}, to);
      if(c==null || x==null){ ok=false; return; }
      cap+=c; v+=x; r.dates.forEach(d=>dates.add(d));
    });
    if(ok && cap>0){
      const pct=v/cap*100;
      total={cap, C:to, pct, n:dates.size, day: dates.size? pct/dates.size : 0, year: elapsed? pct/elapsed*365 : 0};
    }
  }
  return {rows, total};
}
function pnlCosts(y, m, src, to){
  const prefix=`${y}-${pad2(m+1)}`;
  let fee=0, fund=0, net=0, n=0, withCosts=0;
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type!=="доход" || !e.date || e.date.slice(0,7)!==prefix) return;
    if(src && src!=="all" && entrySource(e)!==src) return;
    const k=pnlIn({amount:1, currency:entryCurrency(e)}, to);
    if(k==null) return;
    net+=(+e.amount||0)*k; n++;
    if(+e.fee || +e.fund){ withCosts++; fee+=(+e.fee||0)*k; fund+=(+e.fund||0)*k; }
  });
  return {fee, fund, net, gross:net+fee-fund, n, withCosts};
}
// Дни недели: средний результат торгового дня. Шаблоны (зарплата и т. п.) не в счёт —
// они приходят в свой день месяца и исказили бы картину.
function pnlWeekdays(per, src, to){
  let from="", till=todayStr();
  if(per==="month"){ const {y,m}=calMonth(); from=`${y}-${pad2(m+1)}-01`; till=`${y}-${pad2(m+1)}-31`; }
  else if(per==="q") from=ymdOf(new Date(Date.now()-91*86400000));
  const byDate={};
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type!=="доход" || e.recurringId || !e.date || e.date<from || e.date>till) return;
    if(src && src!=="all" && entrySource(e)!==src) return;
    const v=pnlIn(e, to);
    if(v==null) return;
    byDate[e.date]=(byDate[e.date]||0)+v;
  });
  const wd=Array.from({length:7}, ()=>({n:0, sum:0, win:0, avg:0}));
  Object.keys(byDate).forEach(k=>{
    const d=parseLocalDate(k);
    if(!d) return;
    const x=wd[(d.getDay()+6)%7], v=byDate[k];
    x.n++; x.sum+=v; if(v>0.004) x.win++;
  });
  wd.forEach(x=>{ x.avg=x.n? x.sum/x.n : 0; });
  return {wd, days:Object.keys(byDate).length};
}

function yieldSection(Y){
  const head=`<div class="fx-sec-h"><span class="t">Доходность на капитал</span>${Y.rows.length? `<button class="fx-linkbtn" data-fxcap="1">Капитал ›</button>`:""}</div>`;
  if(!Y.rows.length) return `<div class="fx-sec">${head}<div class="fx-cta">
      <span>Укажи, сколько денег в работе у источника, — появится доходность в процентах: за месяц, за торговый день и годовых.</span>
      <button class="fx-linkbtn" data-fxcap="1">Указать капитал ›</button></div></div>`;
  const pc=(p, d)=>`<span class="v ${pnlClass(p)}">${fmtPct(p, d)}</span>`;
  const yd=p=>Math.abs(p)>=100? 0 : 1;
  const rows=Y.rows.map(r=>`<span class="n"><b><i style="background:${r.s.color}"></i>${escapeHtml(r.s.name)}</b>
      <small>${fmtMoney(r.cap, r.C, 0)} · ${r.n} ${plural(r.n,'день','дня','дней')}</small></span>
    ${pc(r.pct)}${pc(r.day)}${pc(r.year, yd(r.year))}`).join("");
  const t=Y.total;
  const tot=t? `<span class="n tot"><b>Всего</b><small>${fmtMoney(t.cap, t.C, 0)}</small></span>
    <span class="v tot ${pnlClass(t.pct)}">${fmtPct(t.pct)}</span><span class="v tot ${pnlClass(t.day)}">${fmtPct(t.day)}</span><span class="v tot ${pnlClass(t.year)}">${fmtPct(t.year, yd(t.year))}</span>` : "";
  return `<div class="fx-sec">${head}
    <div class="yl-grid"><span></span><span class="h">месяц</span><span class="h">в день</span><span class="h">годовых</span>${rows}${tot}</div>
    <div class="fx-hint" style="margin:8px 0 0;">«В день» — в среднем за торговый день. «Годовых» — если весь год идти темпом этого месяца, без реинвестирования.</div>
  </div>`;
}
function costsSection(K, to){
  const head=`<div class="fx-sec-h"><span class="t">Комиссии и фандинг</span></div>`;
  if(!K.withCosts) return `<div class="fx-sec">${head}<div class="fx-cta"><span>У записи результата можно указать комиссию и фандинг — здесь будет видно, сколько съедают комиссии и сколько приносит фандинг.</span></div></div>`;
  const share=K.gross>0.004 ? Math.round(K.fee/K.gross*100) : null;
  const partial=K.withCosts<K.n ? `Учтены ${K.withCosts} из ${K.n} ${plural(K.n,'записи','записей','записей')} — у остальных комиссия не указана.` : "";
  return `<div class="fx-sec">${head}
    <div class="cs-row"><span>Сделки, до комиссий</span><span class="v ${pnlClass(K.gross)}">${fmtPnl(K.gross,to)}</span></div>
    <div class="cs-row"><span>Комиссии</span><span class="v ${K.fee>0.004?'neg':''}">${K.fee>0.004? fmtPnl(-K.fee,to) : "0"}</span></div>
    <div class="cs-row"><span>Фандинг</span><span class="v ${pnlClass(K.fund)}">${Math.abs(K.fund)>0.004? fmtPnl(K.fund,to) : "0"}</span></div>
    <div class="cs-row tot"><span>Итог</span><span class="v ${pnlClass(K.net)}">${fmtPnl(K.net,to)}</span></div>
    ${share!=null || partial? `<div class="cs-note">${share!=null? `Комиссии съели ${share}% заработанного на сделках. ` : ""}${partial}</div>` : ""}
  </div>`;
}
function weekdaySection(W, per, to){
  const seg=`<div class="seg fx-seg">${[["month","Месяц"],["q","3 мес"],["all","Всё время"]].map(([k,l])=>
    `<button class="${per===k?'active':''}" data-wdper="${k}">${l}</button>`).join("")}</div>`;
  const head=`<div class="fx-sec-h"><span class="t">Дни недели</span>${seg}</div>`;
  if(!W.days) return `<div class="fx-sec">${head}<div class="fx-cta"><span>За этот период результатов нет.</span></div></div>`;
  const maxPos=Math.max(0, ...W.wd.map(x=>x.n? x.avg : 0));
  const maxNeg=Math.max(0, ...W.wd.map(x=>x.n? -x.avg : 0));
  const H=80, span=(maxPos+maxNeg)||1;
  const posH=Math.round(H*maxPos/span), negH=H-posH;
  const sel=cur.wdSel!=null && W.wd[cur.wdSel] ? cur.wdSel : null;
  const cols=W.wd.map((x,i)=>{
    const up=x.n && x.avg>0.004 ? Math.max(2, Math.round(x.avg/span*H)) : 0;
    const dn=x.n && x.avg<-0.004 ? Math.max(2, Math.round(-x.avg/span*H)) : 0;
    return `<button class="wd-col ${sel===i?'sel':''}" data-wdsel="${i}" aria-label="${WEEKDAYS_FULL[i]}: ${x.n? fmtPnl(x.avg,to,0)+" в среднем" : "нет данных"}">
      <span class="wd-z up" style="height:${posH}px">${up? `<i style="height:${up}px"></i>`:""}</span>
      ${negH? `<span class="wd-z dn" style="height:${negH}px">${dn? `<i style="height:${dn}px"></i>`:""}</span>`:""}
      <span class="v">${x.n? shortPnl(x.avg) : "—"}</span>
      <span class="k">${WEEKDAYS[i]}</span>
      <span class="c">${x.n? `${x.win}/${x.n}` : ""}</span>
    </button>`;
  }).join("");
  let say;
  if(sel!=null){
    const x=W.wd[sel];
    say = x.n ? `<b>${capFirst(WEEKDAYS_FULL[sel])}</b>: в среднем ${fmtPnl(x.avg,to,0)} за день, всего ${fmtPnl(x.sum,to,0)} за ${x.n} ${plural(x.n,'день','дня','дней')}, в плюсе ${x.win} из ${x.n}.`
      : `<b>${capFirst(WEEKDAYS_FULL[sel])}</b>: за этот период записей нет.`;
  } else {
    const ok=W.wd.map((x,i)=>({...x, i})).filter(x=>x.n>=2);
    if(ok.length>=2){
      const best=ok.slice().sort((a,b)=>b.avg-a.avg)[0], worst=ok.slice().sort((a,b)=>a.avg-b.avg)[0];
      say=`Лучше всего — <b>${WEEKDAYS_FULL[best.i]}</b>: в среднем ${fmtPnl(best.avg,to,0)}, в плюсе ${best.win} из ${best.n}.`;
      if(worst.i!==best.i) say += worst.avg<-0.004
        ? ` В минус чаще уводит <b>${WEEKDAYS_FULL[worst.i]}</b>: ${fmtPnl(worst.avg,to,0)} в среднем.`
        : ` Слабее всего — <b>${WEEKDAYS_FULL[worst.i]}</b>: ${fmtPnl(worst.avg,to,0)}.`;
    } else say="Пока мало данных: нужно хотя бы по два торговых дня на день недели. Можно взять период длиннее.";
  }
  return `<div class="fx-sec">${head}
    <div class="wd-chart">${cols}</div>
    <div class="wd-say">${say}</div>
    <div class="fx-hint" style="margin:6px 0 0;">Столбик — средний результат торгового дня, под ним — сколько дней в плюсе. Нажми на день — подробнее.</div>
  </div>`;
}
function renderPnlInsights(){

// ═════════ ЛИСТ СНИЗУ ═════════
// Ввод и правка переехали из длинных форм на странице в лист, который выезжает
// снизу: на странице остаётся то, на что смотрят, а не то, что заполняют.
// Лист живёт в своём корне вне #app. Перерисовывается он вместе со страницей
// (иначе устаревал бы после каждого действия), но поля в нём синхронизируются с
// черновиком на каждый ввод, а фокус и курсор восстанавливаются.
function sheetRoot(){
  let r=document.getElementById("sheetRoot");
  if(!r){ r=document.createElement("div"); r.id="sheetRoot"; document.body.appendChild(r); }
  return r;
}
function openSheet(s){ cur.sheet=s; renderSheet(); }
function closeSheet(){
  const r=sheetRoot();
  const was=cur.sheet;
  cur.sheet=null;
  document.documentElement.classList.remove("sheet-open");
  const wrap=r.querySelector(".sheet-wrap");
  if(wrap){
    r.dataset.closing="1";
    wrap.classList.remove("in");
    const sh=wrap.querySelector(".sheet");
    if(sh){ sh.style.transition=""; sh.style.transform=""; }
    setTimeout(()=>{ if(!cur.sheet && r.dataset.closing==="1"){ r.innerHTML=""; delete r.dataset.closing; } }, 300);
  }
  if(was && was.kind==="news") markNewsSeen();
  if(was && was.kind==="listen" && !was.done) voiceCancel();
  if(was && was.kind==="workout"){ dropEmptyWorkout(was.id); render(); }
  if(was && (was.scope==="acc" || was.scope==="sav" || was.scope==="inv")) render();
  // снять подсветку выбранного дня; из карточки пункта — показать правки в списке
  if(was && (was.scope==="fin" || was.kind==="doitem")) render();
}
function renderSheet(){
  const r=sheetRoot();
  const s=cur.sheet;
  if(!s){
    if(r.dataset.closing!=="1") r.innerHTML="";
    document.documentElement.classList.remove("sheet-open");
    return;
  }
  const prev=r.dataset.closing==="1" ? null : r.querySelector(".sheet-wrap");
  delete r.dataset.closing;
  const opening=!prev;
  // лист мог ещё не доехать: тогда перерисовка не должна обрывать выезд
  const wasIn=!!(prev && prev.classList.contains("in"));
  const prevSheet=prev && prev.querySelector(".sheet");
  const scroll=prevSheet ? prevSheet.scrollTop : 0;
  const active=document.activeElement;
  const activeId=active && active.id && r.contains(active) ? active.id : "";
  let caret=null;
  try{ if(activeId && active.selectionStart!=null) caret=[active.selectionStart, active.selectionEnd]; }catch(e){}

  let body="";
  if(s.kind==="day") body=renderDaySheet(s);
  else if(s.kind==="sources") body=renderSourcesSheet(s);
  else if(s.kind==="exp") body=renderExpenseSheet(s);
  else if(s.kind==="assign") body=renderAssignSheet(s);
  else if(s.kind==="news") body=renderNewsSheet(s);
  else if(s.kind==="listen") body=renderListenSheet(s);
  else if(s.kind==="voicehelp") body=renderVoiceHelpSheet(s);
  else if(s.kind==="masktip") body=renderMaskTipSheet(s);
  else if(s.kind==="doitem") body=renderDoItemSheet(s);
  else if(s.kind==="pnlgoal") body=renderGoalSheet(s);
  else if(s.kind==="sleep") body=renderSleepSheet(s);
  else if(s.kind==="workout") body=renderWorkoutSheet(s);
  else if(s.kind==="acc") body=renderAccSheet(s);
  else if(s.kind==="trf") body=renderTrfSheet(s);
  else if(s.kind==="savent") body=renderSavEntrySheet(s);
  else if(s.kind==="quick") body=renderQuickSheet(s);
  else if(s.kind==="event") body=renderEventSheet(s);
  else if(s.kind==="mode") body=renderModeSheet(s);
  else if(s.kind==="modeedit") body=renderModeEditSheet(s);
  else if(s.kind==="shot") body=renderShotSheet(s);
  else if(s.kind==="bankinbox") body=renderBankInboxSheet(s);
  else if(s.kind==="receipt") body=renderReceiptSheet(s);
  else if(s.kind==="dayphrase") body=renderDayPhraseSheet(s);
  else if(s.kind==="inv") body=renderInvSheet(s);
  else if(s.kind==="planitem") body=renderPlanItemSheet(s);
  else if(s.kind==="plancats") body=renderPlanCatsSheet(s);
  else if(s.kind==="goaledit") body=renderGoalEditSheet(s);

  r.innerHTML=`<div class="sheet-wrap ${wasIn?'in':''}">
      <div class="sheet-back" data-shclose="1"></div>
      <div class="sheet" role="dialog" aria-modal="true"><div class="sh-grab"></div>${body}</div>
    </div>`;
  document.documentElement.classList.add("sheet-open");
  const sheet=r.querySelector(".sheet");
  if(!wasIn){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const w=r.querySelector(".sheet-wrap");
      if(w && cur.sheet) w.classList.add("in");
    }));
  }
  if(!opening) sheet.scrollTop=scroll;
  r.querySelectorAll("[data-shclose]").forEach(b=>b.onclick=closeSheet);
  bindSheetDrag(sheet);

  // фокус возвращаем до привязки: если лист сам решит, куда его поставить
  // (например, в сумму после записи), его решение должно победить
  if(activeId && !opening){
    const el=document.getElementById(activeId);
    if(el && document.activeElement!==el){
      try{ el.focus({preventScroll:true}); if(caret) el.setSelectionRange(caret[0], caret[1]); }catch(e){}
    }
  }

  if(s.kind==="day") bindDaySheet(s);
  else if(s.kind==="sources") bindSourcesSheet(s);
  else if(s.kind==="exp") bindExpenseSheet(s);
  else if(s.kind==="assign") bindAssignSheet(s);
  else if(s.kind==="news") bindNewsSheet(s);
  else if(s.kind==="listen") bindListenSheet(s);
  else if(s.kind==="voicehelp") bindVoiceHelpSheet(s);
  else if(s.kind==="masktip") bindMaskTipSheet(s);
  else if(s.kind==="doitem") bindDoItemSheet(s);
  else if(s.kind==="pnlgoal") bindGoalSheet(s);
  else if(s.kind==="sleep") bindSleepSheet(s);
  else if(s.kind==="workout") bindWorkoutSheet(s);
  else if(s.kind==="acc") bindAccSheet(s);
  else if(s.kind==="trf") bindTrfSheet(s);
  else if(s.kind==="savent") bindSavEntrySheet(s);
  else if(s.kind==="quick") bindQuickSheet(s);
  else if(s.kind==="event") bindEventSheet(s);
  else if(s.kind==="mode") bindModeSheet(s);
  else if(s.kind==="modeedit") bindModeEditSheet(s);
  else if(s.kind==="shot") bindShotSheet(s);
  else if(s.kind==="bankinbox") bindBankInboxSheet(s);
  else if(s.kind==="receipt") bindReceiptSheet(s);
  else if(s.kind==="dayphrase") bindDayPhraseSheet(s);
  else if(s.kind==="inv") bindInvSheet(s);
  else if(s.kind==="planitem") bindPlanItemSheet(s);
  else if(s.kind==="plancats") bindPlanCatsSheet(s);
  else if(s.kind==="goaledit") bindGoalEditSheet(s);
}
// Лист можно смахнуть вниз за шапку — как любой лист в Android
function bindSheetDrag(sheet){
  if(!sheet) return;
  const handles=[sheet.querySelector(".sh-grab"), sheet.querySelector(".sh-head")].filter(Boolean);
  let y0=null, dy=0;
  const start=e=>{
    if(sheet.scrollTop>2 || !e.touches || e.touches.length!==1) return;
    y0=e.touches[0].clientY; dy=0; sheet.style.transition="none";
  };
  const move=e=>{
    if(y0==null) return;
    dy=Math.max(0, e.touches[0].clientY-y0);
    sheet.style.transform=`translateY(${dy}px)`;
  };
  const end=()=>{
    if(y0==null) return;
    y0=null;
    sheet.style.transition="";
    if(dy>90){ sheet.style.transform="translateY(104%)"; closeSheet(); }
    else sheet.style.transform="";
  };
  handles.forEach(h=>{
    h.addEventListener("touchstart", start, {passive:true});
    h.addEventListener("touchmove", move, {passive:true});
    h.addEventListener("touchend", end);
    h.addEventListener("touchcancel", end);
  });
}
function afterRender(){
  const onFin = cur.tab==="money" && subView("money")==="finance";
  if(!onFin) document.documentElement.classList.remove("has-fab");
  if(cur.sheet && cur.sheet.scope==="fin" && !onFin) cur.sheet=null;
  if(cur.sheet && cur.sheet.scope==="acc" && !(cur.tab==="money" && subView("money")==="where")) cur.sheet=null;
  if(cur.sheet && cur.sheet.scope==="sav" && !(cur.tab==="money" && subView("money")==="savings")) cur.sheet=null;
  if(cur.sheet && cur.sheet.scope==="inv" && !(cur.tab==="money" && subView("money")==="invest")) cur.sheet=null;
  const r=document.getElementById("sheetRoot");
  if(cur.sheet || (r && r.innerHTML && r.dataset.closing!=="1")) renderSheet();
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && cur.sheet){ e.preventDefault(); closeSheet(); } });

// Кнопка «назад» на Android. Раньше она листала историю WebView — и после
// применения обновления возвращала на СТАРУЮ страницу. Теперь история чистится
// оболочкой, а «назад» закрывает лист, потом ведёт на «Сегодня», потом
// сворачивает приложение.
window.onAndroidBack=function(){
  if(cur.sheet){ closeSheet(); return true; }
  if(cur.tab!=="today"){ cur.tab="today"; render(); window.scrollTo(0,0); return true; }
  return false;
};
