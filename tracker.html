  "привези забронируй запишись сдай получи верни отдай реши обсуди созвонись договорись купите позвоните сделайте").split(" "));
// похожие на инфинитив, но не глаголы: числа, наречия, существительные на -ть
const TODO_NOT_VERBS=new Set(("пять девять десять опять мать кровать печать благодать рать зять сеть треть плеть клеть нить "+
  "путь суть ртуть жуть муть прыть чуть пусть знать").split(" "));
// после них инфинитив — продолжение того же действия, а не новое дело:
// «сходить купить», «не забыть позвонить», «попросить маму купить»
const TODO_GLUE=new Set(("не ни бы чтобы чтоб как где куда зачем что если пока когда перед после можно нельзя надо нужно "+
  "пора хочу хочется буду будет будем начать стать успеть забыть пойти сходить съездить поехать попробовать постараться "+
  "решить мочь могу смогу дать давай идти пойду поеду заехать зайти забежать стоит лучше хотел хотела собирался "+
  "собиралась обязательно срочно просто тоже и а или то").split(" "));
const TODO_CONTROL=new Set(("попросить попроси сказать скажи напомнить напомни уговорить заставить помочь помоги разрешить "+
  "предложить научить велеть пригласить позвать позови отпустить").split(" "));
const TODO_PREPS=new Set("в во на к ко за у из от до по с со для про о об".split(" "));
function todoWordKey(w){ return String(w||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9-]/g,""); }
function isVerbWord(w){
  const x=todoWordKey(w).replace(/-/g,"");
  if(x.length<3 || /[a-z0-9]/.test(x)) return false;
  if(TODO_IMPERATIVES.has(x)) return true;
  if(TODO_NOT_VERBS.has(x) || /(надцать|дцать)$/.test(x)) return false;
  const b=x.replace(/(ся|сь)$/,"");
  if(/(ать|ять|еть|ить|уть|ыть)$/.test(b)) return true;
  if(/(ести|езти|ясти|йти|дти|зти)$/.test(b)) return true;
  if(/асти$/.test(b)) return ["расти","вырасти","нарасти","подрасти","прорасти","спасти","пасти"].includes(b);
  if(/оть$/.test(b)) return ["колоть","полоть","молоть","бороть","пороть","заколоть","уколоть","прополоть","смолоть"].includes(b);

const TODO_LEAD_RE=/^(?:(?:ну|так|значит|короче|в общем|итак|и|а|ещё|еще|также|а также|плюс|потом|затем|дальше|далее|мне|надо бы|нужно бы|надо|нужно|не забыть|не забудь|напомни мне|напомнить мне|напомни|запиши|запомни|добавь|добавить|задача|дело)(?:[\s,:—-]+|$))+/iu;
function splitTodoList(raw){
  let s=" "+String(raw||"").replace(/[«»"]/g,"").replace(/\s+/g," ").trim()+" ";
  // Сказанные вслух разделители. «Запятая» продолжает перечисление — глагол
  // переносится («купить хлеб запятая молоко»), а «потом» начинает новое дело —
  // не переносится («потом в спортзал» не должно стать «забрать в спортзал»).
  s=s.replace(/\s(?:запятая|точка с запятой|а также)(?=[\s,.!?;:]|$)/giu, ",");
  s=s.replace(/\s(?:точка|следующее дело|следующий пункт|следующее|новое дело|новый пункт|дальше|далее|потом|затем|во-первых|во-вторых|в-третьих|в-четв[её]ртых|в-пятых|в-шестых)(?=[\s,.!?;:]|$)/giu, " \u0001 ");

  const pieces=[];
  for(let i=0;i<parts.length;i+=2){
    const text=(parts[i]||"").trim();
    const delim=i>0? parts[i-1] : "";
    if(text) pieces.push({text, list: delim===","||delim===";"});
  }
  const out=[];
  pieces.forEach(({text:p, list})=>{
    // сплошная речь: новое действие — глагол после не-глагола, если это не
    // продолжение («сходить купить», «попросить маму купить»)
    let cur=[], head=null, first=true;
    const flush=()=>{
      const text=cur.join(" ").replace(TODO_LEAD_RE, "").trim();
      if(text) out.push({text, fromList: list && first});
      first=false; cur=[]; head=null;
    };
    p.split(" ").forEach(w=>{
      const verb=isVerbWord(w);

      if(verb && !head) head=w;
      cur.push(w);
    });

  const res=[];

// Разбор целиком: дела с их сроками и приоритетами. Глагол начала перечисления
// переносится на продолжение без глагола («купить хлеб, молоко» → два «купить»),
// а срок и «срочно» из первого дела достаются всем, у кого своих нет:
// «завтра купить хлеб, позвонить маме» — оба на завтра.
function parseTodoList(raw, base){
  let carry=null;
  const items=[];
  (Array.isArray(raw)? raw : splitTodoList(raw)).forEach(p=>{
    let t=parseTodoSpeech(p.text, base);
    if(!t.text) return;
    const w=t.text.split(" ");
    if(isVerbWord(w[0])){
      carry=w[0].toLowerCase();
      if(w[1] && TODO_PREPS.has(todoWordKey(w[1])) && w[2]) carry+=" "+w[1].toLowerCase();
    } else if(p.fromList && carry){
      const lead=TODO_PREPS.has(todoWordKey(w[0])) ? carry.split(" ")[0] : carry;
      t=parseTodoSpeech(lead+" "+p.text, base);
    }
    items.push(t);
  });
  if(items.length>1){
    const f=items[0];
    items.forEach((x,i)=>{
      if(i===0) return;
      if(!x.dueDate && f.dueDate) x.dueDate=f.dueDate;
      if(!x.priority && f.priority) x.priority=f.priority;
    });
  }
  return items;
}

async function voiceAddTodo(btn){
  if(!voiceSupported()){ openSheet({kind:"voicehelp"}); return; }
  if(btn) btn.classList.add("listening");
  let raw="";
  try{ raw=await voiceListen("Что добавить? Можно списком"); }
  catch(e){
    if(btn) btn.classList.remove("listening");
    const msg=e && e.message || "";
    // распознавание пропало (например, отключили Google) — объясняем, что делать
    if(msg==="unavailable"){ voiceKind=""; openSheet({kind:"voicehelp"}); return; }
    if(msg) showBanner("🎤 "+msg);
    return;
  }
  if(btn) btn.classList.remove("listening");
  const res=createFromText(raw, {split:true, voice:true});
  if(!res.habits.length && !res.todos.length && !res.dup.length){ showBanner("🎤 Не расслышал — попробуй ещё раз"); return; }
  scheduleSave(); render();
  createdToast(res);
  // Google спрятал мат звёздочками — показываем, как это выключить (не чаще раза в день)
  if(hasMaskedWords(raw)){
    const st=DATA.settings||(DATA.settings={});
    if(!st.maskTipAt || Date.now()-st.maskTipAt>20*3600*1000){
      st.maskTipAt=Date.now(); scheduleSave();
      setTimeout(()=>openSheet({kind:"masktip"}), 600);
    }
  }
}

  });
  document.querySelectorAll('[data-adel]').forEach(b=>{

      const i=+b.dataset.adel;

      deleteWithUndo(`Счёт «${acc.name}»`, ()=>{

// ---------- SAVINGS ----------
function savMonthKey(){ return `${cur.year}-${cur.monthIdx}`; }
function ensureSavingsGoals(){
  if(!DATA.savingsGoals || !DATA.savingsGoals.length){
    DATA.savingsGoals = [{id:Date.now(), name:"Цель", amount:100000, entries:[], monthlyTargets:{}}];
  }
  DATA.savingsGoals.forEach(g=>{ if(!g.entries) g.entries=[]; if(!g.monthlyTargets) g.monthlyTargets={}; });
  if(cur.savingsGoalIdx==null || cur.savingsGoalIdx>=DATA.savingsGoals.length || cur.savingsGoalIdx<0) cur.savingsGoalIdx=0;
}
function renderSavings(){
  ensureSavingsGoals();
  const goals=DATA.savingsGoals;
  const gi=cur.savingsGoalIdx;
  const g=goals[gi];
  const amount = +g.amount || 0;
  const entries = g.entries || [];
  const collected = entries.reduce((sum,e)=>sum+(+e.amount||0),0);
  const pct = amount? Math.min(100,Math.round(collected/amount*100)):0;
  const remaining = Math.max(0, amount-collected);

  const mPrefix = `${cur.year}-${pad2(cur.monthIdx+1)}`;
  const monthEntries = entries.map((e,i)=>({...e,_i:i}))
    .filter(e=>e.date && e.date.slice(0,7)===mPrefix)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const monthSum = monthEntries.reduce((sum,e)=>sum+(+e.amount||0),0);
  const monthTarget = +((g.monthlyTargets||{})[savMonthKey()]) || 0;
  const monthPct = monthTarget? Math.min(100,Math.round(monthSum/monthTarget*100)) : 0;
  const contribDays = monthEntries.filter(e=>(+e.amount||0)>0).length;
  const avgPerDay = contribDays? Math.round(monthSum/contribDays):0;
  const best = monthEntries.reduce((m,e)=> ((+e.amount||0) > (m?(+m.amount||0):-1)) ? e : m, null);
  const shareOfGoal = amount? Math.round(monthSum/amount*100):0;

  const rows = monthEntries.map(e=>`
    <div class="fin-log-row" style="grid-template-columns:120px 100px 1fr 24px;">
      <input type="date" value="${e.date||''}" data-i="${e._i}" data-f="date">
      <input type="number" value="${e.amount||''}" placeholder="Сумма, ₽" data-i="${e._i}" data-f="amount">
      <input value="${escapeHtml(e.comment||'')}" placeholder="Комментарий (необязательно)" data-i="${e._i}" data-f="comment">
      <button class="del" data-delsav="${e._i}">✕</button>
    </div>`).join("");

  const goalPills=goals.map((gl,i)=>{
    const glAmount=+gl.amount||0;
    const glCollected=(gl.entries||[]).reduce((s,e)=>s+(+e.amount||0),0);
    const glPct=glAmount? Math.min(100,Math.round(glCollected/glAmount*100)):0;
    return `<button class="goal-pill ${i===gi?'active':''}" data-goalpick="${i}">
      <span class="n">${gl.icon||'🎯'} ${escapeHtml(gl.name||'Без названия')}</span><span class="p">${glPct}%</span>
    </button>`;
  }).join("");

  let deadlineHtml="";
  if(g.deadline){
    const today=new Date(); today.setHours(0,0,0,0);
    const dl=new Date(g.deadline+"T00:00:00");
    const daysLeft=Math.ceil((dl-today)/86400000);
    if(remaining<=0){
      deadlineHtml=`<div class="s" style="margin-top:6px;color:var(--green);">Цель уже достигнута 🎉</div>`;
    } else if(daysLeft<=0){
      deadlineHtml=`<div class="s" style="margin-top:6px;color:var(--pink);">Срок (${g.deadline.split('-').reverse().join('.')}) уже прошёл, а осталось отложить ${remaining.toLocaleString('ru-RU')} ₽</div>`;
    } else {
      const perDay=Math.ceil(remaining/daysLeft);
      const perWeek=Math.ceil(remaining/daysLeft*7);
      deadlineHtml=`<div class="s" style="margin-top:6px;">Чтобы успеть к ${g.deadline.split('-').reverse().join('.')} (осталось ${daysLeft} дн.): <b style="color:var(--amber2)">${perDay.toLocaleString('ru-RU')} ₽/день</b> или <b style="color:var(--amber2)">${perWeek.toLocaleString('ru-RU')} ₽/неделю</b></div>`;
    }
  }
  let paceHtml="";
  if(remaining<=0){
    if(!g.deadline) paceHtml=`<div class="s" style="margin-top:6px;color:var(--green);">Цель уже достигнута 🎉</div>`;
  } else {
    const forecast=projectSavingsCompletion(entries, remaining);
    if(forecast){
      const dstr=`${MONTHS_RU[forecast.target.getMonth()].toLowerCase()} ${forecast.target.getFullYear()}`;
      paceHtml=`<div class="s" style="margin-top:6px;">При среднем темпе <b style="color:var(--amber2)">${Math.round(forecast.avgMonthly).toLocaleString('ru-RU')} ₽/мес</b> цель будет достигнута к <b style="color:var(--amber2)">${dstr}</b></div>`;
    } else {
      paceHtml=`<div class="s" style="margin-top:6px;color:var(--grey-dim);">Добавь несколько взносов — тогда сможем спрогнозировать дату</div>`;
    }
  }

  return `<div class="card">
    <h2>Мои цели</h2>
    <div class="goal-pills">${goalPills}</div>
    <div class="add-row" style="margin-top:12px;">
      <input placeholder="Название новой цели..." id="newGoalName">
      <button id="addGoalBtn">+ Добавить цель</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;gap:8px;align-items:flex-end;justify-content:space-between;">
      <div class="savings-goal" style="flex:1;">
        <div style="max-width:70px;"><label>Иконка</label><input id="sIcon" maxlength="4" value="${g.icon||'🎯'}"></div>
        <div><label>Название цели</label><input id="sName" value="${escapeHtml(g.name||'')}"></div>
        <div><label>Сумма цели, ₽</label><input id="sAmount" type="number" value="${g.amount||''}"></div>
        <div><label>Успеть к дате (необязательно)</label><input id="sDeadline" type="date" value="${g.deadline||''}"></div>
      </div>
      ${goals.length>1?`<button class="del" id="delGoalBtn" title="Удалить эту цель" style="font-size:18px;padding:6px 10px;">✕</button>`:''}
    </div>
    <div class="kpi" style="border-top-color:var(--amber);margin:14px 0;">
      <div class="t">Прогресс общий</div><div class="v">${pct}%</div>
      <div class="s">Отложено ${collected.toLocaleString('ru-RU')} ₽ из ${amount.toLocaleString('ru-RU')} ₽ · осталось ${remaining.toLocaleString('ru-RU')} ₽</div>
      <div class="progress-bar"><div class="fill" style="width:${pct}%;background:var(--amber)"></div></div>
      ${deadlineHtml}
      ${paceHtml}
    </div>
    <canvas id="savChart" style="width:100%;height:150px;display:block;"></canvas>
  </div>

  <div class="card">
    ${renderMonthNav()}
    <h2>Отчёт за ${MONTHS_RU[cur.monthIdx]}</h2>
    <div class="savings-goal">
      <div><label>Цель на этот месяц, ₽ (необязательно)</label><input id="sMonthTarget" type="number" value="${monthTarget||''}"></div>
    </div>
    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi" style="border-top-color:var(--green)">
        <div class="t">Собрано за месяц</div><div class="v">${monthSum.toLocaleString('ru-RU')} ₽</div>
        <div class="s">${monthTarget? `${monthPct}% от цели месяца` : (amount? `${shareOfGoal}% от общей цели`:'цель месяца не задана')}</div>
        ${monthTarget? `<div class="progress-bar"><div class="fill" style="width:${monthPct}%;background:var(--green)"></div></div>`:''}
      </div>
      <div class="kpi" style="border-top-color:var(--cyan)">
        <div class="t">Дней с записью</div><div class="v">${contribDays}</div>
        <div class="s">из ${daysInMonth(cur.year,cur.monthIdx)} дней месяца</div>
      </div>
      <div class="kpi" style="border-top-color:var(--purple)">
        <div class="t">Средний взнос</div><div class="v">${avgPerDay.toLocaleString('ru-RU')} ₽</div>
        <div class="s">${best? `лучший день: ${best.date.slice(8,10)}.${best.date.slice(5,7)} — ${(+best.amount||0).toLocaleString('ru-RU')} ₽` : 'пока нет записей'}</div>
      </div>
    </div>
    <h2>Записи за месяц</h2>
    <div id="savRows">${rows || '<div class="empty">Пока нет записей за этот месяц</div>'}</div>
    <button class="btn" id="addSav" style="margin-top:8px;">+ Отложить в «${g.icon||'🎯'} ${escapeHtml(g.name||'эту цель')}»</button>
  </div>`;
}
function bindSavings(){
  const g=DATA.savingsGoals[cur.savingsGoalIdx];
  const entries=(g.entries||[]).slice()
    .filter(e=>e.date)
    .sort((a,b)=>a.date.localeCompare(b.date));
  let running=0;
  const cumLabels=entries.map(e=>e.date.slice(5).split('-').reverse().join('.'));
  const cumValues=entries.map(e=>{ running+=(+e.amount||0); return running; });
  if(cumValues.length){
    drawLineArea("savChart", cumLabels, cumValues, cssVar("--amber"), cssVar("--amber"), +g.amount||0);
  } else {
    const canvas=document.getElementById("savChart");
    if(canvas){ const {ctx,W,H}=setupCanvas(canvas);
      ctx.fillStyle=cssVar("--grey-dim"); ctx.font="12px Inter,system-ui,sans-serif"; ctx.textAlign="center";
      ctx.fillText("Добавь первую запись, чтобы увидеть график", W/2, H/2); }
  }
  document.querySelectorAll('[data-goalpick]').forEach(b=>{
    b.onclick=()=>{ cur.savingsGoalIdx=+b.dataset.goalpick; render(); };
  });
  const addGoalBtn=document.getElementById("addGoalBtn");
  if(addGoalBtn) addGoalBtn.onclick=()=>{
    const inp=document.getElementById("newGoalName");
    const name=inp.value.trim();
    if(!name){ flashError(inp,"Введи название цели"); return; }
    DATA.savingsGoals.push({id:Date.now(), name, amount:0, entries:[], monthlyTargets:{}});
    cur.savingsGoalIdx=DATA.savingsGoals.length-1;
    scheduleSave(); render();
  };
  const delGoalBtn=document.getElementById("delGoalBtn");
  if(delGoalBtn) delGoalBtn.onclick=()=>{
    if(DATA.savingsGoals.length<=1) return;
    if(delGoalBtn.dataset.confirming){
      const gname=(DATA.savingsGoals[cur.savingsGoalIdx]||{}).name||"цель";
      deleteWithUndo(`Цель «${gname}»`, ()=>{
        DATA.savingsGoals.splice(cur.savingsGoalIdx,1);
        cur.savingsGoalIdx=0;
      });
      return;
    }
    delGoalBtn.dataset.confirming="1"; delGoalBtn.textContent="точно?";
    setTimeout(()=>{ if(delGoalBtn.dataset){ delete delGoalBtn.dataset.confirming; delGoalBtn.textContent="✕"; } }, 2600);
  };
  document.getElementById("sName").onchange=(e)=>{ g.name=e.target.value; scheduleSave(); render(); };
  document.getElementById("sAmount").onchange=(e)=>{ g.amount=e.target.value; scheduleSave(); render(); };
  document.getElementById("sIcon").onchange=(e)=>{ g.icon=e.target.value.trim()||'🎯'; scheduleSave(); render(); };
  document.getElementById("sDeadline").onchange=(e)=>{ g.deadline=e.target.value; scheduleSave(); render(); };
  const mTargetInp=document.getElementById("sMonthTarget");
  if(mTargetInp) mTargetInp.onchange=()=>{
    if(!g.monthlyTargets) g.monthlyTargets={};
    g.monthlyTargets[savMonthKey()] = mTargetInp.value;
    scheduleSave(); render();
  };
  document.querySelectorAll('#savRows input').forEach(el=>{
    el.onchange=()=>{
      const i=+el.dataset.i, f=el.dataset.f;
      g.entries[i][f]=el.value; scheduleSave(); render();
    };
  });
  document.querySelectorAll('[data-delsav]').forEach(b=>{
    b.onclick=()=>{ deleteWithUndo('Взнос', ()=>g.entries.splice(+b.dataset.delsav,1)); };
  });
  document.getElementById("addSav").onclick=()=>{
    g.entries = g.entries || [];
    const dom=Math.min(new Date().getDate(), daysInMonth(cur.year,cur.monthIdx));
    const dt=`${cur.year}-${pad2(cur.monthIdx+1)}-${pad2(dom)}`;
    g.entries.push({date:dt, amount:"", comment:""});
    scheduleSave(); render();
  };
}

// ═════════ НАКОПЛЕНИЯ ═════════
// Раньше раздел открывался формой редактирования цели (иконка, название, сумма,
// дата), а прогресс был ниже. Теперь сверху — цели с кольцами, у выбранной —
// крупное кольцо, прогноз и «+ Отложить»; правка — листом снизу.
function goalCollected(g){ return (g.entries||[]).reduce((s,e)=>s+(+e.amount||0),0); }
function goalPct(g){ const a=+g.amount||0; return a? Math.max(0, Math.min(100, Math.round(goalCollected(g)/a*100))) : 0; }
function goalPaceHtml(g){
  const amount=+g.amount||0, collected=goalCollected(g), remaining=Math.max(0, amount-collected);
  if(!amount) return `<div class="sv-pace">Сумма цели не задана — нажми «Изменить».</div>`;
  if(remaining<=0) return `<div class="sv-pace ok">Цель достигнута 🎉</div>`;
  const out=[];
  if(g.deadline){
    const today=new Date(); today.setHours(0,0,0,0);
    const dl=parseLocalDate(g.deadline);
    const days=dl? Math.ceil((dl-today)/86400000) : 0;
    const dlTxt=dl? `${dl.getDate()} ${MONTHS_GEN[dl.getMonth()]} ${dl.getFullYear()}` : g.deadline;
    if(days<=0) out.push(`<span class="late">Срок ${dlTxt} прошёл</span>, осталось <b>${fmtRub(remaining)}</b>.`);
    else {
      const perMonth=Math.ceil(remaining/days*30.4);
      out.push(`Чтобы успеть к ${dlTxt}: по <b>${fmtRub(perMonth)}</b> в месяц (${days} ${plural(days,'день','дня','дней')}).`);
    }
  }
  const f=projectSavingsCompletion(g.entries||[], remaining);
  if(f) out.push(`В среднем темпе ${fmtRub(f.avgMonthly)} в месяц — к <b>${MONTHS_DAT[f.target.getMonth()]} ${f.target.getFullYear()}</b>.`);
  else if(!g.deadline) out.push(`Отложи пару раз — появится прогноз, когда соберёшь.`);
  return `<div class="sv-pace">${out.join(" ")}</div>`;
}

      <span class="sv-ring sm" style="--p:${goalPct(x)}"><span>${x.icon||'🎯'}</span></span>

    <div class="sv-month" style="margin-top:12px;">За месяц <b>${fmtRub(monthSum)}</b>${mTarget? ` из плана ${fmtRub(mTarget)} — ${Math.round(monthSum/mTarget*100)}%` : ""}${monthEntries.length? ` · ${monthEntries.length} ${plural(monthEntries.length,'взнос','взноса','взносов')}` : ""}</div>
    ${mTarget? `<div class="hb2-meter"><i style="width:${Math.max(0,Math.min(100,Math.round(monthSum/mTarget*100)))}%"></i></div>` : ""}
    ${monthEntries.length? monthEntries.map(({e,i})=>{
      const d=parseLocalDate(e.date), v=+e.amount||0;
      return `<button class="fx-row" data-savopen="${i}">
        <i class="dot" style="background:${v<0? 'var(--pink)' : 'var(--amber)'}"></i>

        <span class="a ${v<0?'neg':'pos'}">${v<0? "−" : "+"}${fmtRub(Math.abs(v))}</span>

  return `<div class="card" style="padding-top:12px;padding-bottom:12px;">${pills}</div>` + hero + hist;

// ═════════ НАСТРОЙКИ: РАЗДЕЛЫ ═════════
// Раньше — пять экранов карточек подряд. Теперь — список разделов с состоянием;
// раздел раскрывается по нажатию. Карточки и их кнопки те же: свёрнутые просто
// скрыты, поэтому всё, что к ним привязано, продолжает работать.
function settingsSummary(title){
  try{
    if(title.includes("Уведомления")) return notifyNative()? (notifyOn()? "включены" : "выключены — включи") : (isNativeShell()? "нужно приложение 2.3+" : "что и когда присылать");
    if(title.includes("Внешний вид")){ const th=(GLASS_THEMES||[]).find(x=>x[0]===appearance().glass); return th? `«Стекло» · ${th[1]}` : "темы «Стекла»"; }
    if(title.includes("Утренняя сводка")) return "бот в Telegram";
    if(title.includes("Банк")){ const st=bankStatus(); return !st? (isNativeShell()? `нужно приложение ${LATEST_APP.version}` : "траты из банка, чеки") : st.granted? "траты пишутся сами" : "выключено — включи"; }
    if(title.includes("Голос")) return voiceSupported()? "распознавание работает" : "нечем распознавать";
    if(title.includes("Прогресс")) return "привычки и тренировки по месяцам";
    if(title.includes("Данные")){ const t=+DATA._lastBackup||0; if(!t) return "бэкапа ещё не было"; const n=Math.floor((Date.now()-t)/86400000); return n<=0? "бэкап сегодня" : `бэкап ${n} ${plural(n,'день','дня','дней')} назад`; }
    if(title.includes("облаке")) return "копии через бот";
    if(title.includes("Обновления")) return `сборка ${(currentBuild()||"").slice(0,16)}`;
  }catch(e){}
  return "";
}
function collapseSettings(c){
  // голые блоки (плитки сводки) — в следующую карточку, под её заголовок
  let pending=[];
  [...c.children].forEach(el=>{
    if(!el.classList.contains("card")){ pending.push(el); return; }
    if(pending.length){ const h=el.querySelector(':scope > h2'); pending.forEach(p=> h? h.after(p) : el.prepend(p)); pending=[]; }
  });
  const open=cur.setOpen||"";
  [...c.children].filter(el=>el.classList.contains("card")).forEach(card=>{
    const h=card.querySelector(':scope > h2');
    if(!h) return;
    const raw=h.textContent.replace(/\s*·.*$/,"").trim();
    const m=raw.match(/^([^\p{L}\p{N}]+)\s*(.*)$/u);
    const title=m? m[2].trim() : raw;
    const icon=(m && m[1].trim()) || (title.includes("Прогресс")? "📊" : "•");
    h.classList.add("set-title");
    card.classList.add("set-card");
    if(open!==title) card.classList.add("closed");
    const head=document.createElement("button");
    head.className="set-head";
    head.innerHTML=`<span class="i">${escapeHtml(icon||"•")}</span><span class="t"><b>${escapeHtml(title)}</b>${settingsSummary(raw)? `<small>${escapeHtml(settingsSummary(raw))}</small>` : ""}</span><span class="chev">›</span>`;
    head.onclick=()=>{
      cur.setOpen = cur.setOpen===title ? "" : title;
      render();
      if(cur.setOpen){ const t=[...document.querySelectorAll('.set-card:not(.closed)')][0]; if(t) t.scrollIntoView({block:"start"}); window.scrollBy(0,-8); }
    };
    card.prepend(head);
  });
}

  XMR:"monero",SHIB:"shiba-inu",PEPE:"pepe",ARB:"arbitrum",OP:"optimism",APT:"aptos",SUI:"sui",
  NEAR:"near",BCH:"bitcoin-cash",ETC:"ethereum-classic",FIL:"filecoin",ICP:"internet-computer",
  XLM:"stellar",HBAR:"hedera-hashgraph",ALGO:"algorand",VET:"vechain",INJ:"injective-protocol",

const INV_KINDS=[["crypto","Криптовалюта"],["deposit","Вклад"],["other","Другое"]];
const INV_CURRENCIES=["RUB","USD","USDT"];
const PRICE_TTL=10*60*1000;
let pricesLoading=false;

function ensureInvestments(){
  if(!Array.isArray(DATA.investments)) DATA.investments=[];
  if(!DATA.prices || typeof DATA.prices!=="object") DATA.prices={updated:0, usdRub:0, eurRub:0, usd:{}, rub:{}, src:""};
  if(!DATA.prices.usd) DATA.prices.usd={};
  if(!DATA.prices.rub) DATA.prices.rub={};
}
function coinId(sym){
  const s=(sym||"").trim().toUpperCase();
  return CRYPTO_IDS[s] || (sym||"").trim().toLowerCase();
}
function cryptoSymbols(){
  const set={};
  (DATA.investments||[]).forEach(i=>{
    if(i.kind==="crypto" && i.symbol) set[i.symbol.trim().toUpperCase()]=1;
  });
  return Object.keys(set);
}
async function refreshPrices(force){
  ensureInvestments();
  if(pricesLoading) return;
  if(typeof fetch!=="function") return;
  const now=Date.now();
  if(!force){
    if(!needsRates()) return;
    if(DATA.prices.updated && now-DATA.prices.updated<PRICE_TTL) return;
    if(cur.lastPriceTry && now-cur.lastPriceTry<60000) return;
  }
  cur.lastPriceTry=now;
  const syms=cryptoSymbols();
  pricesLoading=true; cur.pricesError="";
  if(force) render();
  // Rapira спрашиваем параллельно: её курс USDT нужен, даже если CoinGecko лёг
  const rapira = nativeHttp() ? fetchRapiraUsdt().catch(()=>null) : Promise.resolve(null);
  try{
    const idSet={}; syms.forEach(s=>{ idSet[coinId(s)]=1; }); idSet["tether"]=1;
    const ids=Object.keys(idSet).filter(Boolean);
    const url=`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(ids.join(","))}&vs_currencies=usd,rub,eur`;
    const r=await fetch(url);
    if(!r.ok) throw new Error("coingecko "+r.status);
    const j=await r.json();
    const usd={}, rub={};
    syms.forEach(s=>{
      const d=j[coinId(s)];
      if(!d) return;
      if(d.usd!=null) usd[s]=d.usd;
      if(d.rub!=null) rub[s]=d.rub;
    });
    if(j.tether && j.tether.rub){
      DATA.prices.usdRub=j.tether.rub;
      // no direct EUR/RUB endpoint here, so cross it through USDT
      if(j.tether.eur) DATA.prices.eurRub=j.tether.rub/j.tether.eur;
    }
    if(syms.length && !Object.keys(usd).length && !Object.keys(rub).length) throw new Error("empty");
    DATA.prices.usd=usd; DATA.prices.rub=rub;
    DATA.prices.updated=Date.now(); DATA.prices.src="CoinGecko";
  }catch(e){
    try{ await refreshPricesFallback(syms); }
    catch(e2){ cur.pricesError="Не удалось получить цены — показаны последние сохранённые"; }
  }
  const rp=await rapira;
  if(rp){
    DATA.prices.usdtRub=rp.rate; DATA.prices.usdtBid=rp.bid; DATA.prices.usdtAsk=rp.ask;
    DATA.prices.usdtSrc="Rapira"; DATA.prices.usdtAt=Date.now();
    if(DATA.prices.rub) DATA.prices.rub.USDT=rp.rate;
  }
  pricesLoading=false;
  scheduleSave();
  render();
}
async function refreshPricesFallback(syms){
  const usd={}, rub={};
  let usdRub=DATA.prices.usdRub||0;
  try{
    const cb=await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
    const cj=await cb.json();
    if(cj && cj.Valute && cj.Valute.USD && cj.Valute.USD.Value) usdRub=cj.Valute.USD.Value;
    if(cj && cj.Valute && cj.Valute.EUR && cj.Valute.EUR.Value) DATA.prices.eurRub=cj.Valute.EUR.Value;
  }catch(e){}
  for(const s of syms){
    if(s==="USDT"||s==="USDC"||s==="DAI"){ usd[s]=1; continue; }
    try{
      const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${encodeURIComponent(s)}USDT`);
      if(!r.ok) continue;
      const j=await r.json();
      if(j && j.price) usd[s]=parseFloat(j.price);
    }catch(e){}
  }
  if(syms.length && !Object.keys(usd).length) throw new Error("no prices");
  if(usdRub) Object.keys(usd).forEach(s=>{ rub[s]=usd[s]*usdRub; });
  DATA.prices.usd=usd; DATA.prices.rub=rub; DATA.prices.usdRub=usdRub;
  DATA.prices.updated=Date.now(); DATA.prices.src="Binance / ЦБ РФ";
}
// Simple interest by default; monthly compounding when "с капитализацией" is on.
// Accrual stops at the end of the term, so a matured deposit shows its final sum.
function depositState(inv){
  const amount=+inv.amount||0, rate=+inv.rate||0;
  const open=parseLocalDate(inv.openDate)||new Date();
  const term=+inv.termMonths||0;
  const end=term? addMonthsToDate(open, term) : null;
  const now=new Date();
  const stop=(end && now>end)? end : now;
  const daysHeld=Math.max(0,(stop.getTime()-open.getTime())/86400000);
  const grow=days=>{
    if(!amount) return 0;
    if(inv.capitalize) return amount*Math.pow(1+rate/100/12, days/30.4375);
    return amount*(1+rate/100*days/365);
  };
  const totalDays=end? Math.max(0,(end.getTime()-open.getTime())/86400000) : daysHeld;
  const current=grow(daysHeld);
  return {amount, current, atEnd:grow(totalDays), end,
    daysHeld:Math.round(daysHeld),
    daysLeft: end? Math.max(0, Math.round((end.getTime()-now.getTime())/86400000)) : null,
    interest: current-amount, matured: !!(end && now>=end)};
}
function toRub(amount, currency){
  if(!currency || currency==="RUB") return amount;
  if(currency==="EUR") return amount*(+DATA.prices.eurRub||0);
  return amount*(rateToRub(currency)||0);
}
function invValueRub(inv){
  if(inv.kind==="crypto"){
    const s=(inv.symbol||"").trim().toUpperCase();
    const qty=+inv.qty||0;
    if(DATA.prices.rub[s]!=null) return qty*DATA.prices.rub[s];
    if(DATA.prices.usd[s]!=null) return toRub(qty*DATA.prices.usd[s], "USD");
    return 0;
  }
  if(inv.kind==="deposit") return toRub(depositState(inv).current, inv.currency);
  return toRub(+inv.amount||0, inv.currency);
}
function invInvestedRub(inv){
  if(inv.kind==="crypto") return toRub((+inv.qty||0)*(+inv.buyPrice||0), "USD");
  if(inv.kind==="deposit") return toRub(+inv.amount||0, inv.currency);
  return toRub(+inv.invested||0, inv.currency);
}
// Portfolio figures are computed in roubles internally; this renders them in
// whichever currency the switcher is on (roubles when it's set to "as is").
function rub(n, digits){
  const disp=displayCurrency();
  const target = disp==="native" ? "RUB" : disp;
  const v = target==="RUB" ? (+n||0) : convertMoney(+n||0, "RUB", target);
  if(v==null) return `${(+n||0).toLocaleString('ru-RU',{maximumFractionDigits: digits==null?0:digits})} ₽`;
  return fmtMoney(v, target, digits==null?0:digits);
}
function plSpan(pl, base){
  const pct=base? pl/base*100 : 0;
  const cls=pl>=0? "pos":"neg";
  const sign=pl>=0? "+":"−";
  return `<span class="inv-pl ${cls}">${sign}${rub(Math.abs(pl))}${base? ` (${sign}${Math.abs(pct).toLocaleString('ru-RU',{maximumFractionDigits:1})}%)`:""}</span>`;
}

function bindInvest(){
  document.querySelectorAll('[data-ii][data-if]').forEach(el=>{
    el.onchange=()=>{
      const i=+el.dataset.ii, f=el.dataset.if;
      if(!DATA.investments[i]) return;
      DATA.investments[i][f]= f==="symbol"? el.value.trim().toUpperCase() : el.value;
      if(f==="symbol"){ scheduleSave(); refreshPrices(true); return; }
      scheduleSave(); render();
    };
  });
  document.querySelectorAll('[data-ii][data-ifchk]').forEach(el=>{
    el.onchange=()=>{
      const i=+el.dataset.ii;
      if(!DATA.investments[i]) return;
      DATA.investments[i][el.dataset.ifchk]=el.checked;
      scheduleSave(); render();
    };
  });
  document.querySelectorAll('[data-invdel]').forEach(b=>{
    b.onclick=()=>{
      const inv=DATA.investments[+b.dataset.invdel]||{};
      const n=inv.kind==="crypto"? (inv.symbol||"актив") : (inv.name||"актив");
      deleteWithUndo(`Актив «${n}»`, ()=>DATA.investments.splice(+b.dataset.invdel,1));
    };
  });
  document.querySelectorAll('[data-invadd]').forEach(b=>{
    b.onclick=()=>{
      const kind=b.dataset.invadd;
      const base={id:Date.now(), kind, currency:"RUB"};
      if(kind==="crypto") Object.assign(base,{symbol:"BTC", qty:"", buyPrice:""});
      else if(kind==="deposit") Object.assign(base,{name:"Вклад", amount:"", rate:"", openDate:todayStr(), termMonths:12, capitalize:false});
      else Object.assign(base,{name:"", amount:"", invested:""});
      DATA.investments.push(base);
      scheduleSave();
      if(kind==="crypto") refreshPrices(true); else render();
    };
  });
  bindCurrencySwitch();
  const rp=document.getElementById("refreshPrices");
  if(rp) rp.onclick=()=>refreshPrices(true);
  refreshPrices(false);
}

function nowTime(){ const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function habitPctAvg(){

  return ids.length? ids.reduce((s,i)=>s+habitPct(i),0)/ids.length : 0;
}
function pickFocus(){
  const ts=todayStr(), now=new Date();
  const todos=(DATA.todos||[]).map((t,i)=>({...t,_i:i})).filter(t=>!t.done);
  const byDate=a=>a.sort((x,y)=>x.dueDate<y.dueDate?-1:1);
  const overdue=byDate(todos.filter(t=>t.dueDate && t.dueDate<ts));
  if(overdue.length) return {kind:"todo", item:overdue[0], why:`Просрочено с ${overdue[0].dueDate.split('-').reverse().join('.')}`};
  const dueToday=todos.filter(t=>t.dueDate===ts);
  if(dueToday.length) return {kind:"todo", item:dueToday[0], why:"Срок сегодня"};
  const habits=DATA.habits.list.map((name,idx)=>({name,idx})).filter(h=>!isHabitArchived(h.idx) && habitScheduledOn(h.idx,now));
  const risky=habits.filter(h=>habitStreak(h.idx)>0 && !isHabitDoneOn(h.idx,now) && !isHabitFrozenOn(h.idx,now))
    .sort((a,b)=>habitStreak(b.idx)-habitStreak(a.idx));
  if(risky.length) return {kind:"habit", item:risky[0], why:`Серия ${habitStreak(risky[0].idx)} дн. под угрозой`};
  const undone=habits.filter(h=>!isHabitDoneOn(h.idx,now) && !isHabitFrozenOn(h.idx,now) && !isHabitFailedOn(h.idx,now));
  if(undone.length) return {kind:"habit", item:undone[0], why:"Ещё не отмечено сегодня"};
  const soon=byDate(todos.filter(t=>t.dueDate));
  if(soon.length) return {kind:"todo", item:soon[0], why:`Срок ${soon[0].dueDate.split('-').reverse().join('.')}`};
  if(todos.length) return {kind:"todo", item:todos[0], why:"Без срока"};
  return null;
}
function buildDayFeed(){
  const ts=todayStr(), now=new Date(), feed=[];
  DATA.habits.list.forEach((name,idx)=>{
    if(isHabitArchived(idx)) return;
    if(!habitScheduledOn(idx,now) && !isHabitDoneOn(idx,now)) return;   // не её день
    const done=isHabitDoneOn(idx,now), frozen=!done&&isHabitFrozenOn(idx,now);
    const streak=habitStreak(idx);
    if(done) feed.push({mk:"hab",label:"привычка",text:name,note:streak>1?`${streak}-й день подряд`:"",state:"done",time:habitTimeOn(idx,now)});
    else if(isHabitFailedOn(idx,now)) feed.push({mk:"hab",label:"не смог",text:name,note:habitFailWhy(idx,now)||"серия начнётся заново",state:"info"});
    else if(frozen) feed.push({mk:"hab",label:"пауза",text:name,note:"заморожено, серия не рвётся",state:"frozen"});
    else feed.push({mk:"hab",label:"привычка",text:name,note:streak>0?`серия ${streak} дн. под угрозой`:"не отмечено",state:"open",habitIdx:idx});
  });
  const accCurr={}; (DATA.finance.accounts||[]).forEach(a=>accCurr[a.id]=a.currency);
  DATA.finance.entries.filter(e=>e.date===ts).forEach(e=>{
    const sym=CURRENCY_SYMBOL[entryCurrency(e)]||entryCurrency(e);
    const inc=e.type==="доход", v=+e.amount||0, plus=inc && v>=0;
    feed.push({mk:"mon",label:inc? (v<0? "убыток" : "доход") : "расход",
      text:e.comment || (inc? srcMeta(entrySource(e)).name : e.category) || "без категории",
      amount:`${plus?"+":"−"}${Math.abs(v).toLocaleString('ru-RU',{maximumFractionDigits:2})} ${sym}`,
      pos:plus, state:"info", time:e.time||""});
  });
  (DATA.todos||[]).forEach(t=>{
    if(!t.done && t.dueDate===ts) feed.push({mk:"todo",label:"дело",text:t.text,note:"срок сегодня",state:"info"});
  });
  ensureWorkouts();
  DATA.workouts.filter(w=>w.date===ts).forEach(w=>{
    const bits=[];
    if(w.duration) bits.push(fmtDuration(+w.duration));
    if(w.distance) bits.push(`${(+w.distance).toLocaleString('ru-RU',{maximumFractionDigits:2})} км`);
    const vol=workoutVolume(w);
    if(vol) bits.push(`${Math.round(vol).toLocaleString('ru-RU')} кг`);
    feed.push({mk:"wrk",label:"тренировка",text:w.type||"Тренировка",note:bits.join(" · "),state:"done",time:w.time||""});
  });
  const sl=healthData().sleep[ts];
  if(sl && sleepMinutes(sl)) feed.push({mk:"slp", label:"сон", text:fmtSleep(sleepMinutes(sl)),
    note:`${sl.bed} – ${sl.wake}${sl.q? " · "+SLEEP_Q[sl.q-1][1] : ""}`, state:"done", time:sl.wake});
  const jr=DATA.journal[ts];
  if(jr && jr.trim()) feed.push({mk:"note",label:"запись",text:"",quote:jr.trim(),state:"info"});
  // timed events first in clock order; everything without a stamp keeps its original grouping below
  const timed=feed.filter(f=>f.time).sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
  const untimed=feed.filter(f=>!f.time);
  return timed.concat(untimed);
}
const NUM_WORDS=["ноль","одно","два","три","четыре","пять","шесть","семь","восемь","девять","десять",
  "одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать","двадцать"];
function plural(n, one, few, many){
  const m100=n%100, m10=n%10;
  if(m100>=11 && m100<=14) return many;
  if(m10===1) return one;
  if(m10>=2 && m10<=4) return few;
  return many;
}
// "три дела" reads better than "3 дела" in the headline, but only up to twenty
function numPhrase(n, one, few, many, feminine){
  const w = n<=20 ? NUM_WORDS[n] : String(n);
  const wf = (feminine && n<=20) ? (n===1?"одна":n===2?"две":w) : w;
  return `${wf} ${plural(n,one,few,many)}`;
}
function todayHeadline(openTodos, undoneHabits){

// ---------- RETROSPECTIVE: week / month wrap-up ----------
function rangeDates(mode){
  const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  if(mode==="week"){
    const start=getWeekStart(d);
    for(let i=0;i<7;i++){ const x=new Date(start); x.setDate(start.getDate()+i); if(x<=d) out.push(x); }
  } else {
    for(let i=1;i<=d.getDate();i++) out.push(new Date(d.getFullYear(),d.getMonth(),i));
  }
  return out;
}
// ═════════ ИТОГИ ═════════
// Неделя или месяц одним экраном: всё, что ведётся в трекере, и рядом — как было
// к тому же дню прошлого периода (идущую неделю честно сравнивать только так).
function retroRange(mode, off){
  const t=new Date(); t.setHours(0,0,0,0);
  if(mode==="month"){
    const a=new Date(t.getFullYear(), t.getMonth()+off, 1), b=new Date(a.getFullYear(), a.getMonth()+1, 0);
    return {from:a, to:b, label:`${MONTHS_RU[a.getMonth()]} ${a.getFullYear()}`, cur:off===0};
  }
  const s=getWeekStart(t); s.setDate(s.getDate()+7*off);
  const e=new Date(s); e.setDate(s.getDate()+6);
  return {from:s, to:e, label:hbWeekLabel([s,0,0,0,0,0,e]), cur:off===0};
}
function retroMetrics(r, limitDays){
  if(!cur._hbStart) cur._hbStart=hbStartKey();
  const ts=todayStr(), fromK=ymdOf(r.from);
  let end=new Date(r.to);
  if(limitDays){ const lim=new Date(r.from); lim.setDate(lim.getDate()+limitDays-1); if(lim<end) end=lim; }
  let endK=ymdOf(end); if(endK>ts){ endK=ts; end=parseLocalDate(ts); }
  const inR=k=>k>=fromK && k<=endK;
  const m={};
  const ids=activeHabitIdx();
  const st=ids.map(idx=>({idx, st:habitPlanStat(idx, r.from, end)}));
  m.hab=hbAvg(st.map(x=>x.st));
  const ranked=st.filter(x=>x.st.pct!=null && x.st.need>=2).sort((a,b)=>b.st.pct-a.st.pct);
  m.habBest=ranked[0]||null; m.habWorst=ranked.length>1? ranked[ranked.length-1] : null;
  let fails=0; const why={};
  for(const d=new Date(r.from); ymdOf(d)<=endK; d.setDate(d.getDate()+1)){
    ids.forEach(idx=>{ if(isHabitFailedOn(idx,d)){ fails++; const w=habitFailWhy(idx,d); if(w) why[w]=(why[w]||0)+1; } });
  }
  m.fails=fails; m.failTop=Object.keys(why).sort((a,b)=>why[b]-why[a])[0]||"";
  m.todos=(DATA.todos||[]).filter(t=>t.done && t.doneAt && inR(ymdOf(new Date(t.doneAt)))).length;
  const H=healthData(), sl=[];
  for(const d=new Date(r.from); ymdOf(d)<=endK; d.setDate(d.getDate()+1)){ const min=sleepMinutes(H.sleep[ymdOf(d)]); if(min) sl.push(min); }
  m.sleep=sl.length? sl.reduce((a,b)=>a+b,0)/sl.length : null; m.sleepN=sl.length;
  const ser=weightSeries();
  if(ser.length){
    const tr=weightTrend(ser);
    let last=null, before=null;
    tr.forEach(p=>{ if(p.date<=endK) last=p; if(p.date<fromK) before=p; });
    if(!before) before=tr.find(p=>inR(p.date))||null;
    if(last && inR(last.date)){ m.weight=last.kg; m.weightD = before && before!==last ? last.kg-before.kg : null; }
  }
  const wk=(DATA.workouts||[]).filter(w=>w.date && inR(w.date));
  m.wk=wk.length; m.wkMin=wk.reduce((a,w)=>a+(+w.duration||0),0);
  m.incCur=pnlCurrency(); m.inc=0; m.incN=0;
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type!=="доход" || e.recurringId || !e.date || !inR(e.date)) return;

  });
  m.exp=entriesInRub().filter(e=>e.type==="расход" && e.date && inR(e.date)).reduce((a,e)=>a+(+e.amount||0),0);
  let notes=0;

  return `<span class="rt-d ${cls}">${d>0? "▲" : "▼"} ${fmt(Math.abs(d))}</span>`;

  if(day.getDay()!==0) return null;
  const s=getWeekStart(day), r={from:s, to:new Date(day)};
  const ps=new Date(s); ps.setDate(ps.getDate()-7);
  const pe=new Date(s); pe.setDate(pe.getDate()-1);
  const M=retroMetrics(r), P=retroMetrics({from:ps, to:pe});
  const arrow=(a,b)=> a==null || b==null || Math.abs(a-b)<1e-9 ? "" : (a>b? " ▲" : " ▼");
  const bits=[`Привычки ${hbPct(M.hab)}${arrow(M.hab,P.hab)}`, `дел закрыто ${M.todos}${arrow(M.todos,P.todos)}`];
  if(M.sleep!=null) bits.push(`сон ${fmtSleepTile(M.sleep)}`);
  if(M.incN) bits.push(`результат ${fmtPnl(M.inc, M.incCur, 0)}${arrow(M.inc,P.inc)}`);
  return {title:"Итоги недели", text:bits.join(" · ")+"\nНажми — откроется вся неделя со сравнением", open:"retro"};
}

/* ---------- КОПИИ В ОБЛАКЕ ---------- */
// Это бэкап, а не синхронизация: раз в сутки приложение кладёт на воркер копию
// своих данных, чтобы потерянный телефон не означал потерянный год. Две копии
// приложения по-прежнему живут независимо — облако их не сводит.
//
// Личность тут не телеграмная: в APK подписи initData не существует. Вместо неё
// ключ устройства, который генерируется один раз. Воркер видит только SHA-256 от
// ключа и шифротекст: расшифровать копию он не может, ключ никуда не уезжает.
// Обратная сторона честная — потерял ключ, значит потерял и копии.
const CLOUD_SALT="tracker-backup-v1";
const CLOUD_ITER=150000;
const CLOUD_MIN_GAP=20*3600*1000;      // не чаще раза в сутки, с запасом на «утро попозже»

function cloudCfg(){
  const s=appearance();
  if(!s.cloud) s.cloud={on:false, url:"", key:"", at:0};
  return s.cloud;
}
// Ключ человек переписывает руками, поэтому без символов, которые путаются
// между собой: ни нуля с буквой O, ни единицы с I.
const KEY_ALPHABET="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newDeviceKey(){
  const bytes=new Uint8Array(25);
  crypto.getRandomValues(bytes);
  let out="";
  for(let i=0;i<25;i++){
    if(i && i%5===0) out+="-";
    out+=KEY_ALPHABET[bytes[i]%KEY_ALPHABET.length];
  }
  return out;
}
function normalizeKey(k){ return String(k||"").toUpperCase().replace(/[^A-Z2-9]/g,""); }
function prettyKey(k){ return (normalizeKey(k).match(/.{1,5}/g)||[]).join("-"); }

async function sha256hex(text){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
// owner — единственное, что воркер знает о владельце копий
async function cloudOwner(key){ return (await sha256hex("owner|"+normalizeKey(key))).slice(0,32); }

async function cloudCryptoKey(key){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw", enc.encode(normalizeKey(key)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:enc.encode(CLOUD_SALT), iterations:CLOUD_ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
// побайтовая склейка строки на мегабайтах превращается в тормоза, поэтому кусками
function bytesToB64(bytes){
  let s="";
  for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
  return btoa(s);
}
function b64ToBytes(text){
  const raw=atob(text);
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
async function cloudEncrypt(key, text){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv},
    await cloudCryptoKey(key), new TextEncoder().encode(text));
  const all=new Uint8Array(iv.length+ct.byteLength);
  all.set(iv,0);
  all.set(new Uint8Array(ct), iv.length);
  return bytesToB64(all);
}
async function cloudDecrypt(key, blob){
  const all=b64ToBytes(blob);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:all.slice(0,12)},
    await cloudCryptoKey(key), all.slice(12));
  return new TextDecoder().decode(pt);
}

async function cloudPost(path, payload){
  const base=(cloudCfg().url||"").replace(/\/+$/,"");
  if(!base) throw new Error("не указан адрес воркера");
  const r=await fetch(base+path, {method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify(payload)});
  let j={};
  try{ j=await r.json(); }catch(e){ /* воркер ответил не JSON — разберёмся по статусу */ }
  if(!r.ok || j.ok===false) throw new Error(j.error || ("ошибка "+r.status));
  return j;
}
// id копии — дата: одна копия на день, следующая за тот же день просто заменит её
function cloudCopyId(){
  const d=new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function cloudReady(){
  const c=cloudCfg();
  return !!(c.on && c.url && normalizeKey(c.key).length===25);
}

async function cloudUpload(silent){
  if(!cloudReady()) return false;
  const c=cloudCfg();
  try{
    const blob=await cloudEncrypt(c.key, JSON.stringify(DATA));
    await cloudPost("/cloud/put", {owner: await cloudOwner(c.key), id: cloudCopyId(), blob});
    c.at=Date.now();
    scheduleSave();
    if(!silent){ showBanner("☁️ Копия сохранена"); render(); }
    return true;
  }catch(e){
    if(!silent) showBanner("⚠️ Не сохранилось: "+e.message);
    return false;
  }
}
// Фоновая копия при запуске. Тихая: если интернета нет, это не повод пугать
// человека баннером на старте — попробуем в следующий раз.
function maybeCloudBackup(){
  if(!cloudReady()) return;
  if(Date.now()-(cloudCfg().at||0) < CLOUD_MIN_GAP) return;
  cloudUpload(true);
}
async function cloudLoadList(){
  cur.cloudList="loading";
  render();
  try{
    const j=await cloudPost("/cloud/list", {owner: await cloudOwner(cloudCfg().key)});
    cur.cloudList=Array.isArray(j.copies)? j.copies : [];
  }catch(e){
    cur.cloudList=[];
    showBanner("⚠️ Не удалось получить список: "+e.message);
  }
  render();
}
async function cloudRestore(id){
  const c=cloudCfg();
  try{
    const j=await cloudPost("/cloud/get", {owner: await cloudOwner(c.key), id});
    let text;
    try{
      text=await cloudDecrypt(c.key, j.blob);
    }catch(e){
      // AES-GCM не расшифрует чужим ключом — это единственный внятный признак,
      // что ключ не тот, других проверок у нас нет и не нужно
      showBanner("⚠️ Копия повреждена — расшифровать не удалось");
      return;
    }
    importBackupText(text);
  }catch(e){
    showBanner("⚠️ Не удалось загрузить копию: "+e.message);
  }
}

function bindCloudUi(){
  const url=document.getElementById("cloudUrl");
  if(url) url.onchange=()=>{ cloudCfg().url=url.value.trim(); scheduleSave(); };

  document.querySelectorAll('[data-cloudon]').forEach(b=>{
    b.onclick=()=>{
      const on=b.dataset.cloudon==="1";
      const c=cloudCfg();
      if(on && !normalizeKey(c.key)) c.key=newDeviceKey();   // без ключа включать нечего
      c.on=on;
      scheduleSave(); render();
    };
  });
  const mk=document.getElementById("cloudKeyNew");
  if(mk) mk.onclick=()=>{
    const c=cloudCfg();
    // смена ключа не удаляет старые копии, но делает их невидимыми: они лежат
    // под прежним owner и расшифровываются прежним ключом
    if(normalizeKey(c.key) && !confirm("Старые копии станут недоступны без прежнего ключа. Сменить?")) return;
    c.key=newDeviceKey();
    cur.cloudList=null;
    scheduleSave(); render();
  };
  const enter=document.getElementById("cloudKeyEnter");
  if(enter) enter.onclick=()=>{
    const v=prompt("Ключ устройства (25 символов):", prettyKey(cloudCfg().key));
    if(v===null) return;
    if(normalizeKey(v).length!==25){ showBanner("⚠️ В ключе должно быть 25 символов"); return; }
    cloudCfg().key=normalizeKey(v);
    cur.cloudList=null;
    scheduleSave(); render();
  };
  const now=document.getElementById("cloudNow");
  if(now) now.onclick=()=>{
    if(!cloudReady()){ showBanner("⚠️ Нужен адрес воркера, ключ и включённая копия"); return; }
    cloudUpload(false);
  };
  const list=document.getElementById("cloudList");
  if(list) list.onclick=()=>{
    if(!cloudReady()){ showBanner("⚠️ Нужен адрес воркера, ключ и включённая копия"); return; }
    cloudLoadList();
  };
  document.querySelectorAll('[data-cloudget]').forEach(b=>{
    b.onclick=()=>{
      if(!confirm("Заменить текущие данные копией от "+b.dataset.cloudget+"?")) return;
      cloudRestore(b.dataset.cloudget);
    };
  });

/* ---------- ОБНОВЛЕНИЕ ПРИЛОЖЕНИЯ ---------- */
// Всё приложение — одна страница. Оболочка умеет грузить её не из APK, а из
// внутренней папки, поэтому правки долетают без переустановки: скачали страницу,
// положили рядом, при следующем запуске поднялась она.
//
// Применяется именно при следующем запуске, а не сразу: подменять страницу под
// ногами у открытого приложения — верный способ потерять несохранённое. Если
// скачанная версия не поднимется, оболочка сама вернётся на встроенную — метку
// запуска снимает launchOk() из моста.
//
// Тот, кто отдаёт страницу по этому адресу, фактически управляет приложением: у
// страницы есть мост к хранилищу. Поэтому адрес — только свой и только https.
const UPDATE_URL_DEFAULT="https://raw.githubusercontent.com/pipkingena95-coder/tracker-page/main/tracker.html";
const UPDATE_MIN_GAP=20*3600*1000;

function isNativeShell(){
  return typeof AndroidHost!=="undefined" && typeof AndroidHost.saveAppUpdate==="function";
}
function updCfg(){
  const s=appearance();
  if(!s.upd) s.upd={on:true, url:"", at:0};
  return s.upd;
}
function updUrl(){ return String(updCfg().url||UPDATE_URL_DEFAULT).trim(); }
function currentBuild(){ return window.TRACKER_BUILD || ""; }

// ═════════ ОБНОВЛЕНИЯ, ВТОРАЯ ВЕРСИЯ ═════════
// Раньше проверка шла раз в сутки, а скачанное включалось по кнопке или после
// полного перезапуска — поэтому правки «не появлялись» днями. Теперь при каждом
// открытии и возвращении в приложение спрашиваем крошечный build.txt; если
// версия свежее — качаем страницу и включаем сразу, пока ничего не начато. Если
// в этот момент открыт лист или набирается текст — ждём следующего возвращения.
const UPDATE_CHECK_GAP=10*60*1000;
const UPDATE_MIRROR="https://cdn.jsdelivr.net/gh/pipkingena95-coder/tracker-page@main/";

function buildTime(b){ return String(b||"").slice(0,16); }
// Сравниваем по времени сборки, а не на «не равно»: иначе свежий APK
// «обновлялся» бы до более старой страницы с сервера.
function buildIsNewer(remote, local){
  if(!remote) return false;
  if(!local) return true;
  if(remote===local) return false;
  return buildTime(remote) >= buildTime(local);
}
function updBase(){ return updUrl().replace(/[^/]*$/, ""); }
async function fetchFresh(url){
  const sep=url.indexOf("?")>=0 ? "&" : "?";
  const r=await fetch(url+sep+"t="+Math.floor(Date.now()/60000), {cache:"no-store"});
  if(!r.ok) throw new Error("ответ "+r.status);
  return r.text();
}
async function remoteBuild(){
  const bases=[updBase()];
  if(!updCfg().url) bases.push(UPDATE_MIRROR);
  let err=null;
  for(const b of bases){
    try{
      const t=(await fetchFresh(b+"build.txt")).trim();
      if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(t)) return {build:t, base:b};
      err=new Error("build.txt без метки");
    }catch(e){ err=e; }
  }
  throw err || new Error("нет build.txt");
}
function downloadedBuild(){
  if(!isNativeShell()) return "";
  try{ return AndroidHost.updateBuild()||""; }catch(e){ return ""; }
}
// Можно ли прямо сейчас сменить страницу, ничего не потеряв
function appIdle(){
  if(cur.sheet) return false;
  if(typeof voicePending!=="undefined" && voicePending) return false;
  const a=document.activeElement;
  if(a && (a.tagName==="TEXTAREA" || a.tagName==="SELECT" || (a.tagName==="INPUT" && !/^(button|checkbox|radio)$/i.test(a.type)))) return false;
  return true;
}
let updBusy=false;
async function checkAppUpdate(silent){
  if(!isNativeShell() || updBusy) return false;
  const c=updCfg();
  const url=updUrl();
  if(!/^https:\/\//i.test(url)){
    if(!silent) showBanner("⚠️ Адрес обновлений должен начинаться с https://");
    return false;
  }
  updBusy=true;
  try{
    let remote="", base=updBase(), html=null;
    try{
      const rb=await remoteBuild();
      remote=rb.build; base=rb.base;
    }catch(e){
      // адрес без build.txt — по старинке, по самой странице
      html=await fetchFresh(url);
      const m=html.match(/TRACKER_BUILD\s*=\s*"([^"]+)"/);
      if(!m){ if(!silent) showBanner("⚠️ По этому адресу лежит не страница трекера"); return false; }
      remote=m[1];
    }
    c.at=Date.now();
    scheduleSave();
    if(!buildIsNewer(remote, currentBuild())){
      if(!silent){ showBanner("✅ Уже последняя версия"); render(); }
      return false;
    }
    if(downloadedBuild()!==remote){
      if(!html) html=await fetchFresh(base+"tracker.html");
      const m=html.match(/TRACKER_BUILD\s*=\s*"([^"]+)"/);
      if(!m || !buildIsNewer(m[1], currentBuild())){
        if(!silent) showBanner("⚠️ Сервер отдал неполное обновление — попробую позже");
        return false;
      }
      if(!AndroidHost.saveAppUpdate(html)){
        if(!silent) showBanner("⚠️ Обновление отклонено — файл не похож на страницу трекера");
        return false;
      }
    }
    if(appIdle()){ applyUpdateNow(); return true; }
    showBanner("⬇️ Обновление скачано — включится, когда закончишь");
    render();
    return true;
  }catch(e){
    if(!silent) showBanner("⚠️ Не удалось проверить: "+e.message);
    return false;
  }finally{ updBusy=false; }
}
// При запуске и при каждом возвращении в приложение
function maybeAppUpdate(){
  if(!isNativeShell()) return;
  const c=updCfg();
  if(!c.on) return;
  if(updateWaiting() && appIdle()){ applyUpdateNow(); return; }
  if(Date.now()-(c.at||0) < UPDATE_CHECK_GAP) return;
  checkAppUpdate(true);
}

// Тема — это набор переменных, а не отдельная вёрстка: разметка одна на все
// восемь. Светлая тема или тёмная, приложение выводит само и проставляет

const GLASS_THEMES=[
  ["hvoya",   "Хвоя",     "light", "Мята, шалфей, олива", ["#E6F1E6","#DEEDE4","#F1F4E2","#4E8C6A"]],
  ["rassvet", "Рассвет",  "light", "Персик, сирень, мята", ["#FFE8D6","#EADCFF","#D6F5EC","#8A78CE"]],
  ["inei",    "Иней",     "light", "Голубое с серебром",   ["#E6F1FF","#DEE6FF","#E8F7F6","#3D6BB5"]],
  ["tsitrus", "Цитрус",   "light", "Медовое с розовым",    ["#FFF4D8","#FFE7E0","#F2F7D8","#B06A18"]],
  ["pyl",     "Пыль",     "light", "Жемчужно-серое",       ["#F2F0EC","#EBE9E9","#EFECE6","#5A5E68"]],
  ["polnoch", "Полночь",  "dark",  "Индиго с фиолетовым",  ["#141530","#191233","#0E1024","#C4B5FD"]],
  ["omut",    "Омут",     "dark",  "Сине-зелёная глубина", ["#08191C","#0B2124","#061417","#7FE3D6"]],
  ["ugol",    "Уголь",    "dark",  "Тёплая тьма",          ["#17181B","#1C1D21","#131417","#D8D2C6"]]
];
// Пары подобраны по акценту: переход день→вечер не должен ощущаться сменой приложения
const GLASS_PAIR={ hvoya:"omut", rassvet:"polnoch", inei:"omut", tsitrus:"polnoch", pyl:"ugol" };
const GLASS_DEFAULT="hvoya";

function glassDef(id){ return GLASS_THEMES.find(t=>t[0]===id) || GLASS_THEMES[0]; }

// Какая тема должна быть прямо сейчас. При включённой паре светлая работает
// днём, её тёмная напарница — с семи вечера до семи утра.
function glassTheme(){
  const s=appearance();
  let id = GLASS_THEMES.some(t=>t[0]===s.glass) ? s.glass : GLASS_DEFAULT;
  if(!s.glassAuto) return id;
  const h=new Date().getHours();
  const night = h>=19 || h<7;
  const kind = glassDef(id)[2];
  if(night && kind==="light") return GLASS_PAIR[id] || "omut";
  if(!night && kind==="dark"){
    const day=Object.keys(GLASS_PAIR).find(k=>GLASS_PAIR[k]===id);
    return day || GLASS_DEFAULT;
  }
  return id;
}

      <span class="gt-nm">${name}</span>

function drawDashChart(){
  const canvas=document.getElementById("dashChart"); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  const padL=8,padR=8,padT=12,padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const n=12; const stepX=chartW/(n-1);
  const drawSeries=(vals,color)=>{
    const pts=vals.map((v,i)=>[padL+i*stepX, padT+chartH-(v/100)*chartH]);
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.stroke();
    pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2.4,0,7); ctx.fillStyle=color; ctx.fill(); });
  };
  ctx.strokeStyle=cssVar("--border"); ctx.lineWidth=1;
  [0,25,50,75,100].forEach(v=>{
    const y=padT+chartH-(v/100)*chartH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  });
  drawSeries(window.__dashHSeries||[], cssVar("--purple"));
  drawSeries(window.__dashTSeries||[], cssVar("--cyan"));

// ═════════ ЗДОРОВЬЕ ═════════
// Сон, тренировки, вес, самочувствие. Ночь записана по утру, в которое проснулся:
// sleep["2026-10-02"] — ночь с 1 на 2 октября.
const SLEEP_Q=[[1,"ужасно"],[2,"плохо"],[3,"так себе"],[4,"хорошо"],[5,"отлично"]];
const ENERGY=[[1,"без сил"],[2,"вяло"],[3,"норм"],[4,"бодро"],[5,"огонь"]];
function healthData(){
  if(!DATA.health || typeof DATA.health!=="object") DATA.health={};
  const H=DATA.health;
  if(!H.sleep) H.sleep={};      // {bed:"23:40", wake:"07:30", q:1..5}
  if(!H.weight) H.weight={};    // кг
  if(!H.feel) H.feel={};        // {e:1..5, note:""}
  if(!H.cfg) H.cfg={};
  if(!(+H.cfg.goal>0)) H.cfg.goal=8;
  if(!H.cfg.bed) H.cfg.bed="23:30";
  return H;
}
function hmToMin(hm){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(hm||""));
  return m? (+m[1])*60+(+m[2]) : null;
}
function minToHm(x){ x=((Math.round(x)%1440)+1440)%1440; return `${pad2(Math.floor(x/60))}:${pad2(x%60)}`; }
function sleepMinutes(s){
  const b=hmToMin(s&&s.bed), w=hmToMin(s&&s.wake);
  if(b==null || w==null) return 0;
  let d=w-b;
  if(d<=0) d+=1440;
  return d;
}
function fmtSleep(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return m? `${h} ч ${m} мин` : `${h} ч`; }
function fmtSleepShort(min){ min=Math.round(min); return `${Math.floor(min/60)}:${pad2(min%60)}`; }
function fmtGoal(h){ return `${String(h).replace(".",",")} ч`; }
function addDaysKey(key, n){ const d=parseLocalDate(key)||new Date(); d.setDate(d.getDate()+n); return ymdOf(d); }
// Отбой считаем от 18:00, подъём — от 4:00: иначе «23:50» и «00:10» в среднем дали бы полдень
function sleepStats(days){
  const H=healthData(), list=[];
  for(let i=0;i<days;i++){
    const k=addDaysKey(todayStr(), -i), s=H.sleep[k], min=sleepMinutes(s);
    if(min) list.push({date:k, s, min});
  }
  if(!list.length) return {n:0, list};
  const avg=list.reduce((a,x)=>a+x.min,0)/list.length;
  const bo=list.map(x=>(hmToMin(x.s.bed)-1080+1440)%1440);
  const wo=list.map(x=>(hmToMin(x.s.wake)-240+1440)%1440);
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const mb=mean(bo);
  const spread=Math.sqrt(mean(bo.map(v=>(v-mb)*(v-mb))));
  const goal=H.cfg.goal*60;
  const qs=list.filter(x=>x.s.q).map(x=>x.s.q);
  return {n:list.length, list, avg, bed:minToHm(mb+1080), wake:minToHm(mean(wo)+240), spread,
    debt:list.reduce((a,x)=>a+Math.max(0, goal-x.min),0), short:list.filter(x=>x.min<goal-30).length,
    q: qs.length? mean(qs) : 0, longest:list.reduce((a,x)=>x.min>a.min? x : a, list[0])};
}
// Что подставить в «Как спал?»: обычный режим за две недели, а без него — цель
function sleepTypical(){
  const st=sleepStats(14), H=healthData();
  const r5=hm=>minToHm(Math.round(hmToMin(hm)/5)*5);
  if(st.n>=3) return {bed:r5(st.bed), wake:r5(st.wake)};
  return {bed:H.cfg.bed, wake:minToHm(hmToMin(H.cfg.bed)+H.cfg.goal*60)};
}
function sleepTracked(){
  const from=addDaysKey(todayStr(), -14);
  return Object.keys(healthData().sleep).some(k=>k>=from);
}
function saveSleep(date, bed, wake, q){
  if(hmToMin(bed)==null || hmToMin(wake)==null) return false;
  const e={bed, wake};
  if(q) e.q=+q;
  healthData().sleep[date]=e;
  scheduleSave();
  return true;
}
function sleepDraft(date){
  cur.slDraft=cur.slDraft||{};
  if(!cur.slDraft[date]){
    const s=healthData().sleep[date], t=sleepGuessFor(date) || sleepTypical();
    cur.slDraft[date]={bed:s? s.bed : t.bed, wake:s? s.wake : t.wake, q:s && s.q || 0};
  }
  return cur.slDraft[date];
}
function renderSleepForm(date, where){
  const d=sleepDraft(date), min=sleepMinutes(d);
  const hint=sleepFormHint(date, where);
  return `<div class="sl-times">
      <label class="sl-time"><span>Лёг</span><input type="time" data-slf="bed" data-sld="${date}" value="${escapeHtml(d.bed)}"></label>
      <label class="sl-time"><span>Встал</span><input type="time" data-slf="wake" data-sld="${date}" value="${escapeHtml(d.wake)}"></label>
    </div>
    <div class="sl-dur" data-sldur="${date}">${min? fmtSleep(min) : "—"}</div>
    <div class="sl-q">${SLEEP_Q.map(([v,l])=>`<button class="${d.q===v?'on':''}" data-slq="${v}" data-sld="${date}"><b>${v}</b><small>${l}</small></button>`).join("")}</div>
    ${hint? `<div class="fx-hint" style="margin:8px 2px 0;">${hint}</div>` : ""}`;
}
function bindSleepForm(root, onSaved){
  root.querySelectorAll('[data-slf]').forEach(el=>{
    const upd=()=>{
      const d=sleepDraft(el.dataset.sld);

}
function hmNow(t){ t=t||new Date(); return `${pad2(t.getHours())}:${pad2(t.getMinutes())}`; }
function pendingSleep(){
  const H=healthData();
  if(H.pending && Date.now()-H.pending < 16*3600000) return H.pending;

// Тренд — средняя за 7 дней: дневные скачки воды не выдают себя за похудение
function weightTrend(series){
  return series.map((p,i)=>{
    const t=parseLocalDate(p.date).getTime();
    let s=0, n=0;
    for(let j=i;j>=0;j--){
      if(t-parseLocalDate(series[j].date).getTime() > 6*86400000) break;
      s+=series[j].kg; n++;
    }
    return {date:p.date, kg:s/n};
  });
}
function weightChartSvg(pts, tr){
  const W=320, Hh=132, pl=6, pr=38, pt=10, pb=20;
  const ts=pts.map(p=>parseLocalDate(p.date).getTime());
  const t0=ts[0], t1=ts[ts.length-1], span=Math.max(1, t1-t0);
  const vals=pts.map(p=>p.kg).concat(tr.map(p=>p.kg));
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mx-mn<1){ const c=(mx+mn)/2; mn=c-0.5; mx=c+0.5; }
  const padv=(mx-mn)*0.12; mn-=padv; mx+=padv;
  const x=t=> pts.length===1 ? (pl+(W-pl-pr)/2) : pl+(t-t0)/span*(W-pl-pr);
  const y=v=> pt+(mx-v)/(mx-mn)*(Hh-pt-pb);
  const kg=v=>v.toLocaleString('ru-RU',{maximumFractionDigits:1});
  const dl=k=>{ const d=parseLocalDate(k); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()].slice(0,3)}`; };

      <div><span class="k">До цели</span><span class="v">${goal? (Math.abs(goal-tNow)<0.05? "✓" : (goal-tNow>0?"+":"−")+kgPlain(Math.abs(goal-tNow))) : "—"}</span><span class="s">${goal? `цель ${kgPlain(goal)} кг` : "цель не задана"}</span></div>

// ---------- самочувствие ----------
function sleepEnergyInsight(){
  const H=healthData(), goal=H.cfg.goal*60, ok=[], bad=[];
  Object.keys(H.feel).forEach(k=>{
    const e=+(H.feel[k]||{}).e, min=sleepMinutes(H.sleep[k]);
    if(!e || !min) return;
    (min>=goal-30? ok : bad).push(e);
  });
  if(ok.length<3 || bad.length<3) return "";
  const avg=a=>(a.reduce((s,v)=>s+v,0)/a.length).toFixed(1).replace(".",",");
  return `После ночей от ${fmtSleepShort(goal-30)} энергия в среднем <b>${avg(ok)}</b>, после коротких — <b>${avg(bad)}</b>.`;
}
function renderFeel(){
  const H=healthData(), key=todayStr(), f=H.feel[key]||{};

  }
  const notes=Object.keys(H.feel).filter(k=>(H.feel[k]||{}).note).sort().reverse().slice(0,8);
  const ins=sleepEnergyInsight();
  return `<div class="card">
      <h2>☀ Как ты сегодня?</h2>
      <div class="hl-lab" style="margin-top:2px;">Энергия</div>
      <div class="sl-q">${ENERGY.map(([v,l])=>`<button class="${+f.e===v?'on':''}" data-fe="${v}"><b>${v}</b><small>${l}</small></button>`).join("")}</div>
      <input class="fe-note" id="feNote" autocomplete="off" placeholder="Что-то беспокоит? Голова, спина, простуда…" value="${escapeHtml(f.note||"")}">

      <div class="hl-note">${n? `Средняя энергия — <b>${(sum/n).toFixed(1).replace(".",",")}</b> из 5 за ${n} ${plural(n,'день','дня','дней')}.` : "Отмечай энергию каждый день — здесь появится картина месяца."}
        ${ins? " "+ins : (n? " Отмечай и сон — увидишь, как он влияет на энергию." : "")}</div>

      return `<div class="r"><small>${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${e? " · "+ENERGY[e-1][1] : ""}</small>${escapeHtml(H.feel[k].note)}</div>`; }).join("")}</div></div>` : ""}`;

const JQ=[["good","Что сегодня получилось?","маленькое тоже считается"],
  ["bad","Что не получилось или мешало?","просто факт, без самокопания"],
  ["next","Что завтра главное?","одно дело, которое сделает день"]];
function jqOf(key){ return (DATA.journalQ && DATA.journalQ[key]) || {}; }
function jqAnswered(key){ const q=jqOf(key); return !!(q.good || q.bad || q.next); }
function jqTodoExists(key){
  const t=(jqOf(key).next||"").trim(), tomorrow=addDaysKey(key, 1);
  return !!t && (DATA.todos||[]).some(x=>(x.text||"").trim()===t && x.dueDate===tomorrow);
}
function renderJournalQ(key){
  const q=jqOf(key), has=jqTodoExists(key);
  return `<div class="card">
    <div class="nt-head"><h2>🌆 Три вопроса дня</h2>${jqAnswered(key)? `<span class="jq-ok">✓</span>` : ""}</div>
    <div class="jq">${JQ.map(([f,t,ph])=>`<label>${t}<textarea data-jq="${f}" rows="2" placeholder="${ph}">${escapeHtml(q[f]||"")}</textarea></label>`).join("")}
      <button class="btn ghost jq-todo" data-jqtodo="1" ${(q.next||"").trim() && !has? "" : "hidden"}>→ Сделать делом на завтра</button>
      <div class="fx-hint" id="jqTodoOk" style="margin:0" ${has? "" : "hidden"}>Уже в делах на завтра ✓ — и утром будет в сводке.</div>
    </div>
  </div>`;
}
// «Год назад в этот день» — или полгода, или месяц: что найдётся первым
function renderJournalPast(key){
  const dt=parseLocalDate(key);
  if(!dt) return "";
  const cands=[["Год назад", new Date(dt.getFullYear()-1, dt.getMonth(), dt.getDate())],
    ["Полгода назад", new Date(dt.getFullYear(), dt.getMonth()-6, dt.getDate())],
    ["Месяц назад", new Date(dt.getFullYear(), dt.getMonth()-1, dt.getDate())]];
  for(const [lab, d] of cands){
    const k=ymdOf(d), text=(DATA.journal[k]||"").trim(), q=jqOf(k);
    if(!text && !jqAnswered(k)) continue;
    const mood=(DATA.journalMood||{})[k]||"";
    const cut=s=>s.length>220? s.slice(0,220)+"…" : s;
    const parts=[];
    if(text) parts.push(escapeHtml(cut(text)));
    JQ.forEach(([f,t])=>{ if((q[f]||"").trim()) parts.push(`<b>${t}</b>${escapeHtml(cut(q[f].trim()))}`); });
    return `<div class="card"><h2>🕰 ${lab} · ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()} ${mood}</h2><div class="jq-past">${parts.join("\n")}</div></div>`;
  }
  return "";
}
function bindJournalQ(){
  const key=journalKey();
  const store=()=>{ DATA.journalQ=DATA.journalQ||{}; return DATA.journalQ[key]||(DATA.journalQ[key]={}); };
  const sync=()=>{
    const q=jqOf(key), has=jqTodoExists(key);
    const b=document.querySelector('[data-jqtodo]'), ok=document.getElementById("jqTodoOk");
    if(b) b.hidden=!((q.next||"").trim() && !has);
    if(ok) ok.hidden=!has;
  };
  document.querySelectorAll('[data-jq]').forEach(el=>el.oninput=()=>{
    const q=store();
    q[el.dataset.jq]=el.value;
    if(!jqAnswered(key)) delete DATA.journalQ[key];
    scheduleSave(); sync();
  });
  const b=document.querySelector('[data-jqtodo]');
  if(b) b.onclick=()=>{
    const t=(jqOf(key).next||"").trim();
    if(!t) return;
    DATA.todos=DATA.todos||[];
    DATA.todos.push({id:Date.now(), text:t, done:false, dueDate:addDaysKey(key, 1), priority:"high", createdAt:Date.now()});
    scheduleSave(); sync();
    showActionToast("Добавлено в дела на завтра");
  };
}

const firedToday = new Set();
function checkReminders(){
  if(!DATA || !DATA.reminders || !DATA.reminders.length) return;
  // напоминания показывает телефон — баннер внутри приложения их бы только дублировал
  if(notifyOn() && notifyCfg().reminders) return;
  const now=new Date();
  const curHM=`${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const todayStr=`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
  DATA.reminders.forEach(r=>{

}
// ---------- UNDO ----------
// Deletions here can wipe months of history (removing a habit drops every tick with
// it), so each one snapshots the affected slice and offers a short window to restore.
let undoState=null, undoTimer=null;
function deleteWithUndo(label, mutate){
  const before=JSON.stringify(DATA);
  mutate();
  undoState={before, label};
  scheduleSave(); render();
  showUndoToast(label);
}
function showUndoToast(label){
  clearTimeout(undoTimer);
  document.querySelectorAll('.undo-toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='undo-toast';
  t.innerHTML=`<span>${escapeHtml(label)} удалено</span><button type="button">Отменить</button>`;
  document.body.appendChild(t);
  t.querySelector('button').onclick=()=>{
    if(!undoState) return;
    DATA=JSON.parse(undoState.before);
    undoState=null;
    clearTimeout(undoTimer);
    t.remove();
    scheduleSave(); render();
  };
  requestAnimationFrame(()=>t.classList.add('show'));
  undoTimer=setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(),350);
    undoState=null;
  }, 7000);
}
function showBanner(text){
  const b=document.createElement("div");
  b.className="rem-banner";
  b.textContent=text;
  document.body.appendChild(b);
  requestAnimationFrame(()=>b.classList.add("show"));
  setTimeout(()=>{ b.classList.remove("show"); setTimeout(()=>b.remove(),400); }, 6000);
}
setInterval(checkReminders, 20000);

function bindBackupUi(){
  const exportBtn=document.getElementById("exportBtn");
  if(exportBtn) exportBtn.onclick=()=>{ DATA._lastBackup=Date.now(); scheduleSave(); exportBackup(false); };
  const pasteBtn=document.getElementById("pasteBtn");
  if(pasteBtn) pasteBtn.onclick=()=>{ cur.backupPanel="import"; render(); };
  bindBackupPanel();
  const importBtn=document.getElementById("importBtn");
  const importFile=document.getElementById("importFile");
  if(importBtn && importFile){
    importBtn.onclick=()=>importFile.click();
    importFile.onchange=()=>{
      if(importFile.files && importFile.files[0]) importBackupFile(importFile.files[0]);
    };
  }
  bindCloudUi();
  bindUpdateUi();
}

// ---------- SWIPE NAVIGATION ----------
function attachSwipe(){
  const el=document.getElementById("app");
  if(!el) return;
  let startX=0, startY=0, tracking=false;
  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    const t=e.target;
    if(t.closest && t.closest('.days-scroll,input,textarea,select,button')) { tracking=false; return; }
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; tracking=true;
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    const stepMonth=d=>{ if(d>0){ cur.monthIdx++; if(cur.monthIdx>11){cur.monthIdx=0;cur.year++;} }
                         else { cur.monthIdx--; if(cur.monthIdx<0){cur.monthIdx=11;cur.year--;} } };
    const dir = dx<0 ? 1 : -1;
    const v = cur.sub ? cur.sub[cur.tab] : null;
    if(cur.tab==="doing"){
      if(v==="habits"){
        if(cur.habitView==="year") cur.year += dir;
        else if(cur.habitView==="week") cur.weekAnchor += dir*7*86400000;
        else stepMonth(dir);
        render();
      } else if(v==="plan"){ stepMonth(dir); render(); }
    } else if(cur.tab==="health"){
      if(v==="workouts"){ stepMonth(dir); render(); }
    } else if(cur.tab==="money"){
      if(v==="savings"){ stepMonth(dir); render(); }
    } else if(cur.tab==="journal"){
      shiftDay(dir); render();
    }
  }, {passive:true});
}

// ---------- BACKUP / EXPORT / IMPORT ----------
// Telegram's in-app WebView silently ignores <a download> on blob URLs, so a plain
// download link looks like nothing happened. Detect that case and fall back to the
// share sheet, then to a copyable text panel — one of the three always works.
function isTelegramWebView(){
  const tg = typeof window!=="undefined" && window.Telegram && window.Telegram.WebApp;
  return !!(tg && tg.initData !== undefined && tg.platform && tg.platform!=="unknown");
}
function backupJson(){ return JSON.stringify(DATA,null,2); }
function backupFilename(){
  const d=new Date();
  return `tracker-backup-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.json`;
}
function downloadBackupFile(){
  const blob=new Blob([backupJson()], {type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=backupFilename();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function shareBackupFile(){
  if(typeof File!=="function" || !navigator.share || !navigator.canShare) return false;
  try{
    const file=new File([backupJson()], backupFilename(), {type:"application/json"});
    if(!navigator.canShare({files:[file]})) return false;
    await navigator.share({files:[file], title:"Бэкап трекера"});
    return true;
  }catch(e){ return false; } // includes the user simply cancelling the sheet
}
async function exportBackup(silent){
  try{
    if(!isTelegramWebView()){
      downloadBackupFile();
      if(silent) showBanner("📥 Еженедельный бэкап сохранён");
      return;
    }
    if(silent){ showBanner("📥 Пора сохранить бэкап (Дашборд → Данные)"); return; }
    if(await shareBackupFile()) return;
    cur.backupPanel="export";   // last resort: show the JSON so it can be copied
    render();
  }catch(e){
    console.error("backup failed", e);
    cur.backupPanel="export";
    render();
  }
}
function importBackupText(text){
  try{
    const parsed=JSON.parse(text);
    if(!parsed || typeof parsed!=="object" || !parsed.habits) throw new Error("not a backup");
    // Настройка облака описывает это устройство, а не данные: восстановление
    // старой копии не должно молча сменить адрес бэкапа или выключить его.
    // Если здесь облако ещё не настроено — тогда наоборот, берём настройку из копии.
    const hereCloud=(DATA.settings||{}).cloud;
    if(hereCloud && hereCloud.url && normalizeKey(hereCloud.key)){
      parsed.settings=parsed.settings||{};
      parsed.settings.cloud={...hereCloud};
    }
    DATA=parsed;
    normalizeData();      // same migrations the app runs on a cold start
    applyAppearance();
    applyRecurring();
    cur.backupPanel=null;
    scheduleSave(); render();
    showBanner("✅ Бэкап загружен");
    return true;
  }catch(e){
    showBanner("⚠️ Не удалось прочитать бэкап — проверь, что скопирован весь текст");
    return false;
  }
}
function renderBackupPanel(){
  if(cur.backupPanel==="export"){
    return `<div class="bk-panel">
      <div class="bk-note">Telegram не даёт скачать файл напрямую. Скопируй текст ниже и сохрани куда угодно — в «Избранное», заметки или файл. Этого достаточно, чтобы потом всё восстановить.</div>
      <textarea id="bkText" readonly>${escapeHtml(backupJson())}</textarea>
      <div class="bk-row">
        <button class="btn" id="bkCopy">Скопировать</button>
        <button class="btn ghost" id="bkShare">Поделиться файлом</button>
        <button class="btn ghost" id="bkClose">Закрыть</button>
      </div>
      <div class="bk-ok" id="bkStatus"></div>
    </div>`;
  }
  if(cur.backupPanel==="import"){
    return `<div class="bk-panel">
      <div class="bk-note">Вставь сюда текст бэкапа и нажми «Восстановить». Текущие данные будут заменены.</div>
      <textarea id="bkPaste" placeholder="{ ... }"></textarea>
      <div class="bk-row">
        <button class="btn" id="bkRestore">Восстановить</button>
        <button class="btn ghost" id="bkClose">Закрыть</button>
      </div>
    </div>`;
  }
  return "";
}
function bindBackupPanel(){
  const close=document.getElementById("bkClose");
  if(close) close.onclick=()=>{ cur.backupPanel=null; render(); };

  const copy=document.getElementById("bkCopy");
  if(copy) copy.onclick=async()=>{
    const ta=document.getElementById("bkText");
    const status=document.getElementById("bkStatus");
    let done=false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(backupJson());
        done=true;
      }
    }catch(e){}
    if(!done && ta){        // older WebViews: select the text so a long-press copy works
      ta.focus(); ta.select();
      try{ done=document.execCommand("copy"); }catch(e){}
    }
    if(status) status.textContent = done? "✓ Скопировано — сохрани текст в надёжном месте" : "Выдели текст и скопируй вручную";
    if(done){ DATA._lastBackup=Date.now(); scheduleSave(); }
  };

  const share=document.getElementById("bkShare");
  if(share) share.onclick=async()=>{
    const status=document.getElementById("bkStatus");
    if(await shareBackupFile()){
      DATA._lastBackup=Date.now(); scheduleSave();
      if(status) status.textContent="✓ Файл отправлен";
    } else if(status) status.textContent="Поделиться не вышло — используй «Скопировать»";
  };

  const restore=document.getElementById("bkRestore");
  if(restore) restore.onclick=()=>{
    const ta=document.getElementById("bkPaste");
    if(!ta || !ta.value.trim()){ flashError(ta,"Вставь текст бэкапа"); return; }
    importBackupText(ta.value);
  };
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      DATA=parsed;
      if(!DATA.plan) DATA.plan={};
      if(!DATA.journal) DATA.journal={};
      if(!DATA.reminders) DATA.reminders=[];
      if(!DATA.todos) DATA.todos=[];
      applyAppearance();
      if(!DATA.planCats||!DATA.planCats.length) DATA.planCats=PLAN_CATS.map(([name,color])=>({name,color}));
      if(!DATA.financeCats||!DATA.financeCats.length) DATA.financeCats=FINANCE_CATS_DEFAULT.map((name,i)=>({name,color:CAT_PALETTE[i%CAT_PALETTE.length]}));
      if(!DATA.finance) DATA.finance={entries:[]};
      if(!DATA.finance.recurring) DATA.finance.recurring=[];
      ensureFinanceAccounts();
      if(!DATA.habits.notes) DATA.habits.notes={};
      if(!DATA.habits.types) DATA.habits.types={};
      if(!DATA.habits.counterTargets) DATA.habits.counterTargets={};
      if(!DATA.habits.counts) DATA.habits.counts={};
      if(!DATA.habits.frozen) DATA.habits.frozen={};
      if(!DATA.habits.times) DATA.habits.times={};
      if(!DATA.habits.archived) DATA.habits.archived={};
      ensureSavingsGoals();
      applyRecurring();
      scheduleSave(); render();
      showBanner("✅ Бэкап загружен");
    }catch(e){ showBanner("⚠️ Не удалось прочитать файл бэкапа"); }
  };
  reader.readAsText(file);
}
function maybeAutoBackup(){
  const now=Date.now();
  const week=7*24*60*60*1000;
  if(DATA._lastBackup==null){
    // first ever run: just set the baseline, don't trigger a download yet
    DATA._lastBackup=now;
    scheduleSave();
    return;
  }
  if(now-DATA._lastBackup>week){
    exportBackup(true);
    DATA._lastBackup=now;
    scheduleSave();
  }
}

loadData();
attachSwipe();
</script>
