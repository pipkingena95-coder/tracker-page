// Only meaningful inside Telegram, where the bot can offer tappable buttons.
// Kept here so both builds expose the same surface.
function applyHabitMark(idx, dateStr, sig){
  const parts=String(dateStr||"").split("-").map(Number);
  if(parts.length!==3 || !parts[0]) return false;
  const [y,mo,d]=parts;
  const date=new Date(y, mo-1, d);
  if(isNaN(date.getTime())) return false;
  if(!DATA.habits.list || idx<0 || idx>=DATA.habits.list.length) return false;
  // подпись защищает от съехавших индексов: привычку могли удалить или
  // переименовать уже после того, как кнопка ушла в чат
  if(sig && habitSig(DATA.habits.list[idx])!==sig) return false;
  if(isHabitDoneOn(idx, date)) return false;    // already done — nothing to do
  const key=`${y}-${mo-1}`;
  if(habitType(idx)==='counter'){
    DATA.habits.counts=DATA.habits.counts||{};
    DATA.habits.counts[key]=DATA.habits.counts[key]||{};
    DATA.habits.counts[key][idx]=DATA.habits.counts[key][idx]||{};
    DATA.habits.counts[key][idx][d]=habitCounterTarget(idx);
  } else {
    DATA.habits.checks[key]=DATA.habits.checks[key]||{};
    DATA.habits.checks[key][idx]=DATA.habits.checks[key][idx]||[];
    if(DATA.habits.checks[key][idx].indexOf(d)<0) DATA.habits.checks[key][idx].push(d);
  }
  const fr=DATA.habits.frozen && DATA.habits.frozen[key] && DATA.habits.frozen[key][idx];
  if(fr){ const fi=fr.indexOf(d); if(fi>=0) fr.splice(fi,1); }
  clearHabitFail(idx, key, d);
  markHabitTime(idx, key, d);
  return true;
}

// "60x10, 70x8 80x6" -> [{w:60,r:10},...]. Accepts x / х / * / × as the separator,
// and a bare number is read as reps with no weight (body-weight sets).
function parseSets(str){
  const out=[];
  (str||"").split(/[,;\n]+/).forEach(part=>{
    part.split(/\s+/).forEach(tok=>{
      const t=tok.trim().replace(",",".");
      if(!t) return;
      const m=t.match(/^(\d+(?:\.\d+)?)[xXхХ*×](\d+)$/);
      if(m){ out.push({w:parseFloat(m[1]), r:parseInt(m[2],10)}); return; }
      const only=t.match(/^(\d+)$/);
      if(only) out.push({w:0, r:parseInt(only[1],10)});
    });
  });
  return out;
}
function exerciseVolume(sets){ return sets.reduce((s,x)=>s+x.w*x.r,0); }
function workoutVolume(w){ return (w.exercises||[]).reduce((s,e)=>s+exerciseVolume(parseSets(e.sets)),0); }
function workoutsInMonth(y,m){
  const pre=`${y}-${pad2(m+1)}`;
  return (DATA.workouts||[]).filter(w=>w.date && w.date.slice(0,7)===pre);
}
function daysSinceLastWorkout(){
  const dated=(DATA.workouts||[]).filter(w=>w.date).map(w=>w.date).sort();
  if(!dated.length) return null;
  const last=parseLocalDate(dated[dated.length-1]);
  if(!last) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.max(0, Math.round((t.getTime()-last.getTime())/86400000));
}
// Best single set (by weight) per exercise name — a simple personal-record board.

        if(!pr[k] || s.w>pr[k].w) pr[k]={name, w:s.w, r:s.r, date:w.date||""};
      });

  return Object.values(pr).sort((a,b)=>b.w-a.w);
}

function parseKg(v){
  const n=parseFloat(String(v==null?"":v).replace(",","."));
  return isFinite(n) && n>0 ? n : 0;
}
// One point per day: if a day has several workouts, the latest weigh-in wins.
function weightSeries(){
  const byDate={};
  (DATA.workouts||[]).forEach(w=>{
    const kg=parseKg(w.weight);
    if(!w.date || !kg) return;
    const prev=byDate[w.date];
    if(!prev || (w.time||"")>=prev.time) byDate[w.date]={kg, time:w.time||""};
  });
  // вес, вписанный в «Здоровье → Вес», важнее веса из тренировки того же дня
  const own=(DATA.health && DATA.health.weight) || {};
  Object.keys(own).forEach(d=>{ const kg=parseKg(own[d]); if(kg) byDate[d]={kg, time:"99:99"}; });
  return Object.keys(byDate).sort().map(d=>({date:d, kg:byDate[d].kg}));
}
function dayWeight(list){
  let best=null;
  list.forEach(w=>{
    const kg=parseKg(w.weight);
    if(!kg) return;
    if(!best || (w.time||"")>=best.time) best={kg, time:w.time||""};
  });
  return best? best.kg : 0;
}
function fmtKg(n){ return `${(+n).toLocaleString('ru-RU',{maximumFractionDigits:1})} кг`; }
function fmtDelta(n){
  if(Math.abs(n)<0.05) return "без изменений";
  return `${n>0?"+":"−"}${Math.abs(n).toLocaleString('ru-RU',{maximumFractionDigits:1})} кг`;
}
// Body weight moves in a narrow band, so this chart autoscales to min/max
// instead of anchoring at zero — otherwise the line looks perfectly flat.
function drawRangeLine(canvasId, labels, values, color){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const {ctx,W,H}=setupCanvas(canvas);
  if(!values.length) return;
  const padL=8, padR=40, padT=12, padB=18;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const mn=Math.min(...values), mx=Math.max(...values);
  const span=Math.max(0.6, mx-mn);
  const lo=mn-span*0.28, hi=mx+span*0.28;
  const n=values.length;
  const stepX = n>1? chartW/(n-1) : 0;
  const yOf=v=>padT+chartH-((v-lo)/(hi-lo))*chartH;
  const pts=values.map((v,i)=>[padL+(n>1?i*stepX:chartW/2), yOf(v)]);

  ctx.strokeStyle=cssVar("--border"); ctx.lineWidth=1;
  [mn,mx].forEach(v=>{
    const y=yOf(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  });
  if(pts.length>1){
    const grad=ctx.createLinearGradient(0,padT,0,padT+chartH);
    grad.addColorStop(0, color+"44"); grad.addColorStop(1, color+"05");
    ctx.beginPath(); ctx.moveTo(pts[0][0],padT+chartH);
    pts.forEach(p=>ctx.lineTo(p[0],p[1]));
    ctx.lineTo(pts[pts.length-1][0],padT+chartH); ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.stroke();
  }
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2.6,0,7); ctx.fillStyle=color; ctx.fill(); });

  ctx.font="9px 'JetBrains Mono',monospace"; ctx.fillStyle=cssVar("--grey");
  ctx.textAlign="left";
  ctx.fillText(mx.toLocaleString('ru-RU',{maximumFractionDigits:1}), W-padR+5, yOf(mx)+3);
  if(mx!==mn) ctx.fillText(mn.toLocaleString('ru-RU',{maximumFractionDigits:1}), W-padR+5, yOf(mn)+3);
  ctx.textAlign="center";
  const step=Math.max(1,Math.ceil(n/6));
  labels.forEach((l,i)=>{ if(i%step===0 || i===n-1) ctx.fillText(l, pts[i][0], H-4); });
}

function renderWorkoutDayGroups(list){
  const groups={};
  list.forEach(w=>{ const k=w.date||""; (groups[k]=groups[k]||[]).push(w); });

  const ts=todayStr();
  return dates.map(date=>{
    const day=groups[date].slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    const dt=parseLocalDate(date);
    const wd=dt? WEEKDAYS[(dt.getDay()+6)%7] : "";
    const label=dt? `${dt.getDate()} ${MONTHS_RU[dt.getMonth()].toLowerCase()}` : "без даты";
    const mins=day.reduce((s,w)=>s+(+w.duration||0),0);
    const vol=day.reduce((s,w)=>s+workoutVolume(w),0);
    const km=day.reduce((s,w)=>s+(+w.distance||0),0);
    const sum=[day.map(w=>w.type||"Тренировка").join(" + ")];
    if(mins) sum.push(fmtDuration(mins));
    if(km) sum.push(`${km.toLocaleString('ru-RU',{maximumFractionDigits:1})} км`);
    if(vol) sum.push(`${Math.round(vol).toLocaleString('ru-RU')} кг`);
    const dw=dayWeight(day);
    if(dw) sum.push(`⚖ ${fmtKg(dw)}`);
    return `<div class="wk-day">
      <div class="wk-day-head">
        <span class="wd">${wd}</span>
        <span class="dt">${label}</span>
        ${date===ts? '<span class="tdy">сегодня</span>':''}
        <span class="sum">${escapeHtml(sum.join(" · "))}</span>
      </div>

// ═════════ КУРС USDT С RAPIRA ═════════
// Rapira отдаёт курс только своему сайту (CORS), и из WebView запрос к ней
// блокируется. Поэтому спрашивает оболочка (приложение 2.5+, AndroidHost.httpGet),
// а без неё курс USDT остаётся с CoinGecko — и везде подписано, откуда он.
const RAPIRA_URL="https://api.rapira.net/open/market/rates";
let httpSeq=0;
const httpWait={};
window.__httpDone=function(id, code, body){ const w=httpWait[id]; if(!w) return; delete httpWait[id]; w(code, body); };
function nativeHttp(){ return typeof AndroidHost!=="undefined" && typeof AndroidHost.httpGet==="function"; }
function nativeGet(url, ms){
  return new Promise((resolve, reject)=>{
    if(!nativeHttp()){ reject(new Error("no native http")); return; }
    const id="h"+(++httpSeq);
    const t=setTimeout(()=>{ delete httpWait[id]; reject(new Error("timeout")); }, ms||15000);
    httpWait[id]=(code, body)=>{ clearTimeout(t); (code>=200 && code<300) ? resolve(body) : reject(new Error("http "+code)); };
    let ok=false;
    try{ ok=AndroidHost.httpGet(id, url); }catch(e){ ok=false; }
    if(!ok){ clearTimeout(t); delete httpWait[id]; reject(new Error("refused")); }
  });
}
async function fetchRapiraUsdt(){
  const j=JSON.parse(await nativeGet(RAPIRA_URL, 15000));
  const row=((j && j.data) || []).find(x=>x && x.symbol==="USDT/RUB");
  const rate=row ? +row.close : 0;
  if(!(rate>0)) throw new Error("нет USDT/RUB");
  return {rate, bid:+row.bidPrice||0, ask:+row.askPrice||0};
}
function fmtRate(v){ return (+v).toLocaleString('ru-RU',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function rateLineHtml(){
  const p=DATA.prices||{};
  const when=x=> x? new Date(x).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : "";
  const bits=[];
  if(+p.usdtRub>0){
    bits.push(`<span>₮ ${fmtRate(p.usdtRub)} ₽ <small>Rapira${p.usdtAt? ", "+when(p.usdtAt) : ""}</small></span>`);
    if(+p.usdRub) bits.push(`<span>$ ${fmtRate(p.usdRub)} ₽ <small>${escapeHtml(p.src||"")}</small></span>`);
  } else if(+p.usdRub){
    bits.push(`<span>₮ и $ ${fmtRate(p.usdRub)} ₽ <small>${escapeHtml(p.src||"")}${p.updated? ", "+when(p.updated) : ""}</small></span>`);
  }
  if(+p.eurRub) bits.push(`<span>€ ${fmtRate(p.eurRub)} ₽</span>`);
  if(!bits.length) bits.push(`<span>Курс ещё не загружался</span>`);
  const note = !(+p.usdtRub>0) && isNativeShell() && !nativeHttp()
    ? `<span class="note">Курс USDT с Rapira — в приложении 2.5: Rapira пускает к курсу только через приложение.</span>` : "";
  return `<div class="acc2-rates">${bits.join("")}<button data-fxrates="1">${pricesLoading? "Обновляю…" : "⟳ Обновить"}</button>${note}</div>`;
}

function bindWorkoutSheet(s){
  const root=sheetRoot(), w=workoutById(s.id);

  const save=()=>{ scheduleSave(); render(); };
  root.querySelectorAll('[data-wst]').forEach(b=>b.onclick=()=>{ w.type=b.dataset.wst; save(); });
  root.querySelectorAll('[data-wsf]').forEach(el=>el.onchange=()=>{ w[el.dataset.wsf]=el.value.trim(); save(); });
  root.querySelectorAll('[data-wsfeel]').forEach(b=>b.onclick=()=>{ w.feeling = String(w.feeling||"")===b.dataset.wsfeel ? "" : b.dataset.wsfeel; save(); });
  root.querySelectorAll('[data-wse]').forEach(el=>el.onchange=()=>{
    const [ei,f]=el.dataset.wse.split(":");
    const e=w.exercises[+ei];
    if(!e) return;
    e[f]=el.value;
    if(f==="name"){
      if(!(e.sets||"").trim()){ const prev=lastSetsFor(el.value); if(prev) e.sets=prev; }
      addExerciseToLib(el.value);
    }
    save();
  });
  root.querySelectorAll('[data-wsexdel]').forEach(b=>b.onclick=()=>{
    const ei=+b.dataset.wsexdel, n=(w.exercises[ei]||{}).name||"без названия";
    deleteWithUndo(`Упражнение «${n}»`, ()=>w.exercises.splice(ei,1));
  });
  root.querySelectorAll('[data-wsexq]').forEach(b=>b.onclick=()=>{ w.exercises.push({name:b.dataset.wsexq, sets:lastSetsFor(b.dataset.wsexq)}); save(); });
  root.querySelectorAll('[data-wsexadd]').forEach(b=>b.onclick=()=>{
    w.exercises.push({name:"", sets:""}); save();
    const last=document.getElementById(`wsEx${w.exercises.length-1}n`); if(last) last.focus();
  });
  const del=document.getElementById("wsDel");
  if(del) del.onclick=()=>{
    const i=DATA.workouts.indexOf(w);
    cur.sheet=null; closeSheet();
    if(i>=0) deleteWithUndo(`Тренировка ${w.type||""}`.trim(), ()=>DATA.workouts.splice(i,1));
  };
}

  return hero + accCard + trCard;

// ---------- TODOS (one-off tasks with deadline/priority, unlike the daily "Задачи" checklist) ----------
const TODO_PRIORITY_WEIGHT={high:0, medium:1, low:2};
// ═════════ ПРИВЫЧКИ: ДНИ НЕДЕЛИ И УДАЛЕНИЕ ═════════
// Привычка — это дело, которое повторяется. Раньше повторяться она могла только
// каждый день; теперь — и по выбранным дням: «по пятницам выводить прибыль»
// появляется в списке по пятницам, а серия не рвётся в остальные дни.
const WD_SHORT=["пн","вт","ср","чт","пт","сб","вс"];
function habitDays(idx){
  const d=DATA.habits.days && DATA.habits.days[idx];
  return Array.isArray(d) && d.length && d.length<7 ? d.slice().sort((a,b)=>a-b) : null;
}
function habitScheduledOn(idx, date){
  if(modeOffHabit(idx, date)) return false;
  const d=habitDays(idx);
  return !d || d.includes((date.getDay()+6)%7);
}
function habitDaysLabel(idx){
  const d=habitDays(idx);
  if(!d) return "каждый день";
  const k=d.join();
  if(k==="0,1,2,3,4") return "по будням";
  if(k==="5,6") return "по выходным";
  return d.map(i=>WD_SHORT[i]).join(", ");
}
function setHabitDays(idx, days){
  DATA.habits.days=DATA.habits.days||{};
  const uniq=[...new Set((days||[]).map(Number).filter(x=>x>=0 && x<=6))].sort((a,b)=>a-b);
  if(!uniq.length || uniq.length===7) delete DATA.habits.days[idx];
  else DATA.habits.days[idx]=uniq;
}
function monthKeyOf(d){ return `${d.getFullYear()}-${d.getMonth()}`; }
function activeHabitsOn(date){
  return activeHabitIdx().filter(idx=>habitScheduledOn(idx,date) || isHabitDoneOn(idx,date));
}

// Всё про привычки лежит по её номеру в списке: отметки, счётчики, заморозки,
// типы, цели, заметки, архив, дни недели. Раньше удалялось только имя, а данные
// оставались на местах — и следующая привычка получала чужие галочки и серии.
// Теперь номера сдвигаются везде разом.
function removeHabit(idx){
  const H=DATA.habits;
  idx=+idx;
  if(!(idx>=0 && idx<H.list.length)) return;
  H.list.splice(idx,1);
  try{ modesShiftHabit(idx); }catch(e){}
  const shift=obj=>{
    if(!obj || typeof obj!=="object") return obj;
    const out={};
    Object.keys(obj).forEach(k=>{
      const i=Number(k);
      if(!Number.isInteger(i)){ out[k]=obj[k]; return; }
      if(i<idx) out[i]=obj[k];
      else if(i>idx) out[i-1]=obj[k];
    });
    return out;
  };
  ["types","counterTargets","goals","notes","archived","days","auto"].forEach(f=>{ if(H[f]) H[f]=shift(H[f]); });
  ["checks","counts","frozen","times","failed","failWhy","autoDone"].forEach(f=>{
    if(!H[f]) return;
    Object.keys(H[f]).forEach(mkey=>{ H[f][mkey]=shift(H[f][mkey]); });
  });
}

// Галочка в списке — «сделано / не сделано», без заморозки: пропуск без разрыва
// серии ставится в карточке привычки. У счётчика — плюс один до цели, потом сброс.
function toggleHabitToday(idx){
  const d=new Date(), key=monthKeyOf(d), day=d.getDate();
  const H=DATA.habits;
  const fr=H.frozen && H.frozen[key] && H.frozen[key][idx];
  if(fr){ const fi=fr.indexOf(day); if(fi>=0) fr.splice(fi,1); }
  clearHabitFail(idx, key, day);
  const clearTime=()=>{ if(H.times && H.times[key] && H.times[key][idx]) delete H.times[key][idx][day]; };
  if(habitType(idx)==='counter'){
    H.counts=H.counts||{}; H.counts[key]=H.counts[key]||{}; H.counts[key][idx]=H.counts[key][idx]||{};
    const c=H.counts[key][idx], target=habitCounterTarget(idx), now=c[day]||0;
    if(now>=target){ delete c[day]; clearTime(); }
    else { c[day]=now+1; if(c[day]>=target) markHabitTime(idx,key,day); }
  } else {
    H.checks[key]=H.checks[key]||{}; H.checks[key][idx]=H.checks[key][idx]||[];
    const arr=H.checks[key][idx], di=arr.indexOf(day);
    if(di>=0){ arr.splice(di,1); clearTime(); }
    else { arr.push(day); markHabitTime(idx,key,day); }
  }
}
function setHabitStateToday(idx, state){
  const d=new Date(), key=monthKeyOf(d), day=d.getDate();
  const H=DATA.habits;
  const drop=arr=>{ if(!arr) return; const i=arr.indexOf(day); if(i>=0) arr.splice(i,1); };
  drop(H.checks[key] && H.checks[key][idx]);
  if(H.counts && H.counts[key] && H.counts[key][idx]) delete H.counts[key][idx][day];
  drop(H.frozen && H.frozen[key] && H.frozen[key][idx]);
  clearHabitFail(idx, key, day);
  if(H.times && H.times[key] && H.times[key][idx]) delete H.times[key][idx][day];
  if(state==="done"){
    if(habitType(idx)==='counter'){
      H.counts=H.counts||{}; H.counts[key]=H.counts[key]||{}; H.counts[key][idx]=H.counts[key][idx]||{};
      H.counts[key][idx][day]=habitCounterTarget(idx);
    } else {
      H.checks[key]=H.checks[key]||{}; H.checks[key][idx]=H.checks[key][idx]||[];
      H.checks[key][idx].push(day);
    }
    markHabitTime(idx,key,day);
  } else if(state==="skip"){
    H.frozen=H.frozen||{}; H.frozen[key]=H.frozen[key]||{}; H.frozen[key][idx]=H.frozen[key][idx]||[];
    H.frozen[key][idx].push(day);
  } else if(state==="fail"){
    habitFailArr(idx, key).push(day);
  }
}
function addHabitItem(name, days){
  const H=DATA.habits;
  const idx=H.list.length;
  H.list.push(name);
  if(days) setHabitDays(idx, days);
  return idx;
}
function findHabitByName(name){
  const n=String(name||"").trim().toLowerCase();
  return DATA.habits.list.findIndex((x,i)=>!isHabitArchived(i) && String(x||"").trim().toLowerCase()===n);
}

// ---------- ПОВТОРЯЮЩИЕСЯ ДЕЛА ----------
// «Каждый месяц 10 числа платить аренду» — не привычка с серией, а дело, которое
// само появляется снова, когда его отметишь.
function nextRepeatDate(t){
  const today=new Date(); today.setHours(0,0,0,0);
  const base=parseLocalDate(t.dueDate) || new Date(today);
  let d=new Date(base);
  const step=()=>{
    if(t.repeat.every==="week"){ d.setDate(d.getDate()+7); return; }
    const want=t.repeat.day || base.getDate();
    const n=new Date(d.getFullYear(), d.getMonth()+1, 1);
    n.setDate(Math.min(want, daysInMonth(n.getFullYear(), n.getMonth())));
    d=n;
  };
  step();
  // отметил просроченный повтор — следующий не должен сразу родиться просроченным
  let guard=0;
  while(d<=today && guard++<400) step();
  return ymdOf(d);
}
function toggleTodo(i){
  const t=DATA.todos && DATA.todos[i];
  if(!t) return;
  if(!t.done){
    t.done=true; t.doneAt=Date.now();
    if(t.repeat && !t.spawnedId){
      const next={id:Date.now()+1, text:t.text, done:false, dueDate:nextRepeatDate(t),
        priority:t.priority||"medium", createdAt:Date.now(), repeat:{...t.repeat}};
      DATA.todos.push(next);
      t.spawnedId=next.id;
    }
  } else {
    t.done=false; delete t.doneAt;
    if(t.spawnedId){
      const j=DATA.todos.findIndex(x=>x.id===t.spawnedId && !x.done);
      if(j>=0) DATA.todos.splice(j,1);
      delete t.spawnedId;
    }
  }
}

// ---------- «КАЖДЫЙ ДЕНЬ», «ПО ПЯТНИЦАМ», «КАЖДЫЙ МЕСЯЦ» ----------
const WD_FORMS=[["понедельник",0],["пн",0],["вторник",1],["вт",1],["сред",2],["ср",2],["четверг",3],["чт",3],
  ["пятниц",4],["пт",4],["суббот",5],["сб",5],["воскресен",6],["вс",6]];
function parseRecurrence(raw){
  let s=" "+String(raw||"").replace(/\s+/g," ").trim()+" ";
  const END="(?=[\\s,.!?;:]|$)";
  const cut=re=>{ const m=s.match(re); if(m) s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length); return m; };
  const WD="(?:понедельник\\p{L}*|вторник\\p{L}*|сред\\p{L}*|четверг\\p{L}*|пятниц\\p{L}*|суббот\\p{L}*|воскресен\\p{L}*|пн|вт|ср|чт|пт|сб|вс)";
  let kind=null, days=null, repeat=null, m;
  if(cut(new RegExp("\\s(?:каждый\\s+день|каждый\\s+божий\\s+день|ежедневно|каждодневно|каждое\\s+утро|каждый\\s+вечер|каждую\\s+ночь|по\\s+утрам|по\\s+вечерам|каждый\\s+раз)"+END,"iu"))) kind="habit";
  else if(cut(new RegExp("\\s(?:по\\s+будням|в\\s+будни|каждый\\s+будний\\s+день|по\\s+рабочим\\s+дням)"+END,"iu"))){ kind="habit"; days=[0,1,2,3,4]; }
  else if(cut(new RegExp("\\s(?:по\\s+выходным|в\\s+выходные|каждые\\s+выходные)"+END,"iu"))){ kind="habit"; days=[5,6]; }
  else if((m=cut(new RegExp("\\s(?:по|каждый|каждую|каждое|каждые)\\s+("+WD+"(?:(?:\\s*,\\s*|\\s+и\\s+|\\s+)"+WD+")*)"+END,"iu")))){
    const found=[];
    m[1].toLowerCase().split(/\s*,\s*|\s+и\s+|\s+/).forEach(w=>{
      const hit=WD_FORMS.find(([k])=> k.length<=2 ? w===k : w.startsWith(k));
      if(hit && !found.includes(hit[1])) found.push(hit[1]);
    });
    if(found.length){ kind="habit"; days=found.sort((a,b)=>a-b); }
  }
  else if(cut(new RegExp("\\s(?:каждую\\s+неделю|раз\\s+в\\s+неделю|еженедельно)"+END,"iu"))){ kind="todo"; repeat={every:"week"}; }
  else if(cut(new RegExp("\\s(?:каждый\\s+месяц|раз\\s+в\\s+месяц|ежемесячно|каждого\\s+месяца)"+END,"iu"))){ kind="todo"; repeat={every:"month"}; }
  if(!kind) return null;
  return {kind, days, repeat, rest:s.replace(/\s+/g," ").trim()};
}

// Из текста — голосового или набранного — привычки и дела. Голос делит
// перечисление на пункты; набранное остаётся одним пунктом.
function createFromText(raw, opts){
  opts=opts||{};
  const split=opts.split && (DATA.settings||{}).voiceSplit!==false;
  const chunks=split ? splitTodoList(raw) : [{text:String(raw||"").trim(), fromList:false}];
  const res={habits:[], todos:[], dup:[]};
  const plain=[];
  chunks.forEach(ch=>{
    const r=parseRecurrence(ch.text);
    if(r && r.kind==="habit"){
      const name=parseTodoSpeech(r.rest).text;
      if(!name) return;
      const exist=findHabitByName(name);
      if(exist>=0){
        res.dup.push(name);
        if(r.days) setHabitDays(exist, r.days);
        return;
      }
      res.habits.push({idx:addHabitItem(name, r.days), name, days:r.days});
    } else if(r && r.kind==="todo"){
      const t=parseTodoSpeech(r.rest);
      if(!t.text) return;
      const due=t.dueDate || todayStr();
      const rep={every:r.repeat.every};
      if(rep.every==="month") rep.day=(parseLocalDate(due)||new Date()).getDate();
      res.todos.push({...t, dueDate:due, repeat:rep});
    } else if(ch.text) plain.push(ch);
  });
  if(plain.length){
    const items = split ? parseTodoList(plain, opts.base) : [parseTodoSpeech(plain[0].text, opts.base)];
    items.filter(x=>x.text).forEach(x=>res.todos.push(x));
  }
  if(!DATA.todos) DATA.todos=[];
  const base=Date.now();
  res.todos=res.todos.map((t,i)=>{
    const id=base+i;
    const item={id, text:t.text, done:false, dueDate:t.dueDate||"", priority:t.priority||"medium", createdAt:id};
    if(t.repeat) item.repeat=t.repeat;
    if(opts.voice) item.voice=true;
    DATA.todos.push(item);
    return item;
  });
  cur.freshTodos=res.todos.map(t=>t.id);
  cur.freshHabits=res.habits.map(h=>h.idx);
  setTimeout(()=>{ cur.freshTodos=null; cur.freshHabits=null; }, 2600);
  return res;
}
function undoCreated(res){
  const ids=res.todos.map(t=>t.id);
  DATA.todos=(DATA.todos||[]).filter(x=>!ids.includes(x.id));
  res.habits.map(h=>h.idx).sort((a,b)=>b-a).forEach(removeHabit);
}
function createdToast(res){
  const n=res.habits.length+res.todos.length;
  if(!n){
    if(res.dup.length) showActionToast(`«${res.dup[0]}» уже есть в привычках`);
    return;
  }
  const undo=()=>{ undoCreated(res); scheduleSave(); render(); };
  if(n===1){
    if(res.habits.length){
      const h=res.habits[0];
      showActionToast(`Новая привычка: «${h.name}» · ${habitDaysLabel(h.idx)}`, "Отменить", undo);
    } else {
      const t=res.todos[0], bits=[];
      if(t.dueDate) bits.push(dueLabel(t.dueDate));
      if(t.priority==="high") bits.push("срочно");
      if(t.repeat) bits.push(t.repeat.every==="week"? "каждую неделю" : "каждый месяц");
      showActionToast(`Добавлено: «${t.text}»${bits.length? " · "+bits.join(", "):""}`, "Отменить", undo);
    }
    return;
  }
  const parts=[];
  if(res.todos.length) parts.push(`${res.todos.length} ${plural(res.todos.length,'дело','дела','дел')}`);
  if(res.habits.length) parts.push(`${res.habits.length} ${plural(res.habits.length,'привычка','привычки','привычек')}`);
  const names=[...res.habits.map(h=>h.name), ...res.todos.map(t=>t.text)].map(x=>"«"+x+"»").join(", ");
  showActionToast(`Добавлено ${parts.join(" и ")}: ${names}`, "Отменить", undo, 7000);
}

// ═════════ ДЕЛА: ВСЁ В ОДНОМ СПИСКЕ ═════════
// «Ритм» и «Дела» были двумя вкладками про одно — что сделать. Теперь сверху
// всё на сегодня, и привычки, и дела, по срочности: просроченное, серии под
// угрозой, сегодняшнее; сделанное — вниз. Дальше — завтра, неделя, позже, без
// срока. Привычка отмечается квадратной галочкой, дело — круглой.
const CHECK_SVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function doTodoMeta(t){
  const ts=todayStr(), bits=[];
  if(t.dueDate){
    if(!t.done && t.dueDate<ts){
      const days=Math.max(1, Math.round((parseLocalDate(ts)-parseLocalDate(t.dueDate))/86400000));
      bits.push(`<b class="late">просрочено ${days} ${plural(days,'день','дня','дней')}</b>`);
    } else if(t.dueDate!==ts) bits.push(escapeHtml(dueLabel(t.dueDate)));
  }
  if(t.priority==="high" && !t.done) bits.push('<b class="hot">срочно</b>');
  else if(t.priority==="low") bits.push('не срочно');
  if(t.repeat) bits.push(t.repeat.every==="week"? "↻ каждую неделю" : "↻ каждый месяц");
  return bits.join(" · ");
}
function renderDoRow(item){
  if(item.kind==="habit"){
    const idx=item.idx, now=new Date();
    const done=isHabitDoneOn(idx,now), frozen=!done && isHabitFrozenOn(idx,now);
    const failed=!done && !frozen && isHabitFailedOn(idx,now);
    const streak=habitStreak(idx), type=habitType(idx);
    const cnt=type==="counter"? habitDailyCount(idx,now) : 0;
    // «каждый день» — это норма, её не подписываем; подписываем только расписание
    const bits=habitDays(idx)? [`<i class="do-kind">${escapeHtml(habitDaysLabel(idx))}</i>`] : [];
    if(type==="counter") bits.push(`${cnt} из ${habitCounterTarget(idx)}`);
    // серия, которую сегодня ещё можно потерять, — красным числом, без лишних слов
    if(streak>0) bits.push(!done && !frozen ? `<b class="hot" title="Серия прервётся, если не отметить сегодня">🔥 ${streak}</b>` : `🔥 ${streak}`);
    if(done && habitAutoDoneOn(idx,now)) bits.push("само ✓");
    if(frozen) bits.push("пропуск, серия цела");
    if(failed){ const w=habitFailWhy(idx,now); bits.push(`не смог${w? " — "+escapeHtml(w) : ""}`); }
    const fresh=(cur.freshHabits||[]).includes(idx);
    return `<div class="do-row habit ${done?'done':''} ${frozen?'frozen':''} ${failed?'failed':''} ${fresh?'fresh':''}">
      <button class="do-chk ${cnt>0 && !done?'part':''}" data-dotick="h:${idx}" aria-label="${done?'Снять отметку':'Отметить'}">${done? CHECK_SVG : frozen? '❄' : failed? '✕' : (cnt>0? cnt : '')}</button>
      <button class="do-main" data-doopen="h:${idx}"><span class="do-t">${escapeHtml(DATA.habits.list[idx]||"")}</span>${bits.length? `<span class="do-m">${bits.join(" · ")}</span>`:""}</button>
    </div>`;
  }
  const t=item.t, meta=doTodoMeta(t);
  const fresh=(cur.freshTodos||[]).includes(t.id);
  return `<div class="do-row todo ${t.done?'done':''} ${t.priority==='high' && !t.done?'hot':''} ${fresh?'fresh':''}">
    <button class="do-chk" data-dotick="t:${item.i}" aria-label="${t.done?'Вернуть в работу':'Сделано'}">${t.done? CHECK_SVG : ''}</button>
    <button class="do-main" data-doopen="t:${item.i}"><span class="do-t">${escapeHtml(t.text||"без названия")}</span>${meta? `<span class="do-m">${meta}</span>`:""}</button>
  </div>`;
}
function doGroups(){
  const ts=todayStr(), now=new Date();
  const tm=new Date(); tm.setDate(tm.getDate()+1);
  const tomorrow=ymdOf(tm);
  const wk=new Date(); wk.setDate(wk.getDate()+7);
  const weekEnd=ymdOf(wk);
  const todos=(DATA.todos||[]).map((t,i)=>({kind:"todo", t, i}));
  const rank=x=>({high:0, medium:1, low:2})[x.t.priority||"medium"] ?? 1;
  const byDue=(a,b)=> rank(a)-rank(b) || String(a.t.dueDate||"9").localeCompare(String(b.t.dueDate||"9")) || a.i-b.i;
  const doneToday=x=> x.t.done && x.t.doneAt && ymdOf(new Date(x.t.doneAt))===ts;
  const habits=activeHabitsOn(now).map(idx=>({kind:"habit", idx}));
  const hOpen=habits.filter(h=>!isHabitDoneOn(h.idx,now) && !isHabitFrozenOn(h.idx,now) && !isHabitFailedOn(h.idx,now))
    .sort((a,b)=>habitStreak(b.idx)-habitStreak(a.idx));
  const hDone=habits.filter(h=>isHabitDoneOn(h.idx,now) || isHabitFrozenOn(h.idx,now));
  const hFail=habits.filter(h=>!isHabitDoneOn(h.idx,now) && !isHabitFrozenOn(h.idx,now) && isHabitFailedOn(h.idx,now));
  const open=x=>!x.t.done;
  const overdue=todos.filter(x=>open(x) && x.t.dueDate && x.t.dueDate<ts).sort(byDue);
  const dueToday=todos.filter(x=>open(x) && x.t.dueDate===ts).sort(byDue);
  const tDone=todos.filter(doneToday);
  const today=[...overdue, ...hOpen.filter(h=>habitStreak(h.idx)>0), ...dueToday,
    ...hOpen.filter(h=>habitStreak(h.idx)===0), ...hDone, ...hFail, ...tDone];
  const total=habits.length+overdue.length+dueToday.length+tDone.length;
  const doneN=hDone.length+tDone.length;
  return {total, doneN, openHabits:hOpen.length, openTodos:overdue.length+dueToday.length, groups:[
    {id:"today", title:"Сегодня", items:today},
    {id:"tomorrow", title:"Завтра", items:todos.filter(x=>open(x) && x.t.dueDate===tomorrow).sort(byDue)},
    {id:"week", title:"На неделе", items:todos.filter(x=>open(x) && x.t.dueDate>tomorrow && x.t.dueDate<=weekEnd).sort(byDue)},
    {id:"later", title:"Позже", items:todos.filter(x=>open(x) && x.t.dueDate>weekEnd).sort(byDue)},
    {id:"nodate", title:"Без срока", items:todos.filter(x=>open(x) && !x.t.dueDate).sort(byDue)}
  ], done: todos.filter(x=>x.t.done && !doneToday(x)).sort((a,b)=>(b.t.doneAt||0)-(a.t.doneAt||0))};
}
function doHeadline(G){
  if(!G.total) return {t:"На сегодня пусто", s:"Продиктуй дела или привычки — они появятся здесь"};
  if(G.doneN>=G.total) return {t:"Всё на сегодня сделано", s:`${G.total} из ${G.total} — можно выдохнуть`};
  const left=G.total-G.doneN, parts=[];
  if(G.openTodos) parts.push(`${G.openTodos} ${plural(G.openTodos,'дело','дела','дел')}`);
  if(G.openHabits) parts.push(`${G.openHabits} ${plural(G.openHabits,'привычка','привычки','привычек')}`);
  return {t:`Осталось ${left}`, s:parts.join(" и ")};
}
function renderDoWeek(){
  const ids=activeHabitIdx();
  if(!ids.length && !(DATA.todos||[]).length) return "";
  const dates=getWeekDates(Date.now());
  const ts=todayStr();
  const head=dates.map(d=>`<span class="wd ${ymdOf(d)===ts?'now':''}">${WD_SHORT[(d.getDay()+6)%7]}</span>`).join("");
  const rows=ids.map(idx=>{
    let doneN=0, need=0;
    const cells=dates.map(d=>{
      const key=ymdOf(d);
      const done=isHabitDoneOn(idx,d), frozen=!done && isHabitFrozenOn(idx,d), sched=habitScheduledOn(idx,d);
      const future=key>ts;
      if(sched && !frozen) need++;
      if(done) doneN++;
      const cls=["dw-c"];
      if(done) cls.push("done"); else if(frozen) cls.push("frozen"); else if(isHabitFailedOn(idx,d)) cls.push("fail"); else if(!sched) cls.push("off");
      else if(!future && key<ts) cls.push("miss");
      if(future) cls.push("future");
      if(key===ts) cls.push("today");
      return future ? `<span class="${cls.join(" ")}"></span>`
        : `<button class="${cls.join(" ")}" data-dwcell="${idx}:${d.getFullYear()}-${d.getMonth()}-${d.getDate()}" aria-label="${escapeHtml(DATA.habits.list[idx])}, ${WD_SHORT[(d.getDay()+6)%7]}">${frozen?'❄' : isHabitFailedOn(idx,d)? '✕' : ''}</button>`;
    }).join("");
    const streak=habitStreak(idx);
    return `<div class="dw-row"><button class="dw-name" data-doopen="h:${idx}">${escapeHtml(DATA.habits.list[idx])}${habitDays(idx)? `<small>${escapeHtml(habitDaysLabel(idx))}</small>`:""}</button>
      <span class="dw-s">${streak>0? "🔥 "+streak : `${doneN} из ${need}`}</span></div>${cells}`;
  }).join("");
  return `<div class="card do-week">
    <div class="dw-head"><h2>Неделя</h2><button class="fx-linkbtn" data-gohabits="1">Месяц и год ›</button></div>
    <div class="dw-grid">${head}${todosWeekRow(dates)}${rows}</div>
    <div class="fx-hint">Дела — сколько закрыто за день. Привычки: ✓ → ❄ пропуск → ✕ не смог → пусто. Пунктир — не по расписанию.</div>
  </div>`;
}

function bindDoList(){

    const inp=document.getElementById("newDoText");

    if(!raw) return;
    const res=createFromText(raw, {split:false});
    inp.value="";
    scheduleSave(); render();
    const again=document.getElementById("newDoText");
    if(again) again.focus();
    createdToast(res);
  };
  const b=document.getElementById("doAdd");
  if(b) b.onclick=add;
  const inp=document.getElementById("newDoText");
  if(inp) inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
  const mic=document.getElementById("doMic");
  if(mic) mic.onclick=()=>voiceAddTodo(mic);
  document.querySelectorAll('[data-dotick]').forEach(el=>el.onclick=()=>{
    const [k,v]=el.dataset.dotick.split(":");
    if(k==="h") tickHabitUndo(+v, new Date(), ()=>toggleHabitToday(+v)); else tickTodoUndo(+v);
  });
  document.querySelectorAll('[data-doopen]').forEach(el=>el.onclick=()=>openSheet({kind:"doitem", ref:el.dataset.doopen}));
  document.querySelectorAll('[data-dwcell]').forEach(el=>el.onclick=()=>{
    const [idx,date]=el.dataset.dwcell.split(":");

    tickHabitUndo(+idx, new Date(y,m,d), ()=>cycleHabitDay(+idx, `${y}-${m}`, d));
  });
  document.querySelectorAll('[data-gohabits]').forEach(el=>el.onclick=()=>{ cur.sub.doing="habits"; cur.habitView="month"; render(); window.scrollTo(0,0); });
  const det=document.querySelector('.do-done');
  if(det) det.ontoggle=()=>{ cur.doneOpen=det.open; };
  const all=document.getElementById("doneAll");
  if(all) all.onclick=()=>{ cur.doneShowAll=true; render(); };
  const clr=document.getElementById("doneClear");

}

const FINANCE_CATS_DEFAULT=["Еда","Транспорт","Жильё","Развлечения","Здоровье","Другое"];
const CURRENCY_LIST=["RUB","USD","EUR","USDT"];
const CURRENCY_SYMBOL={RUB:"₽",USD:"$",EUR:"€",USDT:"₮"};
function ensureFinanceAccounts(){
  if(!DATA.finance.accounts || !DATA.finance.accounts.length){
    DATA.finance.accounts=[{id:1, name:"Основной", currency:"RUB", startBalance:0}];
  }
  DATA.finance.accounts.forEach(a=>{ if(a.startBalance==null) a.startBalance=0; });
  if(!DATA.finance.transfers) DATA.finance.transfers=[];
  if(!DATA.finance.catLimits) DATA.finance.catLimits={};
}
function defaultAccountId(){ return DATA.finance.accounts[0].id; }
// Starting balance lets the app match a real card/wallet without back-filling
// every historical transaction: set the number you actually have and go on.
function accountBalance(accId){
  const acc=(DATA.finance.accounts||[]).find(a=>String(a.id)===String(accId));
  let bal=acc? (+acc.startBalance||0) : 0;
  const accCur=acc? (acc.currency||"RUB") : "RUB";
  DATA.finance.entries.forEach(e=>{
    if(String(e.accountId||defaultAccountId())!==String(accId)) return;
    // запись может быть в другой валюте — приводим к валюте счёта
    const v=entryIn(e, accCur);
    if(e.type==="доход") bal+=v; else bal-=v;
  });
  (DATA.finance.transfers||[]).forEach(t=>{
    if(String(t.fromAccountId)===String(accId)) bal-=(+t.amount||0);
    if(String(t.toAccountId)===String(accId)) bal+=(+t.toAmount||+t.amount||0);
  });
  return bal;
}
// RUB accounts are treated as the "primary" spending accounts: budget, category
// breakdown, and the month-end projection only look at them, so a separate
// crypto/foreign-currency account (e.g. USDT income) doesn't skew those numbers.
// Строками, а не как лежит в данных: форма добавления пишет accountId строкой,
// а у счёта id числовой. Set.has("1") при наборе из чисел — false, и запись
// молча выпадала из бюджета, прогноза и категорий.
// ---------- ВАЛЮТА У САМОЙ ЗАПИСИ ----------
// Раньше валюта бралась только от счёта: чтобы записать доход в долларах,
// приходилось заводить долларовый счёт. Теперь валюту можно указать прямо при
// вводе. У старых записей поля нет — для них всё работает ровно как прежде.
function accountCurrency(accId){
  const a=(DATA.finance.accounts||[]).find(x=>String(x.id)===String(accId));
  return a? (a.currency||"RUB") : "RUB";
}
function entryCurrency(e){ return e.currency || accountCurrency(e.accountId||defaultAccountId()); }
function isRubEntry(e){ return entryCurrency(e)==="RUB"; }
// Пересчёт в нужную валюту. Курса нет — возвращаем как есть, а не делаем вид,
// что пересчитали.
function entryIn(e, curr){
  const v=+e.amount||0, from=entryCurrency(e);
  if(from===curr) return v;
  const c=convertMoney(v, from, curr);
  return c==null? v : c;
}
function finCurrencies(){
  // валюты, которые реально есть у счетов, плюс рубль — чтобы список не рос зря
  const set=new Set(["RUB"]);
  (DATA.finance.accounts||[]).forEach(a=>set.add(a.currency||"RUB"));
  (DATA.finance.entries||[]).forEach(e=>{ if(e.currency) set.add(e.currency); });
  return CURRENCY_LIST.filter(c=>set.has(c));
}

function rubAccountIds(){ return new Set(DATA.finance.accounts.filter(a=>a.currency==="RUB").map(a=>String(a.id))); }
function currencyTotals(){
  const totals={};
  const accCurrency={};
  // the balance is summed per account so starting balances and transfers are
  // both included; income/expense stay transaction-only for the two side boxes
  DATA.finance.accounts.forEach(a=>{
    accCurrency[a.id]=a.currency;
    if(!totals[a.currency]) totals[a.currency]={income:0,expense:0,bal:0};
    totals[a.currency].bal+=accountBalance(a.id);
  });
  DATA.finance.entries.forEach(e=>{
    const curr=entryCurrency(e);
    if(!totals[curr]) totals[curr]={income:0,expense:0,bal:0};
    if(e.type==="доход") totals[curr].income+=(+e.amount||0); else totals[curr].expense+=(+e.amount||0);
  });
  return totals;
}
function filterFinanceEntries(entries){
  const f=cur.finFilter||{};
  return entries.map((e,i)=>({...e,_i:i})).filter(e=>{
    if(f.type && e.type!==f.type) return false;
    if(f.accountId && String(e.accountId||defaultAccountId())!==String(f.accountId)) return false;
    // «__none__» — записи вообще без категории: пустая строка в фильтре значит
    // «все», поэтому для «Без категории» нужен отдельный маркер
    if(f.category==="__none__"){ if(e.category) return false; }
    else if(f.category && e.category!==f.category) return false;
    if(f.from && e.date && e.date<f.from) return false;
    if(f.to && e.date && e.date>f.to) return false;
    if(f.q){
      const q=f.q.toLowerCase();
      const hay=`${e.comment||''} ${e.category||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

// Auto-generates a finance entry for each recurring template (subscription,
// salary, rent, ...) once per month, on/after its configured day-of-month.
// Idempotent: won't duplicate an entry already generated for this month.
//
// Раньше смотрели только на текущий месяц: не открыл приложение два месяца —
// подписки за них не появлялись никогда, и история молча врала. Теперь месяцы
// добираются назад, но не раньше, чем шаблон завели (since), чтобы не выдумать
// год списаний задним числом.
const RECURRING_BACKFILL_MONTHS=11;
function applyRecurring(){
  if(!DATA.finance.recurring || !DATA.finance.recurring.length) return;
  const now=new Date();
  const thisMonth=`${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const fallbackAccId=(DATA.finance.accounts && DATA.finance.accounts[0] && DATA.finance.accounts[0].id) || 1;
  let changed=false;
  DATA.finance.recurring.forEach(r=>{
    // у старых шаблонов даты заведения нет — считаем, что они начинаются сейчас
    if(!r.since){ r.since=thisMonth; changed=true; }
    for(let back=RECURRING_BACKFILL_MONTHS; back>=0; back--){
      const d=new Date(now.getFullYear(), now.getMonth()-back, 1);
      const y=d.getFullYear(), m=d.getMonth();
      const prefix=`${y}-${pad2(m+1)}`;
      if(prefix<r.since) continue;
      const nd=daysInMonth(y,m);
      const day=Math.max(1,Math.min(31,+r.day||1,nd));
      if(back===0 && now.getDate()<day) continue;      // в этом месяце день ещё не наступил
      if(DATA.finance.entries.some(e=>e.recurringId===r.id && e.date && e.date.slice(0,7)===prefix)) continue;
      DATA.finance.entries.push({
        date:`${prefix}-${pad2(day)}`,
        amount:+r.amount||0,
        type:r.type==="доход"?"доход":"расход",
        category:r.category||"",
        comment:r.comment||"",
        accountId:r.accountId||fallbackAccId,
        recurringId:r.id
      });
      changed=true;
    }
  });
  if(changed) scheduleSave();
}

// Quick add: one big amount field, tap-to-pick category and account, and the
// draft keeps type/category/account after saving so a run of entries is fast.
// ---------- BULK TEXT ENTRY ----------
// "такси 450, кофе 180, продукты 2300" in one go. The amount is the last number in
// a chunk, everything else is the label; a leading + (or the word "доход") marks
// income. Categories are guessed from what past entries with the same words used.
const UNCATEGORIZED_CAT="Не учтено";

function categoryIndexFromHistory(){
  const idx={};
  (DATA.finance.entries||[]).forEach(e=>{
    if(!e.category) return;
    const words=`${e.comment||""}`.toLowerCase().match(/[\wа-яё]{3,}/gi)||[];
    words.forEach(w=>{
      if(!idx[w]) idx[w]={};
      idx[w][e.category]=(idx[w][e.category]||0)+1;
    });
  });
  return idx;
}
function guessCategory(label, histIdx){
  const low=(label||"").toLowerCase();
  if(!low.trim()) return "";
  // an explicit category name inside the text always wins
  const direct=(DATA.financeCats||[]).find(c=>low.includes(c.name.toLowerCase()));
  if(direct) return direct.name;
  const words=low.match(/[\wа-яё]{3,}/gi)||[];
  const score={};
  words.forEach(w=>{
    const hit=histIdx[w];
    if(!hit) return;
    Object.keys(hit).forEach(cat=>{ score[cat]=(score[cat]||0)+hit[cat]; });
  });
  const best=Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
  return best||"";
}
function parseBulkEntries(text){
  const histIdx=categoryIndexFromHistory();
  const out=[];
  // a comma is a separator between items, but also a decimal point inside a number,
  // so only split on commas that aren't immediately followed by a digit
  (text||"").split(/[\n;]+|,(?!\d)/).forEach(raw=>{
    const chunk=raw.trim();
    if(!chunk) return;
    // amounts may use a comma decimal and spaces as thousand separators
    const nums=chunk.match(/\d[\d\s]*(?:[.,]\d+)?/g);
    if(!nums || !nums.length){ out.push({bad:true, raw:chunk}); return; }
    const numStr=nums[nums.length-1];
    const amount=parseFloat(numStr.replace(/\s/g,"").replace(",","."));
    if(!isFinite(amount) || amount<=0){ out.push({bad:true, raw:chunk}); return; }
    let label=chunk.slice(0, chunk.lastIndexOf(numStr))+chunk.slice(chunk.lastIndexOf(numStr)+numStr.length);
    label=label.replace(/[₽$€\-–—:]+/g," ").replace(/\s+/g," ").trim();
    // \b is ASCII-only in JS, so it never matches around Cyrillic — use explicit
    // letter boundaries with the unicode flag instead
    const isIncome=/^\+/.test(chunk) ||
      /(?:^|[^\p{L}])(доход\p{L}*|зарплат\p{L}*|аванс\p{L}*|преми\p{L}*|кэшбэк|кешбэк|возврат\p{L}*|перев[её]л\p{L}*|вернул\p{L}*)(?![\p{L}])/iu.test(chunk);
    label=label.replace(/^\+\s*/,"");
    out.push({amount, comment:label, category:guessCategory(label,histIdx),
      type:isIncome?"доход":"расход"});
  });
  return out;
}
function bulkDraft(){
  if(!cur.bulkDraft) cur.bulkDraft={text:"", overrides:{}};

function renderBulkAdd(){

// ---------- CASH RECONCILE ----------
// Counting a wallet and finding less than the app expected is normal — small cash
// spends go unlogged. Rather than quietly moving the starting balance, the gap is
// written as a real entry, so the leak stays visible in the category breakdown.
function ensureUncategorized(){
  ensureFinanceCats();
  if(!DATA.financeCats.some(c=>c.name===UNCATEGORIZED_CAT)){
    DATA.financeCats.push({name:UNCATEGORIZED_CAT, color:CAT_PALETTE[DATA.financeCats.length%CAT_PALETTE.length]});
  }
}
function reconcileAccount(accId, actual){
  const acc=(DATA.finance.accounts||[]).find(a=>String(a.id)===String(accId));
  if(!acc) return null;
  const expected=accountBalance(acc.id);
  const diff=actual-expected;
  if(Math.abs(diff)<0.005) return {diff:0, expected, actual};
  ensureUncategorized();
  DATA.finance.entries.push({
    date:todayStr(), time:nowTime(), amount:Math.abs(diff),
    type: diff<0? "расход":"доход",
    category:UNCATEGORIZED_CAT,
    comment:"Сверка кошелька",
    accountId:acc.id, reconcile:1
  });
  scheduleSave();
  return {diff, expected, actual};
}
// Everything the reconciliations have written off over the last N days.
function leakageSince(days){
  const from=new Date(); from.setDate(from.getDate()-(days||90));
  const fromStr=`${from.getFullYear()}-${pad2(from.getMonth()+1)}-${pad2(from.getDate())}`;
  let lost=0, found=0, n=0;
  (DATA.finance.entries||[]).forEach(e=>{
    if(!e.reconcile || !e.date || e.date<fromStr) return;
    n++;
    const v=toRub(+e.amount||0, entryCurrency(e)); if(e.type==="расход") lost+=v; else found+=v;
  });
  return {lost, found, net:lost-found, count:n};
}
function renderReconcilePanel(acc){
  const expected=accountBalance(acc.id);
  const sym=CURRENCY_SYMBOL[acc.currency]||acc.currency;
  const typed=cur.reconcileValue;

  const diff=isFinite(actual)? actual-expected : null;
  return `<div class="rec-panel">
    <div class="rec-top">
      <span style="font-size:12px;color:var(--grey);">Сколько на самом деле:</span>
      <input id="recInput" type="text" inputmode="decimal" placeholder="${expected.toLocaleString('ru-RU',{maximumFractionDigits:2})}" value="${typed==null?'':escapeHtml(String(typed))}">
      <span style="font-family:'JetBrains Mono',monospace;color:var(--grey);">${sym}</span>
      <button class="btn" id="recApply">Записать</button>
      <button class="btn ghost" id="recCancel">Отмена</button>
    </div>
    <div class="rec-diff">
      По записям сейчас <b>${expected.toLocaleString('ru-RU',{maximumFractionDigits:2})} ${sym}</b>
      ${diff!=null && Math.abs(diff)>=0.005
        ? ` · разница <b style="color:${diff<0?'var(--pink)':'var(--green)'}">${diff>0?'+':'−'}${Math.abs(diff).toLocaleString('ru-RU',{maximumFractionDigits:2})} ${sym}</b> — запишу как «${UNCATEGORIZED_CAT}»`
        : (diff!=null? " · сходится, записывать нечего" : "")}
    </div>
  </div>`;
}
function bindReconcile(){
  document.querySelectorAll('[data-recopen]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.recopen;
      cur.reconcileAcc = String(cur.reconcileAcc)===String(id) ? null : id;

    inp.onchange=()=>{ cur.reconcileValue=inp.value; render(); };

  }
  const apply=document.getElementById("recApply");

function applyReconcile(){
  const inp=document.getElementById("recInput");
  const actual=parseFloat(String(cur.reconcileValue==null?"":cur.reconcileValue).replace(",","."));
  if(!isFinite(actual)){ flashError(inp,"Введи фактическую сумму"); return; }
  const res=reconcileAccount(cur.reconcileAcc, actual);
  cur.reconcileAcc=null; cur.reconcileValue=null;

  if(res && res.diff===0) showBanner("✅ Всё сходится");
  else if(res) showBanner(res.diff<0
    ? `📝 Списано ${Math.abs(res.diff).toLocaleString('ru-RU',{maximumFractionDigits:2})} как «${UNCATEGORIZED_CAT}»`

}

// Money keeps the currency it was actually held in. Converting everything to
// roubles by default was lossy and misleading when a rate was stale or missing —
// so conversion is now opt-in, via the display-currency switcher.
const DISPLAY_CURRENCIES=["RUB","USD","EUR","USDT"];
function displayCurrency(){
  const v=(DATA.settings&&DATA.settings.displayCurrency)||"native";
  return v==="native" || DISPLAY_CURRENCIES.indexOf(v)>=0 ? v : "native";
}
function setDisplayCurrency(v){
  DATA.settings=DATA.settings||{};
  DATA.settings.displayCurrency=v;
  scheduleSave();
}
// Rate of one unit of `c` expressed in roubles; 0 means "we don't know yet".
function rateToRub(c){
  if(!c || c==="RUB") return 1;
  if(c==="EUR") return +DATA.prices.eurRub||0;
  // USDT — по Rapira, когда приложение умеет её спрашивать; иначе как доллар
  if(c==="USDT" && +DATA.prices.usdtRub>0) return +DATA.prices.usdtRub;
  return +DATA.prices.usdRub||0;
}
// Returns null when the conversion can't be done honestly, so callers can say so
// instead of silently rendering a zero.
function convertMoney(amount, from, to){
  if(!to || from===to) return amount;
  const rf=rateToRub(from), rt=rateToRub(to);
  if(!rf || !rt) return null;
  return amount*rf/rt;
}
function fmtMoney(amount, curr, digits){
  const sym=CURRENCY_SYMBOL[curr]||curr;
  const d = digits==null ? (Math.abs(amount)>=1000?0:2) : digits;
  return `${(+amount||0).toLocaleString('ru-RU',{maximumFractionDigits:d})} ${sym}`;
}
// {RUB: 1000, USD: 20} -> "1 000 ₽ · 20 $", biggest bucket first
function fmtMoneyMap(map, digits){
  const keys=Object.keys(map).filter(k=>Math.abs(map[k])>0.005);
  if(!keys.length) return fmtMoney(0,"RUB",0);
  keys.sort((a,b)=>Math.abs(map[b]*rateToRub(b))-Math.abs(map[a]*rateToRub(a)));
  return `<span class="money-multi">${keys.map(k=>fmtMoney(map[k],k,digits)).join('<i>·</i>')}</span>`;
}
function addToMap(map, amount, curr){
  if(!amount) return map;
  map[curr||"RUB"]=(map[curr||"RUB"]||0)+amount;
  return map;
}
// Collapses a per-currency map into the chosen display currency. In "native" mode
// nothing is converted. Returns {ok, value, currency, missing:[...]}.
function collapseMap(map){
  const disp=displayCurrency();
  if(disp==="native") return {ok:false, native:true, map, missing:[]};
  let total=0; const missing=[];
  Object.keys(map).forEach(k=>{
    if(Math.abs(map[k])<0.005) return;
    const v=convertMoney(map[k], k, disp);
    if(v==null) missing.push(k); else total+=v;
  });
  return {ok:true, value:total, currency:disp, map, missing};
}
function renderMoneySum(map, digits){
  const c=collapseMap(map);
  if(c.native) return fmtMoneyMap(map, digits);
  const warn=c.missing.length? `<span style="color:var(--pink);font-size:10px;"> без ${c.missing.join(", ")}</span>` : "";
  return fmtMoney(c.value, c.currency, digits)+warn;
}

// ---------- FORECAST ----------
// A month's spending is two different animals: subscriptions that will definitely
// hit on a known day, and everyday spending that only has a rate. Forecasting them
// together as one average is what makes naive projections wrong, so they're split:
// upcoming recurring charges are added as known events, and only the discretionary
// remainder is extrapolated — blended with previous months so that day 2 of the
// month doesn't produce a wild number from a single big purchase.
// Все записи в рублях по курсу. Раньше бюджет, прогноз, календарь, категории и
// итоги брали только рублёвые записи, и расход в USDT давал «потрачено 0 ₽».
// Без курса запись пропускается — её сумма честно неизвестна, и об этом говорит
// spendRateNote(). Копии помнят номер записи (_i) и исходную валюту (_cur).
function entriesInRub(){
  return (DATA.finance.entries||[]).map((e,i)=>{
    const c=entryCurrency(e);
    const v = c==="RUB" ? (+e.amount||0) : convertMoney(+e.amount||0, c, "RUB");
    return v==null ? null : {...e, amount:v, currency:"RUB", _i:i, _cur:c};
  }).filter(Boolean);
}
// Под «Потрачено»: какие траты пересчитаны и по какому курсу, а каких курсов нет
function spendRateNote(){
  const now=new Date(), prefix=`${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const other={}, miss=new Set();
  (DATA.finance.entries||[]).forEach(e=>{
    if(e.type==="доход" || !e.date || e.date.slice(0,7)!==prefix) return;
    const c=entryCurrency(e);
    if(c==="RUB") return;
    if(!rateToRub(c)) miss.add(c); else other[c]=(other[c]||0)+(+e.amount||0);
  });
  const out=[];
  const cs=Object.keys(other);
  if(cs.length) out.push(`<div class="fx-sub" style="margin-top:6px;">Включая ${cs.map(c=>
    `${fmtMoney(other[c],c)} по курсу ${rateToRub(c).toLocaleString('ru-RU',{maximumFractionDigits:2})} ₽${c==="USDT" && +DATA.prices.usdtRub>0? " (Rapira)" : ""}`).join(", ")}</div>`);
  if(miss.size) out.push(`<div class="fx-warn">Нет курса для ${[...miss].join(", ")} — эти траты пока не вошли. <button data-fxrates="1">Обновить курс</button></div>`);
  return out.join("");
}
function rubEntriesAll(){ return entriesInRub(); }
function monthSums(prefix, entries){
  let inc=0, exp=0, expRec=0;
  entries.forEach(e=>{
    if(!e.date || e.date.slice(0,7)!==prefix) return;
    const v=+e.amount||0;
    if(e.type==="доход") inc+=v;
    else { exp+=v; if(e.recurringId) expRec+=v; }
  });
  return {inc, exp, expRec, discretionary:exp-expRec};
}
// Charges from recurring templates whose day hasn't arrived yet this month.
function upcomingRecurring(){
  const now=new Date();
  const nd=daysInMonth(now.getFullYear(), now.getMonth());
  const prefix=`${now.getFullYear()}-${pad2(now.getMonth()+1)}`;
  const rubIds=rubAccountIds();
  const out={expense:0, income:0, list:[]};
  (DATA.finance.recurring||[]).forEach(r=>{
    const day=Math.max(1,Math.min(31,+r.day||1,nd));
    if(day<=now.getDate()) return;                       // already applied by applyRecurring
    const accId=r.accountId||defaultAccountId();
    if(accountCurrency(accId)!=="RUB") return;
    const already=DATA.finance.entries.some(e=>e.recurringId===r.id && e.date && e.date.slice(0,7)===prefix);
    if(already) return;
    const amount=+r.amount||0;
    if(!amount) return;
    if(r.type==="доход") out.income+=amount; else out.expense+=amount;
    out.list.push({day, amount, type:r.type==="доход"?"доход":"расход", name:r.comment||r.category||"регулярный платёж"});
  });
  out.list.sort((a,b)=>a.day-b.day);
  return out;
}
function financeForecast(){
  const entries=rubEntriesAll();
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth();
  const nd=daysInMonth(y,m);
  const dayNow=Math.min(now.getDate(), nd);
  const daysLeft=Math.max(0, nd-dayNow);
  const prefix=`${y}-${pad2(m+1)}`;
  const cur=monthSums(prefix, entries);

  // up to three previous months, only those with any activity
  const history=[];
  for(let back=1; back<=3; back++){
    const d=new Date(y, m-back, 1);
    const p=`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
    const s=monthSums(p, entries);
    if(s.exp>0 || s.inc>0) history.push({prefix:p, nd:daysInMonth(d.getFullYear(),d.getMonth()), ...s});
  }
  const histDaily = history.length
    ? history.reduce((s,h)=>s+h.discretionary/h.nd,0)/history.length
    : 0;
  const curDaily = dayNow>0 ? cur.discretionary/dayNow : 0;
  // early in the month trust history; by the end trust what actually happened
  const w = Math.min(1, dayNow/nd);
  const dailyEstimate = history.length ? (curDaily*w + histDaily*(1-w)) : curDaily;

  const up=upcomingRecurring();
  const restDiscretionary = dailyEstimate*daysLeft;
  const forecastExpense = cur.exp + restDiscretionary + up.expense;
  const forecastIncome = cur.inc + up.income;

  // current balance across rouble accounts only, to match the rest of this card
  const balance=DATA.finance.accounts.reduce((s,a)=>{
    const v=convertMoney(accountBalance(a.id), a.currency||"RUB", "RUB");
    return s+(v==null? 0 : v);
  },0);
  const endBalance = balance + up.income - (restDiscretionary + up.expense);

  const budget=+DATA.finance.budgetLimit||0;
  const safePerDay = (budget && daysLeft>0)
    ? Math.max(0, (budget - cur.exp - up.expense)/daysLeft)
    : null;

  // how long the money lasts with no income at all, at the full monthly burn rate
  const monthlyBurn = history.length
    ? history.reduce((s,h)=>s+h.exp,0)/history.length
    : (dayNow>0 ? cur.exp/dayNow*nd : 0);
  const runwayMonths = monthlyBurn>0 ? balance/monthlyBurn : null;

  return {nd, dayNow, daysLeft, cur, history, dailyEstimate, restDiscretionary,
    up, forecastExpense, forecastIncome, balance, endBalance, budget, safePerDay,
    monthlyBurn, runwayMonths};
}
function fmtRub(n, digits){
  return `${Math.round(+n||0).toLocaleString('ru-RU',{maximumFractionDigits:digits||0})} ₽`;
}
// Cumulative spend so far as a solid line, the projection as a dashed one, plus a
// flat budget line — the moment the dashes cross it is the whole point of the chart.
function drawForecastChart(canvasId, f){

  const padL=6, padR=46, padT=10, padB=16;

  const entries=rubEntriesAll();
  const prefix=`${new Date().getFullYear()}-${pad2(new Date().getMonth()+1)}`;
  const perDay=new Array(f.nd+1).fill(0);
  entries.forEach(e=>{
    if(e.type!=="расход" || !e.date || e.date.slice(0,7)!==prefix) return;
    const d=parseInt(e.date.slice(8,10),10);
    if(d>=1 && d<=f.nd) perDay[d]+=(+e.amount||0);
  });
  const actual=[]; let acc=0;
  for(let d=1; d<=f.dayNow; d++){ acc+=perDay[d]; actual.push(acc); }

  const upByDay={};
  f.up.list.forEach(x=>{ if(x.type==="расход") upByDay[x.day]=(upByDay[x.day]||0)+x.amount; });
  const projected=[]; let pacc=acc;
  for(let d=f.dayNow+1; d<=f.nd; d++){
    pacc+=f.dailyEstimate+(upByDay[d]||0);
    projected.push(pacc);
  }
  const top=Math.max(f.budget||0, pacc, acc, 1)*1.08;
  const xOf=d=>padL+(f.nd>1? (d-1)/(f.nd-1)*chartW : chartW/2);
  const yOf=v=>padT+chartH-(v/top)*chartH;

  if(f.budget){
    ctx.strokeStyle=cssVar("--pink"); ctx.lineWidth=1;
    if(ctx.setLineDash) ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(padL,yOf(f.budget)); ctx.lineTo(W-padR,yOf(f.budget)); ctx.stroke();
    if(ctx.setLineDash) ctx.setLineDash([]);
    ctx.font="9px 'JetBrains Mono',monospace"; ctx.fillStyle=cssVar("--pink"); ctx.textAlign="left";
    ctx.fillText("лимит", W-padR+4, yOf(f.budget)+3);
  }
  if(actual.length){
    ctx.beginPath(); ctx.moveTo(xOf(1), yOf(actual[0]));
    actual.forEach((v,i)=>ctx.lineTo(xOf(i+1), yOf(v)));
    ctx.strokeStyle=cssVar("--amber"); ctx.lineWidth=2.4; ctx.lineJoin="round"; ctx.stroke();
  }
  if(projected.length && actual.length){
    ctx.beginPath(); ctx.moveTo(xOf(f.dayNow), yOf(actual[actual.length-1]));
    projected.forEach((v,i)=>ctx.lineTo(xOf(f.dayNow+1+i), yOf(v)));
    ctx.strokeStyle=cssVar("--grey"); ctx.lineWidth=2;
    if(ctx.setLineDash) ctx.setLineDash([4,4]);
    ctx.stroke();
    if(ctx.setLineDash) ctx.setLineDash([]);
  }
  ctx.font="9px 'JetBrains Mono',monospace"; ctx.fillStyle=cssVar("--grey"); ctx.textAlign="left";
  ctx.fillText(Math.round(pacc).toLocaleString('ru-RU'), W-padR+4, yOf(pacc)+3);
  ctx.textAlign="center";
  [1, Math.round(f.nd/2), f.nd].forEach(d=>ctx.fillText(String(d), xOf(d), H-3));
}

/* ---------- ПЕРИОД АНАЛИТИКИ ---------- */
// Раньше «Расходы по категориям» считались за всё время: столбики только росли и
// через год уже ничего не говорили о том, куда уходят деньги сейчас. Теперь весь
// разбор трат считается за выбранный отрезок и сравнивается с предыдущим таким же.
// Период живёт в cur, а не в DATA — это взгляд на данные, а не сами данные.
const FIN_PERIODS=[["month","Этот месяц"],["prev","Прошлый"],["3m","3 месяца"],["year","Год"],["all","Всё время"]];
const FIN_PAGE=60;
const NO_CAT="Без категории";

function dstr(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
// «13-й месяц» и «-1-й» нормализует сам Date — так не нужно делить с остатком
function monthRange(y,m){
  const s=new Date(y,m,1);
  const yy=s.getFullYear(), mm=s.getMonth();
  return {y:yy, m:mm, from:dstr(yy,mm,1), to:dstr(yy,mm,daysInMonth(yy,mm))};
}
// Даты записей — строки YYYY-MM-DD, поэтому и границы строки: сравнение
// лексикографическое и не требует разбора в Date на каждой записи.
function finPeriod(){
  const key=FIN_PERIODS.some(p=>p[0]===cur.finPeriod)? cur.finPeriod : "month";
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(key==="month" || key==="prev"){
    const back=key==="prev"?1:0;
    const c=monthRange(y,m-back), p=monthRange(y,m-back-1);
    return {key, monthly:true, title:`${MONTHS_RU[c.m].toLowerCase()} ${c.y}`,
            prevTitle:"к прошлому месяцу", from:c.from, to:c.to, prevFrom:p.from, prevTo:p.to};
  }
  if(key==="3m"){
    const a=monthRange(y,m-2), b=monthRange(y,m), pa=monthRange(y,m-5), pb=monthRange(y,m-3);
    return {key, monthly:false, title:`${MONTHS_RU[a.m].toLowerCase()} — ${MONTHS_RU[b.m].toLowerCase()} ${b.y}`,
            prevTitle:"к предыдущим трём", from:a.from, to:b.to, prevFrom:pa.from, prevTo:pb.to};
  }
  if(key==="year"){
    return {key, monthly:false, title:`${y} год`, prevTitle:`к ${y-1}`,
            from:dstr(y,0,1), to:dstr(y,11,31), prevFrom:dstr(y-1,0,1), prevTo:dstr(y-1,11,31)};
  }
  return {key, monthly:false, title:"всё время", prevTitle:"", from:"", to:"", prevFrom:"", prevTo:""};
}
function finYear(){
  if(!cur.finYear) cur.finYear=new Date().getFullYear();
  return cur.finYear;
}
function inRange(e, from, to){
  if(!from) return true;
  return !!e.date && e.date>=from && e.date<=to;
}
// расходы по рублёвым счетам — та же выборка, что у бюджета и прогноза
function rubExpenses(from, to){
  return entriesInRub().filter(e=>e.type==="расход" && inRange(e, from, to));
}
// В отличие от прежнего подсчёта сюда попадают и записи без категории, и категории,
// удалённые из списка: раньше они молча выпадали, и сумма столбиков не сходилась
// с реальными тратами месяца.
function finCatStats(from, to){
  const colors={};
  (DATA.financeCats||[]).forEach(c=>{ colors[c.name]=c.color; });
  const byName={};
  let total=0;
  rubExpenses(from,to).forEach(e=>{
    const name=e.category||NO_CAT;
    if(!byName[name]) byName[name]={name, sum:0, count:0, color:colors[name]||"var(--grey-dim)",
                                    gone:!colors[name] && name!==NO_CAT};
    byName[name].sum+=(+e.amount||0);
    byName[name].count++;
    total+=(+e.amount||0);
  });
  const list=Object.keys(byName).map(k=>byName[k]);
  list.forEach(c=>{ c.avg=c.count? c.sum/c.count : 0; c.share=total? c.sum/total*100 : 0; });
  list.sort((a,b)=>b.sum-a.sum);
  return {list, total, byName};
}
function catLimits(){
  if(!DATA.finance.catLimits) DATA.finance.catLimits={};
  return DATA.finance.catLimits;
}
function fmtDelta(now, was){
  if(!was) return now>0? {txt:"новое", cls:"up"} : null;
  const p=Math.round((now-was)/was*100);
  if(!isFinite(p) || p===0) return {txt:"как раньше", cls:""};
  return {txt:`${p>0?"+":"−"}${Math.abs(p)}%`, cls:p>0?"up":"down"};
}
function daysBetween(a,b){
  const pa=parseLocalDate(a), pb=parseLocalDate(b);
  if(!pa||!pb) return 0;
  return Math.round((pb-pa)/86400000);
}
// Сколько дней периода уже прошло: делить траты на будущие дни нечестно.
function periodDays(p){
  const today=todayStr();
  if(!p.from){
    const ds=(DATA.finance.entries||[]).map(e=>e.date).filter(Boolean).sort();
    return ds.length? daysBetween(ds[0], today)+1 : 0;
  }
  const end = p.to>today? today : p.to;
  return end<p.from? 0 : daysBetween(p.from, end)+1;
}
// Сколько потрачено в месяце (y,m) по то же число включительно — чтобы сравнивать
// «сегодня» с той же точкой прошлого месяца, а не с его итогом.
function spentByDayOfMonth(y, m, day){
  const r=monthRange(y,m);
  const prefix=`${r.y}-${pad2(r.m+1)}`;
  const ids=rubAccountIds();
  let s=0;
  entriesInRub().forEach(e=>{
    if(e.type!=="расход" || !e.date || e.date.slice(0,7)!==prefix) return;
    if(parseInt(e.date.slice(8,10),10)>day) return;
    s+=(+e.amount||0);
  });
  return s;
}

    `<button class="fchip ${p.key===k?"on":""}" data-finper="${k}">${lab}</button>`).join("")}</div>`;
}

  const lim=catLimits();
  const editing=!!cur.catLimitEdit;

  // категория с лимитом показывается даже без трат — иначе не видно, что запас цел
  const rows=st.list.slice();
  if(p.monthly) Object.keys(lim).forEach(name=>{
    if(+lim[name]>0 && !st.byName[name]){
      const c=(DATA.financeCats||[]).find(x=>x.name===name);
      rows.push({name, sum:0, count:0, avg:0, share:0, color:(c&&c.color)||"var(--grey-dim)", gone:!c});
    }
  });
  const maxSum=Math.max(1, ...rows.map(r=>r.sum));
  const overCount=p.monthly? rows.filter(r=>+lim[r.name]>0 && r.sum>+lim[r.name]).length : 0;

  const limitRows=(DATA.financeCats||[]).map(c=>({name:c.name}))
    .concat(rows.filter(r=>r.gone||r.name===NO_CAT).map(r=>({name:r.name})))
    .map(c=>`<div class="cat-lim-row">
        <div class="n">${escapeHtml(c.name)}</div>

        <span class="u">₽/мес</span>
      </div>`).join("");

  const barRows=rows.map(r=>{
    const limit=p.monthly? (+lim[r.name]||0) : 0;
    const over=limit>0 && r.sum>limit;
    const pct=limit>0? Math.min(100, Math.round(r.sum/limit*100)) : Math.round(r.sum/maxSum*100);
    const d=prev? fmtDelta(r.sum, (prev.byName[r.name]||{}).sum||0) : null;
    const meta=[];
    if(limit>0) meta.push(over? `лимит ${fmtRub(limit)} · превышен на ${fmtRub(r.sum-limit)}`
                              : `лимит ${fmtRub(limit)} · осталось ${fmtRub(limit-r.sum)}`);
    else meta.push(`${Math.round(r.share)}% трат`);
    if(r.count) meta.push(`${r.count} ${plural(r.count,"запись","записи","записей")}`);
    if(r.count>1) meta.push(`в среднем ${fmtRub(r.avg)}`);
    return `<div class="cat-row ${over?"over":""}" data-catdrill="${escapeHtml(r.name)}">

      <div class="cr-meta">
        <span class="m">${meta.join(" · ")}</span>
        ${d? `<span class="cr-delta ${d.cls}">${d.txt}</span>`:""}
      </div>
    </div>`;
  }).join("");

  const totalDelta=prev? fmtDelta(st.total, prev.total) : null;
  const catChips=DATA.financeCats.map((c,i)=>
    `<span class="cat-chip" style="background:${c.color}22;color:${c.color};border:1px solid ${c.color}55;">${escapeHtml(c.name)}<button data-delfincat="${i}">✕</button></span>`).join("");

  return `<div class="card">
    <h2>Расходы по категориям <span style="font-size:11px;color:var(--grey-dim);font-weight:400;">(всё в ₽ по курсу)</span></h2>
    ${renderFinPeriodChips()}
    <div class="fc-head">
      <span class="fc-big" style="color:var(--white)">${fmtRub(st.total)}</span>
      <span class="fc-cap">за ${p.title}${totalDelta? ` · <b class="cr-delta ${totalDelta.cls}">${totalDelta.txt}</b> ${p.prevTitle}`:""}</span>
    </div>
    ${overCount? `<div class="fc-warn">Лимит превышен по ${overCount} ${plural(overCount,"категории","категориям","категориям")}.</div>`:""}
    <div style="margin-top:10px;">${editing? limitRows : (rows.length? barRows : '<div class="empty">За этот период трат не было</div>')}</div>
    <div class="fin-more">

      <span class="c">${editing? "пусто или 0 — без лимита" : "нажми на категорию, чтобы увидеть её записи"}</span>
    </div>

    <div class="add-row" style="margin-top:10px;">

/* ---------- КУДА УХОДЯТ ДЕНЬГИ ---------- */
// Столбики отвечают на «сколько», этот блок — на «на что именно».
function renderSpendInsights(){
  const p=finPeriod();
  const rows=rubExpenses(p.from, p.to);
  if(rows.length<3) return "";

  const top=rows.slice().sort((a,b)=>(+b.amount||0)-(+a.amount||0)).slice(0,5).map(e=>{
    const dt=parseLocalDate(e.date);
    const sub=[dt? `${dt.getDate()} ${MONTHS_SHORT[dt.getMonth()].toLowerCase()}`:"", e.category||""].filter(Boolean).join(" · ");
    return `<div class="ins-row">
      <div class="l">${escapeHtml(e.comment||e.category||"без названия")}${sub? `<small>${escapeHtml(sub)}</small>`:""}</div>
      <div class="v">${fmtRub(+e.amount||0)}</div>
    </div>`;
  }).join("");

  // «повторяется» — одинаковый комментарий: так видно привычные траты, которые по
  // одной кажутся мелочью, а за месяц собираются в заметную сумму
  const byLabel={};
  rows.forEach(e=>{
    const key=(e.comment||"").toLowerCase().replace(/\s+/g," ").trim();
    if(!key) return;
    if(!byLabel[key]) byLabel[key]={label:e.comment, sum:0, count:0};
    byLabel[key].sum+=(+e.amount||0);
    byLabel[key].count++;
  });
  const repeat=Object.keys(byLabel).map(k=>byLabel[k]).filter(x=>x.count>1)
    .sort((a,b)=>b.sum-a.sum).slice(0,5).map(x=>
      `<div class="ins-row">
        <div class="l">${escapeHtml(x.label)}<small>${x.count} ${plural(x.count,"раз","раза","раз")} · в среднем ${fmtRub(x.sum/x.count)}</small></div>
        <div class="v">${fmtRub(x.sum)}</div>
      </div>`).join("");

  const byDay={};
  rows.forEach(e=>{ if(e.date) byDay[e.date]=(byDay[e.date]||0)+(+e.amount||0); });
  const days=Object.keys(byDay);
  const worst=days.slice().sort((a,b)=>byDay[b]-byDay[a])[0];
  const wd=worst? parseLocalDate(worst) : null;
  const total=rows.reduce((s,e)=>s+(+e.amount||0),0);
  const span=periodDays(p);
  const quiet=span? Math.max(0, span-days.length) : 0;

  return `<div class="card">
    <h2>Куда уходят деньги <span style="font-size:11px;color:var(--grey-dim);font-weight:400;">за ${p.title}</span></h2>
    <div class="fc-daily">
      <div class="b"><div class="k">В среднем в день</div><div class="n">${fmtRub(span? total/span : 0)}</div>
        <div class="s">${span? `${span} ${plural(span,"день","дня","дней")} прошло` : ""}</div></div>
      <div class="b"><div class="k">Самый дорогой день</div><div class="n">${worst? fmtRub(byDay[worst]) : "—"}</div>
        <div class="s">${wd? `${wd.getDate()} ${MONTHS_GEN[wd.getMonth()]}` : ""}</div></div>
      <div class="b"><div class="k">Дней без трат</div><div class="n">${quiet}</div>
        <div class="s">${span? `из ${span}` : ""}</div></div>
    </div>
    <div class="ins-cols" style="margin-top:14px;">
      <div><h3>Самые крупные</h3><div class="ins-list">${top}</div></div>
      ${repeat? `<div><h3>Повторяется чаще всего</h3><div class="ins-list">${repeat}</div></div>`:""}
    </div>
  </div>`;
}

/* ---------- БЮДЖЕТ МЕСЯЦА ---------- */
// Раньше в этой карточке был свой наивный прогноз (потрачено ÷ прошедшие дни ×
// длина месяца), и он расходился с прогнозом в карточке ниже — два разных числа
// на одном экране. Теперь оба берутся из financeForecast().
function renderBudgetCard(){
